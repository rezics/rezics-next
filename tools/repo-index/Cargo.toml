[package]
name = "repo-index"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
base64 = "=0.22.1"
blake3 = "=1.8.3"
flate2 = "=1.1.5"
oxc_allocator = "=0.152.0"
oxc_ast = { version = "=0.152.0", features = ["serialize"] }
oxc_ast_visit = "=0.152.0"
oxc_parser = "=0.152.0"
oxc_resolver = "=11.24.3"
oxc_span = "=0.152.0"
pg_query = "=6.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["raw_value"] }
sha2 = "=0.10.9"

[profile.release]
strip = true
