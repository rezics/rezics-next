name: shadcn sync reminder

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Record runner image and Bun revision
        run: |
          echo "Runner image: $ImageOS $ImageVersion"
          bun --revision
      - name: Check whether a shared sync issue is needed
        run: bun packages/ui/scripts/shadcn-sync-check.ts
        env:
          GH_TOKEN: ${{ github.token }}
