id: https://rezics.com/catalogue/anime
name: anime
version: 1.0.0
description: Anime work, season, episode, film and publication release profile terms.
prefixes:
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  wd: http://www.wikidata.org/entity/
  wdt: http://www.wikidata.org/prop/direct/
  rezics: https://rezics.com/vocab/
  bf: http://id.loc.gov/ontologies/bibframe/
  marcrel: http://id.loc.gov/vocabulary/relators/
default_range: string
imports:
  - linkml:types
  - core
  - classification
classes:
  AnimeRelease:
    is_a: CreativeWork
    class_uri: rezics:AnimeRelease
    description: >-
      An independently identified publication or distributed embodiment of anime content,
      distinct from its work, season or episode, a playback file, personal copy or distribution event.
      Languages and formats describe one identified publication, not a Cartesian product of releases.
      A single-work publication uses exampleOfWork; an anthology contains its actual works with
      animeReleaseContains. Credits and publication facts describe this release only and are never
      copied from its work. Source-record version is not a cut or edition designation.
    slots:
      - alternateName
      - abstract
      - exampleOfWork
      - animeReleaseContains
      - filmDistributor
      - inLanguage
      - datePublished
      - distributionFormat
      - copyrightNotice
      - publisher
      - translator
      - author
      - illustrator
      - director
      - musicBy
      - producer
      - productionCompany
      - screenwriter
      - voiceActor
    annotations:
      facets: exampleOfWork animeReleaseContains filmDistributor inLanguage datePublished distributionFormat publisher translator author illustrator director musicBy producer productionCompany screenwriter voiceActor
      schema_org_type: https://schema.org/CreativeWork
  TVSeries:
    is_a: CreativeWorkSeries
    class_uri: schema:TVSeries
    description: >-
      An animated television series. Its browse facets follow Bangumi's anime browser:
      https://bgm.tv/anime/browser.
    exact_mappings:
      - wd:Q5398426
    slots:
      - bangumiSubjectId
      - abstract
      - alternateName
      - datePublished
      - inLanguage
      - startDate
      - endDate
      - numberOfEpisodes
      - originalBroadcaster
      - descriptiveLink
      - copyrightNotice
      - author
      - illustrator
      - director
      - musicBy
      - producer
      - productionCompany
      - screenwriter
      - developer
      - voiceActor
      - contributor
      - character
      - genre
      - keywords
      - partOfSeries
      - workFormat
    annotations:
      library:
        id: anime.series
        entryStateSet:
          id: legacy-five
          states:
            - { id: planned, role: planned }
            - { id: in_progress, role: active }
            - { id: completed, role: completed }
            - { id: paused, role: paused }
            - { id: dropped, role: dropped }
        progress:
          allowed:
            - mode: scalar_amount
              units:
                - id: episode
                  minimum: '0'
                  totalPolicy: optional
                  identity: { kind: none }
                  structure: { kind: none }
        copies:
          kinds:
            - id: physical
              statuses: [{ id: owned }, { id: disposed }]
            - id: digital
              statuses: [{ id: owned }]
        importSources: []
      facets: workFormat genre keywords datePublished numberOfEpisodes author illustrator director musicBy producer productionCompany screenwriter developer voiceActor character partOfSeries
      schema_org_type: https://schema.org/TVSeries
  Movie:
    is_a: LaunchWork
    class_uri: schema:Movie
    description: >-
      An animated feature or short film (https://schema.org/Movie;
      https://www.wikidata.org/wiki/Q11424). Its browse facets follow Bangumi's anime browser:
      https://bgm.tv/anime/browser.
    exact_mappings:
      - wd:Q11424
    slots:
      - bangumiSubjectId
      - alternateName
      - datePublished
      - duration
      - descriptiveLink
      - copyrightNotice
      - author
      - illustrator
      - director
      - musicBy
      - producer
      - productionCompany
      - screenwriter
      - developer
      - voiceActor
      - contributor
      - character
      - genre
      - keywords
      - partOfSeries
      - workFormat
    annotations:
      library:
        id: anime.film
        entryStateSet:
          id: legacy-five
          states:
            - { id: planned, role: planned }
            - { id: in_progress, role: active }
            - { id: completed, role: completed }
            - { id: paused, role: paused }
            - { id: dropped, role: dropped }
        progress:
          allowed:
            - mode: scalar_amount
              units:
                - id: minute
                  minimum: '0'
                  totalPolicy: optional
                  identity: { kind: none }
                  structure: { kind: none }
        copies:
          kinds:
            - id: physical
              statuses: [{ id: owned }, { id: disposed }]
            - id: digital
              statuses: [{ id: owned }]
        importSources: []
      facets: workFormat genre keywords datePublished author illustrator director musicBy producer productionCompany screenwriter developer voiceActor contributor character partOfSeries
      schema_org_type: https://schema.org/Movie
  TVSeason:
    is_a: LaunchWork
    class_uri: schema:TVSeason
    description: >-
      A separately identified television season (https://schema.org/TVSeason;
      https://www.wikidata.org/wiki/Q3464665). Its browse facets follow Bangumi's anime browser:
      https://bgm.tv/anime/browser.
    exact_mappings:
      - wd:Q3464665
    slots:
      - bangumiSubjectId
      - datePublished
      - startDate
      - endDate
      - numberOfEpisodes
      - descriptiveLink
      - author
      - illustrator
      - director
      - musicBy
      - producer
      - productionCompany
      - screenwriter
      - developer
      - voiceActor
      - contributor
      - character
      - genre
      - keywords
      - partOfSeries
      - workFormat
    annotations:
      library:
        id: anime.season
        entryStateSet:
          id: legacy-five
          states:
            - { id: planned, role: planned }
            - { id: in_progress, role: active }
            - { id: completed, role: completed }
            - { id: paused, role: paused }
            - { id: dropped, role: dropped }
        progress:
          allowed:
            - mode: scalar_amount
              units:
                - id: episode
                  minimum: '0'
                  totalPolicy: optional
                  identity: { kind: none }
                  structure: { kind: none }
        copies:
          kinds:
            - id: physical
              statuses: [{ id: owned }, { id: disposed }]
            - id: digital
              statuses: [{ id: owned }]
        importSources: []
      facets: workFormat genre keywords datePublished numberOfEpisodes author illustrator director musicBy producer productionCompany screenwriter developer voiceActor character partOfSeries
      schema_org_type: https://schema.org/TVSeason
  Episode:
    is_a: LaunchWork
    class_uri: schema:Episode
    description: >-
      A separately identified episode or other installment of an anime work. Its browse facets follow Bangumi's anime
      browser: https://bgm.tv/anime/browser.
    exact_mappings:
      - wd:Q1983062
    slots:
      - translator
      - publisher
      - developer
      - screenwriter
      - productionCompany
      - producer
      - illustrator
      - author
      - datePublished
      - duration
      - episodeNumber
      - isPartOf
      - director
      - musicBy
      - contributor
      - character
      - voiceActor
      - genre
      - keywords
    annotations:
      library:
        id: anime.episode
        entryStateSet:
          id: legacy-five
          states:
            - { id: planned, role: planned }
            - { id: in_progress, role: active }
            - { id: completed, role: completed }
            - { id: paused, role: paused }
            - { id: dropped, role: dropped }
        progress:
          allowed:
            - mode: scalar_amount
              units:
                - id: minute
                  minimum: '0'
                  totalPolicy: optional
                  identity: { kind: none }
                  structure: { kind: none }
        copies:
          kinds:
            - id: physical
              statuses: [{ id: owned }, { id: disposed }]
            - id: digital
              statuses: [{ id: owned }]
        importSources: []
      facets: isPartOf datePublished duration director musicBy voiceActor contributor character partOfSeries genre keywords inLanguage author illustrator screenwriter producer
      schema_org_type: https://schema.org/Episode
slots:
  animeReleaseContains:
    slot_uri: bf:hasPart
    description: An independently identified anime work included in this anthology publication.
    any_of:
      - range: TVSeries
      - range: Movie
      - range: TVSeason
      - range: Episode
    multivalued: true
    annotations:
      datatype: wikibase-item
      relation_group: membership
      inverse: bf:partOf
      relation_order: name
      acyclic: true
  filmDistributor:
    slot_uri: marcrel:fds
    description: A person or organization credited with distributing this moving-image publication.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole appliesToPart
      relation_group: credit
      inverse: rezics:filmDistributionOf
      relation_order: position
      relation_filter: [wdt:P3831, wdt:P518]
  numberOfEpisodes:
    slot_uri: schema:numberOfEpisodes
    description: The number of episodes or installments in the work or season.
    range: integer
    minimum_value: 0
    close_mappings:
      - wd:P1113
    annotations:
      datatype: quantity
      units: '1'
  startDate:
    slot_uri: schema:startDate
    description: The start of the original broadcast or release period.
    range: date
    exact_mappings:
      - wd:P580
    annotations:
      datatype: time
  endDate:
    slot_uri: schema:endDate
    description: The end of the original broadcast or release period.
    range: date
    exact_mappings:
      - wd:P582
    annotations:
      datatype: time
  originalBroadcaster:
    slot_uri: wdt:P449
    description: The original broadcaster, when the source identifies the first broadcast.
    range: Organization
    multivalued: true
    exact_mappings:
      - wd:P449
    annotations:
      datatype: wikibase-item
      relation_group: association
      inverse: rezics:originalBroadcastOf
      relation_order: name
  descriptiveLink:
    slot_uri: wdt:P973
    description: A link to a descriptive page about the anime work.
    range: uri
    multivalued: true
    exact_mappings:
      - wd:P973
    annotations:
      datatype: url
  copyrightNotice:
    slot_uri: schema:copyrightNotice
    description: A source copyright notice, which does not establish a reuse licence.
    multivalued: true
    close_mappings:
      - wd:P6216
    annotations:
      datatype: string
  duration:
    slot_uri: schema:duration
    description: The stated running time in seconds where its units are explicit.
    range: integer
    minimum_value: 0
    exact_mappings:
      - wd:P2047
    annotations:
      datatype: quantity
      units: wd:Q11574
  episodeNumber:
    slot_uri: schema:episodeNumber
    description: >-
      The source episode ordinal, stored apart from the episode identifier so that zero, specials, fractional ordinals
      and gaps remain expressible.
    exact_mappings:
      - wd:P1545
    annotations:
      datatype: string
  isPartOf:
    slot_uri: schema:isPartOf
    description: The television series or season containing this episode.
    any_of:
      - range: TVSeries
      - range: TVSeason
    exact_mappings:
      - wd:P361
    annotations:
      datatype: wikibase-item
      relation_group: membership
      inverse: schema:hasPart
      relation_order: name
      acyclic: true
