id: https://rezics.com/catalogue/classification
name: classification
version: 1.0.0
description: Classification profile terms.
prefixes:
  rezics: https://rezics.com/vocab/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  wd: http://www.wikidata.org/entity/
  wdt: http://www.wikidata.org/prop/direct/
  skos: http://www.w3.org/2004/02/skos/core#
  foaf: http://xmlns.com/foaf/0.1/
default_range: string
imports:
  - linkml:types
  - core
classes:
  Concept:
    is_a: Thing
    class_uri: skos:Concept
    description: A classification concept, optionally standing for a subject through its focus.
    slots:
      - inScheme
      - broader
      - focus
    annotations:
      schema_org_type: https://schema.org/DefinedTerm
  ConceptScheme:
    is_a: Thing
    class_uri: skos:ConceptScheme
    description: A scheme of concepts, created and adopted like any other subject.
    annotations:
      schema_org_type: https://schema.org/DefinedTermSet
slots:
  workFormat:
    slot_uri: wdt:P7937
    description: The form of the creative work, represented by a classification concept.
    range: Concept
    multivalued: true
    exact_mappings:
      - wd:P7937
    annotations:
      datatype: wikibase-item
      relation_group: classification
      inverse: rezics:workInForm
      relation_order: name
  inScheme:
    slot_uri: skos:inScheme
    description: A concept scheme to which the concept belongs.
    range: ConceptScheme
    multivalued: true
    annotations:
      datatype: wikibase-item
      relation_group: classification
      inverse: rezics:schemeConcept
      relation_order: name
  broader:
    slot_uri: skos:broader
    description: A broader concept in the classification hierarchy.
    range: Concept
    multivalued: true
    annotations:
      datatype: wikibase-item
      relation_group: classification
      inverse: skos:narrower
      relation_order: name
      acyclic: true
  focus:
    slot_uri: foaf:focus
    description: The subject that this concept stands for.
    range: Thing
    annotations:
      datatype: wikibase-item
      relation_group: classification
      inverse: rezics:focusOf
      relation_order: name
  genre:
    slot_uri: schema:genre
    description: A genre concept classifying the creative work.
    range: Concept
    multivalued: true
    exact_mappings:
      - wd:P136
    annotations:
      datatype: wikibase-item
      qualifiers: spoilerLevel
      relation_group: classification
      inverse: rezics:workInGenre
      relation_order: name
  keywords:
    slot_uri: schema:keywords
    description: A tag concept classifying the creative work.
    range: Concept
    multivalued: true
    annotations:
      datatype: wikibase-item
      qualifiers: spoilerLevel
      relation_group: classification
      inverse: rezics:taggedSubject
      relation_order: name
