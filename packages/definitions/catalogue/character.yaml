id: https://rezics.com/catalogue/character
name: character
version: 1.0.0
description: Fictional character profiles and descriptive terms.
prefixes:
  rezics: https://rezics.com/vocab/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  wd: http://www.wikidata.org/entity/
  wdt: http://www.wikidata.org/prop/direct/
default_range: string
imports:
  - linkml:types
  - core
  - classification
classes:
  FictionalCharacter:
    is_a: Character
    class_uri: wd:Q95074
    description: >-
      An independently referable fictional character, including a fictional machine, ship or organization.
      Source: https://www.wikidata.org/wiki/Q95074. Traits use keywords concepts with spoiler levels;
      appearances and voice credits are statements on works, not lists on the character.
      Browse facets follow traits and gender at https://vndb.org/c and
      https://api.vndb.org/kana#post-character, and blood type, gender and birth month at
      https://bgm.tv/character. Height and weight supplement these with VNDB's measurement filters.
      Birth-date filtering requires an explicitly stated year; a birthday without a year is not a birth date.
    exact_mappings:
      - wd:Q95074
    slots:
      - abstract
      - alternateName
      - birthDate
      - gender
      - height
      - weight
      - bloodType
      - keywords
      - vndbId
      - bangumiCharacterId
      - relatedCharacterIdentity
      - spouse
      - sibling
      - father
      - mother
      - partner
      - characterRival
    annotations:
      facets: keywords gender bloodType birthDate height weight
      schema_org_type: https://schema.org/Thing
slots:
  gender:
    slot_uri: schema:gender
    description: >-
      The source-described gender of the fictional character, expressed as a concept.
      Sources: https://schema.org/gender and https://www.wikidata.org/wiki/Property:P21.
      The mapping is close because Wikidata also covers biological sex, which is not inferred here.
    range: Concept
    close_mappings:
      - wd:P21
    annotations:
      datatype: wikibase-item
      qualifiers: spoilerLevel
      relation_group: classification
      inverse: rezics:subjectWithGender
      relation_order: name
  height:
    slot_uri: schema:height
    description: >-
      The character's stated height, preserving the source unit.
      Sources and mapping: https://schema.org/height and https://www.wikidata.org/wiki/Property:P2048.
    range: decimal
    minimum_value: 0
    exact_mappings:
      - wd:P2048
    annotations:
      datatype: quantity
      units: wd:Q174728 wd:Q11573
  weight:
    slot_uri: schema:weight
    description: >-
      The character's stated mass, preserving the source unit.
      Sources and mapping: https://schema.org/weight and https://www.wikidata.org/wiki/Property:P2067.
    range: decimal
    minimum_value: 0
    exact_mappings:
      - wd:P2067
    annotations:
      datatype: quantity
      units: wd:Q11570 wd:Q41803
  bloodType:
    slot_uri: wdt:P1853
    description: >-
      The character's explicitly stated blood type as a concept.
      Source and mapping: https://www.wikidata.org/wiki/Property:P1853.
    range: Concept
    exact_mappings:
      - wd:P1853
    annotations:
      datatype: wikibase-item
      relation_group: classification
      inverse: rezics:subjectWithBloodType
      relation_order: name
  bangumiCharacterId:
    slot_uri: wdt:P6296
    description: >-
      The stable Bangumi character identifier.
      Source and mapping: https://www.wikidata.org/wiki/Property:P6296.
    pattern: '^[1-9][0-9]*$'
    exact_mappings:
      - wd:P6296
    annotations:
      datatype: external-id
  relatedCharacterIdentity:
    slot_uri: rezics:relatedCharacterIdentity
    description: >-
      A directed identity association to another independently referable Character, with optional spoiler
      qualification and statement references. VNDB chars.main names that Character endpoint. The appearance
      role code main is a protagonist role on a work appearance, never this link. The association is not a
      merge, redirect, instance-of class assertion or permission to combine biographies, and no target is
      inferred from names or provider identifiers.
    range: Character
    annotations:
      datatype: wikibase-item
      qualifiers: spoilerLevel
      relation_group: association
      inverse: rezics:relatedCharacterIdentityOf
      relation_order: name
  spouse:
    slot_uri: wdt:P26
    description: >-
      Another Character stated as this character's spouse.
      Source and mapping: https://www.wikidata.org/wiki/Property:P26.
    range: Character
    multivalued: true
    exact_mappings:
      - wd:P26
    annotations:
      datatype: wikibase-item
      qualifiers: spoilerLevel
      symmetric: true
      relation_group: association
      relation_order: name
  sibling:
    slot_uri: wdt:P3373
    description: >-
      Another Character stated as this character's sibling.
      Source and mapping: https://www.wikidata.org/wiki/Property:P3373.
    range: Character
    multivalued: true
    exact_mappings:
      - wd:P3373
    annotations:
      datatype: wikibase-item
      qualifiers: spoilerLevel
      symmetric: true
      relation_group: association
      relation_order: name
  father:
    slot_uri: wdt:P22
    description: >-
      The Character stated as this character's father.
      Source and mapping: https://www.wikidata.org/wiki/Property:P22.
    range: Character
    exact_mappings:
      - wd:P22
    annotations:
      datatype: wikibase-item
      qualifiers: spoilerLevel
      relation_group: association
      inverse: rezics:fatherOf
      relation_order: name
  mother:
    slot_uri: wdt:P25
    description: >-
      The Character stated as this character's mother.
      Source and mapping: https://www.wikidata.org/wiki/Property:P25.
    range: Character
    exact_mappings:
      - wd:P25
    annotations:
      datatype: wikibase-item
      qualifiers: spoilerLevel
      relation_group: association
      inverse: rezics:motherOf
      relation_order: name
  partner:
    slot_uri: wdt:P451
    description: >-
      Another Character stated as this character's unmarried partner or lover.
      Source and mapping: https://www.wikidata.org/wiki/Property:P451.
    range: Character
    multivalued: true
    exact_mappings:
      - wd:P451
    annotations:
      datatype: wikibase-item
      qualifiers: spoilerLevel
      symmetric: true
      relation_group: association
      relation_order: name
  characterRival:
    slot_uri: rezics:characterRival
    description: >-
      Another Character stated as this character's rival or enemy in the source relationship, not a work
      appearance role. Close mapping: https://www.wikidata.org/wiki/Property:P7047.
    range: Character
    multivalued: true
    close_mappings:
      - wd:P7047
    annotations:
      datatype: wikibase-item
      qualifiers: spoilerLevel
      symmetric: true
      relation_group: association
      relation_order: name
