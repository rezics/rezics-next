id: https://rezics.com/catalogue/recipe
name: recipe
version: 1.0.0
description: Recipe profile terms.
prefixes:
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  wd: http://www.wikidata.org/entity/
  bf: http://id.loc.gov/ontologies/bibframe/
  rezics: https://rezics.com/vocab/
default_range: string
imports:
  - linkml:types
  - core
  - classification
classes:
  Recipe:
    is_a: Thing
    class_uri: schema:Recipe
    description: Instructions and ingredients for preparing food.
    exact_mappings:
      - wd:Q219239
    slots:
      - author
      - abstract
      - datePublished
      - recipeIngredient
      - madeFromMaterial
      - recipeInstructions
      - cookTime
      - recipeYield
      - keywords
      - suitableForDiet
    annotations:
      list_presentation:
        imageAspect: landscape
        keyFacts: [schema:cookTime, schema:suitableForDiet]
      library:
        id: recipe.cooking
        entryStateSet:
          id: legacy-five
          states:
            - { id: planned, role: planned }
            - { id: in_progress, role: active }
            - { id: completed, role: completed }
            - { id: paused, role: paused }
            - { id: dropped, role: dropped }
        progress:
          allowed:
            - mode: scalar_amount
              units:
                - id: minute
                  minimum: '0'
                  totalPolicy: optional
                  identity: { kind: none }
                  structure: { kind: none }
        copies:
          kinds:
            - id: physical
              statuses: [{ id: owned }, { id: disposed }]
            - id: digital
              statuses: [{ id: owned }]
        importSources: []
      facets: author keywords datePublished cookTime recipeYield suitableForDiet
      cover_ratio: 4:3
      schema_org_type: https://schema.org/Recipe
slots:
  suitableForDiet:
    slot_uri: schema:suitableForDiet
    description: A public dietary suitability classification asserted for the recipe.
    range: Concept
    multivalued: true
    annotations:
      datatype: wikibase-item
      relation_group: classification
      inverse: rezics:recipeForDiet
      relation_order: name
  recipeInstructions:
    slot_uri: schema:recipeInstructions
    description: The document describing how to prepare the recipe.
    annotations:
      datatype: document
  recipeIngredient:
    slot_uri: schema:recipeIngredient
    description: An ingredient used to prepare the recipe.
    multivalued: true
    annotations:
      datatype: monolingualtext
  cookTime:
    slot_uri: schema:cookTime
    description: The time needed to cook the recipe.
    range: integer
    minimum_value: 0
    annotations:
      datatype: quantity
      units: wd:Q7727
  recipeYield:
    slot_uri: schema:recipeYield
    description: The number of servings produced by the recipe.
    range: integer
    minimum_value: 1
    annotations:
      datatype: quantity
      units: '1'
