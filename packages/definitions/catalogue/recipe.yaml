id: https://rezics.com/catalogue/recipe
name: recipe
version: 1.0.0
description: Recipe profile terms.
prefixes:
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  wd: http://www.wikidata.org/entity/
  bf: http://id.loc.gov/ontologies/bibframe/
default_range: string
imports:
  - linkml:types
  - core
  - classification
classes:
  Recipe:
    is_a: Thing
    class_uri: schema:Recipe
    description: Instructions and ingredients for preparing food.
    exact_mappings:
      - wd:Q219239
    slots:
      - author
      - abstract
      - datePublished
      - recipeIngredient
      - madeFromMaterial
      - recipeInstructions
      - cookTime
      - recipeYield
      - keywords
    annotations:
      facets: author keywords datePublished cookTime recipeYield
      cover_ratio: 4:3
      schema_org_type: https://schema.org/Recipe
slots:
  recipeInstructions:
    slot_uri: schema:recipeInstructions
    description: The document describing how to prepare the recipe.
    annotations:
      datatype: document
  recipeIngredient:
    slot_uri: schema:recipeIngredient
    description: An ingredient used to prepare the recipe.
    multivalued: true
    annotations:
      datatype: monolingualtext
  cookTime:
    slot_uri: schema:cookTime
    description: The time needed to cook the recipe.
    range: integer
    minimum_value: 0
    annotations:
      datatype: quantity
      units: wd:Q7727
  recipeYield:
    slot_uri: schema:recipeYield
    description: The number of servings produced by the recipe.
    range: integer
    minimum_value: 1
    annotations:
      datatype: quantity
      units: '1'
