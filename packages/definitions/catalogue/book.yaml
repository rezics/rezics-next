id: https://rezics.com/catalogue/book
name: book
version: 1.0.0
description: Book work and edition profile terms.
prefixes:
  rezics: https://rezics.com/vocab/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  wd: http://www.wikidata.org/entity/
  bf: http://id.loc.gov/ontologies/bibframe/
default_range: string
imports:
  - linkml:types
  - core
  - classification
classes:
  Work:
    is_a: CreativeWork
    class_uri: schema:Book
    description: A creative work that is a book, independent of its editions.
    exact_mappings:
      - wd:Q47461344
    slots:
      - representativeEdition
      - author
      - abstract
      - openLibraryId
      - bangumiSubjectId
      - datePublished
      - inLanguage
      - genre
      - keywords
      - partOfSeries
    annotations:
      facets: author genre keywords partOfSeries datePublished contributor inLanguage
      schema_org_type: https://schema.org/Book
  Edition:
    is_a: CreativeWork
    class_uri: bf:Instance
    description: A published edition of a book work.
    exact_mappings:
      - wd:Q3331189
    slots:
      - contributor
      - voiceActor
      - developer
      - screenwriter
      - productionCompany
      - producer
      - musicBy
      - director
      - illustrator
      - author
      - exampleOfWork
      - openLibraryId
      - isbn
      - publisher
      - datePublished
      - numberOfPages
      - inLanguage
      - translator
    annotations:
      facets: exampleOfWork author translator publisher datePublished numberOfPages contributor inLanguage illustrator director musicBy producer productionCompany screenwriter developer voiceActor
      schema_org_type: https://schema.org/Book
slots:
  exampleOfWork:
    slot_uri: schema:exampleOfWork
    description: The creative work represented by this edition.
    range: CreativeWork
    exact_mappings:
      - wd:P629
    annotations:
      datatype: wikibase-item
      qualifiers: openLibraryId sameAs
      relation_group: derivation
      inverse: schema:workExample
      relation_order: date
      acyclic: true
  isbn:
    slot_uri: schema:isbn
    description: The ISBN-13 identifier of the edition.
    pattern: '^97[89]-?(?:[0-9]-?){9}[0-9]$'
    exact_mappings:
      - wd:P212
    annotations:
      datatype: external-id
  publisher:
    slot_uri: schema:publisher
    description: A person or organization credited with publishing the edition.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P123
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole vndbId sameAs appliesToPart
      relation_group: credit
      inverse: rezics:publisherOf
      relation_order: position
      relation_filter: [wdt:P3831, wdt:P518]
  numberOfPages:
    slot_uri: schema:numberOfPages
    description: The number of pages in the edition.
    range: integer
    minimum_value: 1
    exact_mappings:
      - wd:P1104
    annotations:
      datatype: quantity
      units: '1'
  translator:
    slot_uri: schema:translator
    description: A person or organization credited with translating the edition.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P655
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole openLibraryId sameAs appliesToPart
      relation_group: credit
      inverse: rezics:translatorOf
      relation_order: position
      relation_filter: [wdt:P3831, wdt:P518]
