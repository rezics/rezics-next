id: https://rezics.com/catalogue/works
name: works
version: 1.0.0
description: Launch profiles for music albums.
prefixes:
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  wd: http://www.wikidata.org/entity/
default_range: string
imports:
  - linkml:types
  - core
classes:
  LaunchWork:
    abstract: true
    is_a: CreativeWork
    slots:
      - representativeEdition
      - datePublished
      - inLanguage
      - abstract
  MusicAlbum:
    is_a: LaunchWork
    class_uri: schema:MusicAlbum
    exact_mappings:
      - wd:Q482994
    slots:
      - bangumiSubjectId
    annotations:
      list_presentation:
        imageAspect: square
        keyFacts: [schema:datePublished, schema:genre]
      facets: contributor partOfSeries genre keywords inLanguage
      cover_ratio: 1:1
      schema_org_type: https://schema.org/MusicAlbum
