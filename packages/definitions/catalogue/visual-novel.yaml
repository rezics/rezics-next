id: https://rezics.com/catalogue/visual-novel
name: visual-novel
version: 1.0.0
description: Visual novel work profile terms.
prefixes:
  rezics: https://rezics.com/vocab/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  wd: http://www.wikidata.org/entity/
  wdt: http://www.wikidata.org/prop/direct/
default_range: string
imports:
  - linkml:types
  - game
classes:
  VisualNovel:
    is_a: VideoGame
    class_uri: wd:Q689445
    description: >-
      A visual novel work and the characters, staff and relationships represented by it. Work browse filters:
      https://api.vndb.org/kana#filters.
    slots:
      - vndbId
      - character
      - author
      - director
      - illustrator
      - musicBy
      - translator
      - voiceActor
      - follows
      - partOfWork
      - alternativeWork
      - basedOnWork
      - spinOffOf
    annotations:
      list_presentation:
        imageAspect: portrait
        keyFacts: [schema:author, schema:datePublished, schema:genre]
      library:
        id: visual-novel.reading
        entryStateSet:
          id: legacy-five
          states:
            - { id: planned, role: planned }
            - { id: in_progress, role: active }
            - { id: completed, role: completed }
            - { id: paused, role: paused }
            - { id: dropped, role: dropped }
        progress:
          allowed:
            - mode: scalar_amount
              units:
                - id: percent
                  dimension: percent
                  minimum: '0'
                  maximum: '100'
                  totalPolicy: optional
                  identity: { kind: none }
                  structure: { kind: none }
        copies:
          kinds:
            - id: physical
              statuses: [{ id: owned }, { id: disposed }]
            - id: digital
              statuses: [{ id: owned }]
        importSources: []
      facets: genre keywords character contributor author director illustrator musicBy translator voiceActor partOfSeries inLanguage
      schema_org_type: https://schema.org/VideoGame
slots:
  partOfWork:
    slot_uri: wdt:P361
    description: The larger work of which this work forms a part, including its parent story or collection.
    range: CreativeWork
    multivalued: true
    exact_mappings:
      - wd:P361
    annotations:
      datatype: wikibase-item
      relation_group: membership
      inverse: wdt:P527
      relation_order: name
      acyclic: true
  alternativeWork:
    slot_uri: wdt:P1889
    description: An alternative work in the same setting or continuity.
    range: VisualNovel
    multivalued: true
    exact_mappings:
      - wd:P1889
    annotations:
      datatype: wikibase-item
      relation_group: world
      symmetric: true
      relation_order: name
  basedOnWork:
    slot_uri: wdt:P144
    description: A work this visual novel is based on.
    range: CreativeWork
    multivalued: true
    exact_mappings:
      - wd:P144
    annotations:
      datatype: wikibase-item
      relation_group: derivation
      inverse: wdt:P4969
      relation_order: name
      acyclic: true
  spinOffOf:
    slot_uri: rezics:spinOffOf
    description: The original work from which this spin-off was derived.
    range: CreativeWork
    multivalued: true
    annotations:
      datatype: wikibase-item
      relation_group: derivation
      inverse: wdt:P2512
      relation_order: name
      acyclic: true
