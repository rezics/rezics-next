id: https://rezics.com/catalogue/core
name: core
version: 1.0.0
description: Shared identity and attribution terms.
prefixes:
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  wd: http://www.wikidata.org/entity/
  bf: http://id.loc.gov/ontologies/bibframe/
  wdt: http://www.wikidata.org/prop/direct/
  rezics: https://rezics.com/vocab/
default_range: string
imports:
  - linkml:types
classes:
  Thing:
    abstract: true
    description: A thing that can be identified by a URL.
    slots:
      - url
      - image
      - name
      - sameAs
  CreativeWork:
    abstract: true
    is_a: Thing
    class_uri: schema:CreativeWork
    description: A creative work, including a published realization of a work.
    slots:
      - contributor
      - genre
      - keywords
      - partOfSeries
  Character:
    abstract: true
    is_a: Thing
    description: A character represented in a creative work.
  CreativeWorkSeries:
    abstract: true
    is_a: CreativeWork
    class_uri: schema:CreativeWorkSeries
    description: A series of creative works.
  Person:
    is_a: Thing
    class_uri: schema:Person
    description: A person.
    exact_mappings:
      - wd:Q5
    slots:
      - birthDate
      - deathDate
      - openLibraryId
      - bangumiPersonId
      - vndbId
  Organization:
    is_a: Thing
    slots:
      - vndbId
    class_uri: schema:Organization
    description: An organization.
    exact_mappings:
      - wd:Q43229
slots:
  url:
    slot_uri: schema:url
    description: The URL identifying this thing.
    range: uri
    exact_mappings:
      - wd:P856
    annotations:
      datatype: url
  name:
    slot_uri: schema:name
    description: A source title or name proposed as a candidate statement.
    multivalued: true
    close_mappings:
      - wd:P1476
      - wd:P2561
    annotations:
      datatype: monolingualtext
  sameAs:
    slot_uri: schema:sameAs
    description: The canonical URI of this entity in another dataset.
    range: uri
    multivalued: true
    exact_mappings:
      - wd:P2888
    annotations:
      datatype: url
  birthDate:
    slot_uri: schema:birthDate
    description: The date on which the person was born.
    range: date
    exact_mappings:
      - wd:P569
    annotations:
      datatype: time
  deathDate:
    slot_uri: schema:deathDate
    description: The date on which the person died.
    range: date
    exact_mappings:
      - wd:P570
    annotations:
      datatype: time
  author:
    slot_uri: schema:author
    description: A person or organization credited as an author.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P50
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole openLibraryId bangumiPersonId vndbId sameAs
  position:
    slot_uri: schema:position
    description: The one-based order of a credit or the ordinal of a member in a series.
    pattern: '^[1-9][0-9]{0,3}$'
    exact_mappings:
      - wd:P1545
    annotations:
      datatype: string
  datePublished:
    slot_uri: schema:datePublished
    description: The date on which the work was published.
    range: date
    exact_mappings:
      - wd:P577
    annotations:
      datatype: time
  version:
    slot_uri: schema:version
    description: The revision identifier stated by the source record.
    annotations:
      datatype: string
  dateModified:
    slot_uri: schema:dateModified
    description: The date on which the source record was last modified.
    range: date
    exact_mappings:
      - wd:P5017
    annotations:
      datatype: time
  inLanguage:
    slot_uri: schema:inLanguage
    description: The language used for the resource.
    pattern: '^[a-z]{2,3}(?:-[A-Za-z0-9]{1,8})*$'
    annotations:
      datatype: string
  abstract:
    slot_uri: schema:abstract
    description: A summary document, with one value per language by convention.
    multivalued: true
    annotations:
      datatype: document
  image:
    slot_uri: schema:image
    description: An uploaded media object depicting this thing.
    multivalued: true
    annotations:
      datatype: media
  openLibraryId:
    slot_uri: wdt:P648
    description: Open Library ID.
    pattern: '^OL[1-9][0-9]*[AMW]$'
    exact_mappings:
      - wd:P648
    annotations:
      datatype: external-id
  bangumiSubjectId:
    slot_uri: wdt:P5732
    description: Bangumi subject ID.
    pattern: '^[1-9][0-9]*$'
    exact_mappings:
      - wd:P5732
    annotations:
      datatype: external-id
  bangumiPersonId:
    slot_uri: wdt:P6298
    description: bgm.tv person ID.
    pattern: '^[1-9][0-9]*$'
    exact_mappings:
      - wd:P6298
    annotations:
      datatype: external-id
  vndbId:
    slot_uri: wdt:P3180
    description: Visual Novel Database ID.
    pattern: '^[vrpcs][1-9][0-9]*$'
    exact_mappings:
      - wd:P3180
    annotations:
      datatype: external-id
  illustrator:
    slot_uri: schema:illustrator
    description: A person or organization credited with illustration.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P110
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole
  director:
    slot_uri: schema:director
    description: A person or organization credited with direction.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P57
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole
  musicBy:
    slot_uri: schema:musicBy
    description: A person or organization credited with composing the music.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P86
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole
  producer:
    slot_uri: schema:producer
    description: A person or organization credited with production.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P162
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole
  productionCompany:
    slot_uri: schema:productionCompany
    description: A person or organization credited as a production company.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P272
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole
  screenwriter:
    slot_uri: wdt:P58
    description: A person or organization credited with writing the screenplay.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P58
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole
  developer:
    slot_uri: wdt:P178
    description: A person or organization credited with development.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P178
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole
  voiceActor:
    slot_uri: wdt:P725
    description: A person or organization credited with a voice performance.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P725
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole characterRole
  contributor:
    slot_uri: schema:contributor
    description: A person or organization credited in any other job, specified by its detailed role.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P767
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole
  creditedAs:
    slot_uri: wdt:P1932
    description: The name as it appears in the credit.
    annotations:
      datatype: string
  detailedRole:
    slot_uri: wdt:P3831
    description: A concept specifying the detailed staff position or appearance role.
    range: Concept
    annotations:
      datatype: wikibase-item
  characterRole:
    slot_uri: wdt:P453
    description: The character portrayed in a voice performance.
    range: Character
    annotations:
      datatype: wikibase-item
  character:
    slot_uri: schema:character
    description: A character appearing in a creative work.
    range: Character
    multivalued: true
    exact_mappings:
      - wd:P674
    annotations:
      datatype: wikibase-item
      qualifiers: detailedRole creditedAs spoilerLevel
  spoilerLevel:
    slot_uri: rezics:spoilerLevel
    description: Disclosure level from 0 (no spoiler) through 2 (major spoiler).
    range: integer
    minimum_value: 0
    maximum_value: 2
    annotations:
      datatype: quantity
      units: '1'
  partOfSeries:
    slot_uri: wdt:P179
    description: The series to which this member belongs, with its ordinal as a position qualifier.
    range: CreativeWorkSeries
    multivalued: true
    annotations:
      datatype: wikibase-item
      qualifiers: position
