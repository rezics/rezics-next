id: https://rezics.com/catalogue/core
name: core
version: 1.0.0
description: Shared identity and attribution terms.
prefixes:
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  wd: http://www.wikidata.org/entity/
  bf: http://id.loc.gov/ontologies/bibframe/
  wdt: http://www.wikidata.org/prop/direct/
  rezics: https://rezics.com/vocab/
default_range: string
imports:
  - linkml:types
classes:
  Thing:
    abstract: true
    class_uri: schema:Thing
    description: A thing that can be identified by a URL.
    slots:
      - url
      - image
      - name
      - sameAs
    annotations:
      cover_ratio: 1:1
  CreativeWork:
    abstract: true
    is_a: Thing
    class_uri: schema:CreativeWork
    description: A creative work, including a published realization of a work.
    slots:
      - contributor
      - genre
      - keywords
      - partOfSeries
      - follows
      - partOfWork
      - spinOffOf
      - crossMediaCounterpart
      - summaryOf
      - sideStoryOf
      - sameCharacters
      - sameSetting
      - alternativeSetting
      - alternativeVersion
      - collaborationWith
      - bangumiRelatedTo
      - artbookCounterpart
      - editionCounterpart
      - bangumiLegacyVersion
      - expansionCounterpart
      - storyArc
    annotations:
      cover_ratio: 5:7
  StoryArc:
    is_a: CreativeWork
    class_uri: wd:Q2620972
    description: >-
      A named, ordered range of a work's episodes or chapters
      (https://www.wikidata.org/wiki/Q2620972).
    annotations:
      facets: contributor genre keywords partOfSeries
      schema_org_type: https://schema.org/CreativeWork
  Character:
    abstract: true
    is_a: Thing
    description: A character represented in a creative work.
    annotations:
      cover_ratio: 3:4
  CreativeWorkSeries:
    abstract: true
    is_a: CreativeWork
    class_uri: schema:CreativeWorkSeries
    description: A series of creative works.
    slots:
      - representativeEdition
  Person:
    is_a: Thing
    class_uri: schema:Person
    description: A person.
    exact_mappings:
      - wd:Q5
    slots:
      - penNameOf
      - birthDate
      - deathDate
      - openLibraryId
      - bangumiPersonId
      - vndbId
    annotations:
      cover_ratio: 3:4
      schema_org_type: https://schema.org/Person
  Organization:
    is_a: Thing
    slots:
      - penNameOf
      - vndbId
    class_uri: schema:Organization
    description: An organization.
    exact_mappings:
      - wd:Q43229
    annotations:
      schema_org_type: https://schema.org/Organization
  Food:
    is_a: Thing
    class_uri: wd:Q2095
    description: A substance consumed to provide nutritional support for the body.
    annotations:
      schema_org_type: https://schema.org/Thing
  SoftwareApplication:
    is_a: Thing
    class_uri: schema:SoftwareApplication
    description: A software application.
    exact_mappings:
      - wd:Q166142
    annotations:
      cover_ratio: 1:1
      schema_org_type: https://schema.org/SoftwareApplication
slots:
  madeFromMaterial:
    slot_uri: wdt:P186
    description: A material or prepared component used to make the subject.
    any_of:
      - range: Food
      - range: Recipe
    multivalued: true
    annotations:
      datatype: wikibase-item
      qualifiers: position quantity note listSection creditedAs sameAs
      relation_group: derivation
      relation_order: position
      inverse: rezics:usedIn
  quantity:
    slot_uri: wdt:P1114
    description: The exact quantity of the object used in a statement, optionally bounded by a range.
    range: decimal
    annotations:
      datatype: quantity
      units: '*'
  note:
    slot_uri: rezics:note
    description: A free-text note qualifying a statement.
    annotations:
      datatype: monolingualtext
  listSection:
    slot_uri: rezics:listSection
    description: The section of an ordered list to which an item belongs.
    annotations:
      datatype: monolingualtext
  storyArc:
    slot_uri: rezics:storyArc
    description: A story arc of this work, ordered by position with its first and last part numbers.
    range: StoryArc
    multivalued: true
    annotations:
      datatype: wikibase-item
      qualifiers: position firstPart lastPart
      relation_group: membership
      inverse: rezics:storyArcOf
      relation_order: position
      acyclic: true
  firstPart:
    slot_uri: rezics:firstPart
    description: The first episode or chapter number in this arc, as numbered by the work.
    annotations:
      datatype: string
  lastPart:
    slot_uri: rezics:lastPart
    description: The last episode or chapter number in this arc, as numbered by the work.
    annotations:
      datatype: string
  appliesToPart:
    slot_uri: wdt:P518
    description: The story arc of the work to which this appearance or credit applies.
    range: StoryArc
    multivalued: true
    annotations:
      datatype: wikibase-item
      relation_group: membership
      inverse: none
      relation_order: name
  crossMediaCounterpart:
    slot_uri: rezics:crossMediaCounterpart
    description: >-
      A work in the same franchise in another medium. This does not assert which work adapts the other;
      Bangumi's Adaptation code is used on both records, including a game and its anime adaptation.
    range: CreativeWork
    multivalued: true
    annotations:
      datatype: wikibase-item
      symmetric: true
      relation_group: derivation
      relation_order: name
  summaryOf:
    slot_uri: rezics:summaryOf
    description: The full narrative work condensed by this recap or summary work.
    range: CreativeWork
    multivalued: true
    annotations:
      datatype: wikibase-item
      inverse: rezics:summaryVersion
      relation_group: derivation
      relation_order: name
      acyclic: true
  sideStoryOf:
    slot_uri: rezics:sideStoryOf
    description: The main narrative work to which this supplementary side story belongs.
    range: CreativeWork
    multivalued: true
    annotations:
      datatype: wikibase-item
      inverse: rezics:sideStory
      relation_group: order
      relation_order: name
      acyclic: true
  sameCharacters:
    slot_uri: rezics:sameCharacters
    description: A work sharing characters with this work but telling an unrelated story.
    range: CreativeWork
    multivalued: true
    annotations:
      datatype: wikibase-item
      symmetric: true
      relation_group: world
      relation_order: name
  sameSetting:
    slot_uri: rezics:sameSetting
    description: A work in the same world or timeline, with a different principal cast.
    range: CreativeWork
    multivalued: true
    annotations:
      datatype: wikibase-item
      symmetric: true
      relation_group: world
      relation_order: name
  alternativeSetting:
    slot_uri: rezics:alternativeSetting
    description: A work with the same principal characters in a different world or timeline.
    range: CreativeWork
    multivalued: true
    annotations:
      datatype: wikibase-item
      symmetric: true
      relation_group: world
      relation_order: name
  alternativeVersion:
    slot_uri: rezics:alternativeVersion
    description: A different telling with the same setting and characters.
    range: CreativeWork
    multivalued: true
    annotations:
      datatype: wikibase-item
      symmetric: true
      relation_group: world
      relation_order: name
  collaborationWith:
    slot_uri: rezics:collaborationWith
    description: >-
      A work connected by a character crossover collaboration. One or both works feature characters from the
      other; this relation does not identify the guest character or which work hosts the crossover.
    range: CreativeWork
    multivalued: true
    annotations:
      datatype: wikibase-item
      symmetric: true
      relation_group: world
      relation_order: name
  bangumiRelatedTo:
    slot_uri: rezics:bangumiRelatedTo
    description: >-
      Bangumi explicitly links this work to the value work with its Other subject relation, without stating a
      kind. Only Bangumi's catch-all assertion is expressed; other sources cannot use it for generic relatedness.
      The source record holds the statement even when the archive has no reciprocal record.
    range: CreativeWork
    multivalued: true
    annotations:
      datatype: wikibase-item
      inverse: rezics:bangumiRelatedFrom
      relation_group: association
      relation_order: name
  artbookCounterpart:
    slot_uri: rezics:artbookCounterpart
    description: >-
      A work and its companion artbook, linked without asserting which endpoint is the artbook.
      Bangumi's Album subject relation appears on both records, including the illustrated work's record.
    range: CreativeWork
    multivalued: true
    annotations:
      datatype: wikibase-item
      symmetric: true
      relation_group: association
      relation_order: name
  editionCounterpart:
    slot_uri: rezics:editionCounterpart
    description: Another book version or edition, without asserting an original or a work-to-edition direction.
    range: CreativeWork
    multivalued: true
    annotations:
      datatype: wikibase-item
      symmetric: true
      relation_group: derivation
      relation_order: name
  bangumiLegacyVersion:
    slot_uri: rezics:bangumiLegacyVersion
    description: >-
      A pair linked by Bangumi's retired game Main Version code 4013. The pinned document comments out this code;
      the archive uses it reciprocally for an original and a revised version, so it asserts no holder direction.
      This preserves the retired assertion separately from the directed Version and Main Version codes 4016/4017.
    range: CreativeWork
    multivalued: true
    annotations:
      datatype: wikibase-item
      symmetric: true
      relation_group: derivation
      relation_order: name
  expansionCounterpart:
    slot_uri: rezics:expansionCounterpart
    description: >-
      A base game and an expansion linked without identifying which endpoint expands the other.
      Bangumi's DLC code is used on both records. An independently identified add-on can additionally name its
      base game through expansionOf when the source establishes that direction.
    range: CreativeWork
    multivalued: true
    annotations:
      datatype: wikibase-item
      symmetric: true
      relation_group: derivation
      relation_order: name
  alternateName:
    slot_uri: schema:alternateName
    description: An alternate name or alias, preserving its source language and spelling.
    multivalued: true
    close_mappings:
      - wd:P2561
    annotations:
      datatype: monolingualtext
      qualifiers: spoilerLevel
  url:
    slot_uri: schema:url
    description: The URL identifying this thing.
    range: uri
    exact_mappings:
      - wd:P856
    annotations:
      datatype: url
  name:
    slot_uri: schema:name
    description: A source title or name proposed as a candidate statement.
    multivalued: true
    close_mappings:
      - wd:P1476
      - wd:P2561
    annotations:
      datatype: monolingualtext
  sameAs:
    slot_uri: schema:sameAs
    description: The canonical URI of this entity in another dataset.
    range: uri
    multivalued: true
    exact_mappings:
      - wd:P2888
    annotations:
      datatype: url
  birthDate:
    slot_uri: schema:birthDate
    description: The date on which the person was born.
    range: date
    exact_mappings:
      - wd:P569
    annotations:
      datatype: time
  deathDate:
    slot_uri: schema:deathDate
    description: The date on which the person died.
    range: date
    exact_mappings:
      - wd:P570
    annotations:
      datatype: time
  author:
    slot_uri: schema:author
    description: A person or organization credited as an author.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P50
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole openLibraryId bangumiPersonId vndbId sameAs appliesToPart
      relation_group: credit
      inverse: rezics:authorOf
      relation_order: position
      relation_filter: [wdt:P3831, wdt:P518]
  position:
    slot_uri: schema:position
    description: The one-based order of an item in a list.
    pattern: '^[1-9][0-9]{0,3}$'
    exact_mappings:
      - wd:P1545
    annotations:
      datatype: string
  datePublished:
    slot_uri: schema:datePublished
    description: The date on which the work was published.
    range: date
    exact_mappings:
      - wd:P577
    annotations:
      datatype: time
  version:
    slot_uri: schema:version
    description: The revision identifier stated by the source record.
    annotations:
      datatype: string
  dateModified:
    slot_uri: schema:dateModified
    description: The date on which the source record was last modified.
    range: date
    exact_mappings:
      - wd:P5017
    annotations:
      datatype: time
  inLanguage:
    slot_uri: schema:inLanguage
    description: The language used for the resource.
    pattern: '^[a-z]{2,3}(?:-[A-Z][a-z]{3})?(?:-(?:[A-Z]{2}|[0-9]{3}))?$'
    multivalued: true
    annotations:
      datatype: string
  abstract:
    slot_uri: schema:abstract
    description: A summary document, with one value per language by convention.
    multivalued: true
    annotations:
      datatype: document
  image:
    slot_uri: schema:image
    description: An uploaded media object depicting this thing.
    multivalued: true
    annotations:
      datatype: media
  openLibraryId:
    slot_uri: wdt:P648
    description: Open Library ID.
    pattern: '^OL[1-9][0-9]*[AMW]$'
    exact_mappings:
      - wd:P648
    annotations:
      datatype: external-id
  bangumiSubjectId:
    slot_uri: wdt:P5732
    description: Bangumi subject ID.
    pattern: '^[1-9][0-9]*$'
    exact_mappings:
      - wd:P5732
    annotations:
      datatype: external-id
  bangumiPersonId:
    slot_uri: wdt:P6298
    description: bgm.tv person ID.
    pattern: '^[1-9][0-9]*$'
    exact_mappings:
      - wd:P6298
    annotations:
      datatype: external-id
  vndbId:
    slot_uri: wdt:P3180
    description: Visual Novel Database ID.
    pattern: '^[vrpcs][1-9][0-9]*$'
    exact_mappings:
      - wd:P3180
    annotations:
      datatype: external-id
  illustrator:
    slot_uri: schema:illustrator
    description: A person or organization credited with illustration.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P110
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole appliesToPart
      relation_group: credit
      inverse: rezics:illustratorOf
      relation_order: position
      relation_filter: [wdt:P3831, wdt:P518]
  director:
    slot_uri: schema:director
    description: A person or organization credited with direction.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P57
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole appliesToPart
      relation_group: credit
      inverse: rezics:directorOf
      relation_order: position
      relation_filter: [wdt:P3831, wdt:P518]
  musicBy:
    slot_uri: schema:musicBy
    description: A person or organization credited with composing the music.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P86
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole appliesToPart
      relation_group: credit
      inverse: rezics:musicByOf
      relation_order: position
      relation_filter: [wdt:P3831, wdt:P518]
  producer:
    slot_uri: schema:producer
    description: A person or organization credited with production.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P162
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole appliesToPart
      relation_group: credit
      inverse: rezics:producerOf
      relation_order: position
      relation_filter: [wdt:P3831, wdt:P518]
  productionCompany:
    slot_uri: schema:productionCompany
    description: A person or organization credited as a production company.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P272
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole appliesToPart
      relation_group: credit
      inverse: rezics:productionCompanyOf
      relation_order: position
      relation_filter: [wdt:P3831, wdt:P518]
  screenwriter:
    slot_uri: wdt:P58
    description: A person or organization credited with writing the screenplay.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P58
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole appliesToPart
      relation_group: credit
      inverse: rezics:screenwriterOf
      relation_order: position
      relation_filter: [wdt:P3831, wdt:P518]
  developer:
    slot_uri: wdt:P178
    description: A person or organization credited with development.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P178
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole appliesToPart
      relation_group: credit
      inverse: rezics:developerOf
      relation_order: position
      relation_filter: [wdt:P3831, wdt:P518]
  voiceActor:
    slot_uri: wdt:P725
    description: A person or organization credited with a voice performance.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P725
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole characterRole appliesToPart
      relation_group: credit
      inverse: rezics:voiceActorOf
      relation_order: position
      relation_filter: [wdt:P3831, wdt:P518]
      relation_slot_key: wdt:P453
  contributor:
    slot_uri: schema:contributor
    description: A person or organization credited in any other job, specified by its detailed role.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P767
    annotations:
      datatype: wikibase-item
      qualifiers: creditedAs position detailedRole appliesToPart
      relation_group: credit
      inverse: rezics:contributorOf
      relation_order: position
      relation_filter: [wdt:P3831, wdt:P518]
  creditedAs:
    slot_uri: wdt:P1932
    description: The wording naming the object of a statement in its source.
    annotations:
      datatype: string
  detailedRole:
    slot_uri: wdt:P3831
    description: A concept specifying the detailed staff position or appearance role.
    range: Concept
    annotations:
      datatype: wikibase-item
      relation_group: classification
      inverse: none
      relation_order: name
  characterRole:
    slot_uri: wdt:P453
    description: The character portrayed in a voice performance.
    range: Character
    annotations:
      datatype: wikibase-item
      relation_group: appearance
      inverse: none
      relation_order: name
  character:
    slot_uri: schema:character
    description: A character appearing in a creative work.
    range: Character
    multivalued: true
    exact_mappings:
      - wd:P674
    annotations:
      datatype: wikibase-item
      qualifiers: detailedRole creditedAs spoilerLevel appliesToPart
      relation_group: appearance
      inverse: rezics:appearsIn
      relation_order: name
      relation_filter: [wdt:P3831, wdt:P518]
  spoilerLevel:
    slot_uri: rezics:spoilerLevel
    description: Disclosure level from 0 (no spoiler) through 2 (major spoiler).
    range: integer
    minimum_value: 0
    maximum_value: 2
    annotations:
      datatype: quantity
      units: '1'
  partOfSeries:
    slot_uri: wdt:P179
    description: The series to which this member belongs, with its ordinal as a position qualifier.
    range: CreativeWorkSeries
    multivalued: true
    annotations:
      datatype: wikibase-item
      qualifiers: position
      relation_group: membership
      inverse: rezics:seriesMember
      relation_order: position
      acyclic: true
  representativeEdition:
    slot_uri: rezics:representativeEdition
    description: The edition or release chosen to represent this work in the qualified language, with one value per language.
    any_of:
      - range: Edition
      - range: VideoGameRelease
      - range: AnimeRelease
    multivalued: true
    annotations:
      datatype: wikibase-item
      qualifiers: inLanguage
      relation_group: derivation
      inverse: none
      relation_order: name

  penNameOf:
    slot_uri: rezics:penNameOf
    description: The person or organization behind this pen name or collective name; credits remain on the named agent.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    annotations:
      datatype: wikibase-item
      disclosure: sourceOrConsent
      relation_group: association
      inverse: rezics:penNames
      relation_order: name
