id: https://rezics.com/catalogue/core
name: core
version: 1.0.0
description: Shared identity and attribution terms.
prefixes:
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  wd: http://www.wikidata.org/entity/
  bf: http://id.loc.gov/ontologies/bibframe/
  wdt: http://www.wikidata.org/prop/direct/
default_range: string
imports:
  - linkml:types
classes:
  Thing:
    abstract: true
    description: A thing that can be identified by a URL.
    slots:
      - url
      - image
  Person:
    is_a: Thing
    class_uri: schema:Person
    description: A person.
    exact_mappings:
      - wd:Q5
    slots:
      - birthDate
      - deathDate
      - openLibraryId
      - bangumiPersonId
      - vndbId
  Organization:
    is_a: Thing
    slots:
      - vndbId
    class_uri: schema:Organization
    description: An organization.
    exact_mappings:
      - wd:Q43229
slots:
  url:
    slot_uri: schema:url
    description: The URL identifying this thing.
    range: uri
    exact_mappings:
      - wd:P856
    annotations:
      datatype: url
  birthDate:
    slot_uri: schema:birthDate
    description: The date on which the person was born.
    range: date
    exact_mappings:
      - wd:P569
    annotations:
      datatype: time
  deathDate:
    slot_uri: schema:deathDate
    description: The date on which the person died.
    range: date
    exact_mappings:
      - wd:P570
    annotations:
      datatype: time
  author:
    slot_uri: schema:author
    description: A person or organization credited as an author.
    any_of:
      - range: Person
      - range: Organization
    multivalued: true
    exact_mappings:
      - wd:P50
    annotations:
      datatype: wikibase-item
      qualifiers: position openLibraryId bangumiPersonId vndbId
  position:
    slot_uri: schema:position
    description: The one-based position of an attributed person or organization.
    pattern: '^[1-9][0-9]{0,3}$'
    exact_mappings:
      - wd:P1545
    annotations:
      datatype: string
  datePublished:
    slot_uri: schema:datePublished
    description: The date on which the work was published.
    range: date
    exact_mappings:
      - wd:P577
    annotations:
      datatype: time
  inLanguage:
    slot_uri: schema:inLanguage
    description: The language used for the resource.
    pattern: '^[a-z]{2,3}(?:-[A-Za-z0-9]{1,8})*$'
    annotations:
      datatype: string
  abstract:
    slot_uri: schema:abstract
    description: A summary document, with one value per language by convention.
    multivalued: true
    annotations:
      datatype: document
  image:
    slot_uri: schema:image
    description: An uploaded media object depicting this thing.
    multivalued: true
    annotations:
      datatype: media
  openLibraryId:
    slot_uri: wdt:P648
    description: Open Library ID.
    pattern: '^OL[1-9][0-9]*[AMW]$'
    exact_mappings:
      - wd:P648
    annotations:
      datatype: external-id
  bangumiSubjectId:
    slot_uri: wdt:P5732
    description: Bangumi subject ID.
    pattern: '^[1-9][0-9]*$'
    exact_mappings:
      - wd:P5732
    annotations:
      datatype: external-id
  bangumiPersonId:
    slot_uri: wdt:P6298
    description: bgm.tv person ID.
    pattern: '^[1-9][0-9]*$'
    exact_mappings:
      - wd:P6298
    annotations:
      datatype: external-id
  vndbId:
    slot_uri: wdt:P3180
    description: Visual Novel Database ID.
    pattern: '^[vrpcs][1-9][0-9]*$'
    exact_mappings:
      - wd:P3180
    annotations:
      datatype: external-id
