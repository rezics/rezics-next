notes:
  - Pinned on 2026-10-26. The archive release tag is mutable; the exact asset name and verified SHA-256 identify this
    snapshot.
  - Scope is the eight named JSON Lines files. The additional person-relations file is outside this inventory contract.
  - All rows were scanned to establish the field union, nested object fields and undocumented numeric values. Template
    keys cover the published templates, not arbitrary user-created wiki keys.
  - A mapping is one decision. Existing means bundled on the named type; proposed includes missing profile bindings and
    qualifiers even where the property is already bundled on another type.
  - Initial subject import scope is type 1 (book), type 2 (anime) and type 4 (game); type 3 (music) and type 6 (live-action)
    are omitted. Real people remain available as credited creators and voice actors.
  - Source strings used as field keys, template names and role labels retain their original spelling. All descriptive
    prose is English.
  - The concept Wikidata mapping describes skos:Concept. No equivalence is asserted between a Bangumi staff role concept
    and a Wikidata occupation. Concept identifiers and schemes are proposed data identifiers, not new rezics vocabulary.
  - Credits use the role property as their main value; P3831 carries the detailed role concept, P1932 the credited spelling,
    and schema:position (P1545) the order when supplied. Missing qualifiers remain absent.
  - Staff position is a role code, never the credit order. The archive has no staff credited-as or order field; those
    qualifiers come only from a supporting wiki credit, never a fabricated value.
  - Subject-character order is zero-based, not necessarily contiguous, and sorted within role. Convert only the base,
    retaining gaps. Episode sort is a source ordinal and may be fractional.
  - Raw infobox strings are parsed by template; unsupported custom keys must be reported with an omission reason.
    Covers come only from Bangumi's published cover-image field, never raw infobox image/cover keys. The import provider
    owns obtaining that published field; the eight pinned archive files export neither cover URLs nor image bytes.
  - Summaries and episode descriptions are attributed CC BY-SA 3.0 documents. CC BY-SA attribution is carried by the
    subject's source record in its Sources section, never inferred from raw infobox copyright text. Source work copyright
    notices do not override the archive licence. Covers depicting copyrighted works retain the rights described by the
    primary copyright notice.
  - Schema to Wikidata mappings marked close preserve source distinctions and do not assert RDF equivalence.
  - Unknown observed association codes are explicitly omitted. The API CharacterType definition takes precedence over
    the abbreviated Archive README example for ships and organizations.
  - Game work platform lists and first-publication dates remain work-level source assertions. Create a software release
    only when a source identifies that release and its platform or language; never infer platform-language combinations.
  - Game player counts use schema:numberOfPlayers. A numeric range stores its upper endpoint as the amount and its lower
    endpoint as the schema:minValue qualifier; an exact count has no invented lower endpoint. Unstructured play modes
    are not numeric player counts. Sources are https://schema.org/numberOfPlayers, https://schema.org/minValue,
    https://www.wikidata.org/wiki/Property:P1873 and https://www.wikidata.org/wiki/Property:P1872.
  - Bangumi game browser facets follow https://bgm.tv/game/browser. Source format and staff codes remain concepts;
    downloadable content is an add-on work only when independently referable, not a new type for every format value.
  - Character appearances dispatch to the anime, game or manga work selected by the subject profile. Voice credits
    use the same dispatch. The association mappings name TVSeries as a concrete example, not CreativeWork's shared slots.
  - Character kind codes are keyword concepts; appearance role codes qualify schema:character with wdt:P3831.
    No character-kind or appearance-role code creates a catalogue type.
  - Subject relation decisions cite subject-relations.jsonlines pairs from the verified pinned asset, not live pages.
    A citation fragment names subject_id then related_subject_id; recordCheck records both rows, with null for a
    missing reciprocal row. Subjects and their titles were checked in subject.jsonlines of the same asset.
  - Resolve canonicalByReverse from the reciprocal row before applying a subject relation mapping. Its term replaces
    the fallback term, and the source subject holds it. Parent Story reciprocals of Side Story or Spin-off therefore
    resolve to the same canonical statement as their other side; a parent without such a reciprocal uses part-of.
    Coalesce identical canonical statements; symmetric pairs use stable endpoint ordering and are stored once.
  - Adaptation is reciprocal code 1 for both original and adaptation. It states a cross-media franchise connection,
    not the direction of based-on. Album, book Version, DLC and retired Main Version likewise lack a consistent
    holder direction in the archive and retain their exact unordered meanings rather than guessing derivation.
  - Collaboration records character crossovers. Its reciprocal rows can use Character instead of Collaboration;
    they do not consistently select a host. Character links works with shared characters and unrelated stories,
    not character-focused works. Other preserves only Bangumi's outgoing catch-all assertion.
