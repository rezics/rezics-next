      - id: 话数
        mapping:
          status: existing
          term: schema:numberOfEpisodes
          'on': schema:TVSeries
          wikidata: wd:P1113
          meaning: The number of installments; book chapters retain their source unit.
          sources: &id034
            - https://schema.org/numberOfEpisodes
