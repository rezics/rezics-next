        qualifies: schema:gender
        mapping: wdt:P1552
        meaning: Platform mechanism for disclosing the spoiler level of a gender value; no standard property represents this qualifier.
        citations: *id015
      - name: main
        status: omitted
        reason: Related-character key used to mark a main-character relation; the source relation is not a standalone profile field.
      - name: main_spoil
        status: omitted
        reason: Spoiler qualifier for the source main-character relation; omit with that unmodeled source relation.
