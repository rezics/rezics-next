        reason: Source-specific bust measurement has no selected profile property.
      - name: s_waist
        status: omitted
        reason: Source-specific waist measurement has no selected profile property.
      - name: s_hip
        status: omitted
        reason: Source-specific hip measurement has no selected profile property.
      - name: birthday
