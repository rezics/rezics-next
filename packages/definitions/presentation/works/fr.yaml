typeDescriptions:
  schema:MusicAlbum: 'Un album musical en tant qu’œuvre regroupant des pistes, indépendant d’un exemplaire ou d’une édition distribuée donnée.'
  schema:MusicRelease: 'Une édition publiée précise d’un album musical, avec son numéro de catalogue, son format, sa date et ses enregistrements ordonnés. Distincte de l’œuvre-album, d’un exemplaire personnel, d’un fichier de lecture ou d’un enregistrement.'
  schema:MusicRecording: 'Une interprétation enregistrée et identifiée d’une œuvre musicale, par exemple une prise d’une chanson. Distincte du regroupement d’album, d’une édition publiée, d’un fichier de lecture ou d’un exemplaire personnel.'

  schema:Quotation: 'Une citation rédigée d’une œuvre, avec locuteur, créateur crédité et source tenus distincts.'

propertyDescriptions:
  schema:releaseOf: 'L’œuvre-album que cette édition publiée réalise ; l’édition n’est pas un nouveau nom pour cet album.'
  schema:catalogNumber: 'Le numéro de catalogue attribué à cette édition par son label, conservé tel que la source l’écrit.'
  schema:recordLabel: 'L’organisation créditée comme label ayant publié cette édition.'
  schema:track: 'Un enregistrement identifié sur cette édition. La position, le nom crédité, le rôle, la date et l’occurrence de liste distinguent les usages répétés du même enregistrement.'
  schema:byArtist: 'Une personne ou organisation créditée comme interprète de cet enregistrement, avec nom crédité, ordre et rôle détaillé.'
  wdt:P642: 'Le concept d’occurrence de liste qui sépare deux associations vers le même enregistrement. Ce n’est pas un support ou une face publiés.'

  schema:text: 'Le document exact de la citation. Fournissez une valeur document, pas une étiquette de relation ni un autre champ de texte.'
  schema:spokenByCharacter: 'Le personnage fictif qui prononce cette citation. Ce n’est ni le créateur crédité ni un comédien de voix.'
  schema:about: 'L’œuvre que cette citation cite. L’identité exacte de l’œuvre ou de la partie est requise ; une sous-chaîne ne crée pas de relation.'
  schema:creator: 'Une personne ou une organisation créditée pour cette citation, distincte du locuteur fictif.'
  schema:actor: 'Une voix interprétée facultative. Un locuteur n’implique pas un comédien de voix sans assertion de source qualifiée.'
