types:
  schema:MusicAlbum: 앨범
  schema:Place: 장소
  schema:MusicVenue: 공연장
  schema:AdministrativeArea: 행정구역
  schema:Event: 행사
  schema:MusicEvent: 음악 행사
  wd:Q34379: 악기
properties:
  schema:containedInPlace: 소속
  schema:location: 장소
  wdt:P1303: 악기
inverseProperties:
  schema:containedInPlace: 포함하는 장소
  schema:location: 여기의 행사
