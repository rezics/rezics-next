types:
  schema:MusicAlbum: 音樂專輯
  schema:Quotation: 引文
typeDescriptions:
  schema:MusicAlbum: '彙集曲目的音樂專輯作品，獨立於特定實體副本或發行版本。'
  schema:Quotation: '作品中的引文，說話者、具名創作者與出處分開保存。'
properties:
  schema:text: 正文
  schema:spokenByCharacter: 說話者
  schema:about: 作品
  schema:creator: 具名創作者
  schema:actor: 配音
propertyDescriptions:
  schema:text: '引文的準確正文文件。使用文件值，而不是關係標籤或其他文字欄。'
  schema:spokenByCharacter: '說出這段引文的虛構角色。不是具名創作者，也不是配音。'
  schema:about: '這段引文所指向的作品。需要準確的作品或部分身分；子串比對不會建立關係。'
  schema:creator: '這段引文具名的人物或組織，與虛構說話者分開。'
  schema:actor: '可選的配音。說話者不會在沒有合格來源斷言時被當成配音。'
inverseProperties:
  schema:spokenByCharacter: 說出的引文
  schema:about: 引文
  schema:creator: 具名的引文
  schema:actor: 配音的引文
