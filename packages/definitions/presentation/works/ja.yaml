typeDescriptions:
  schema:MusicAlbum: '楽曲をまとめた音楽アルバムの作品。特定の所蔵物や頒布版とは独立した対象です。'
  schema:MusicRelease: 'カタログ番号・フォーマット・日付と並んだ録音を持つ、音楽アルバムの特定の刊行版。アルバム作品、個人の所蔵物、再生ファイル、個別の録音とは別です。'
  schema:MusicRecording: '楽曲の特定の録音、たとえば一つのテイク。アルバムとしてのまとめ、刊行版、再生ファイル、個人の所蔵物とは別です。'

  schema:Quotation: '作品からの引用。話者、クレジットされた作者、出典を分けて保持します。'

propertyDescriptions:
  schema:releaseOf: 'この刊行版が実現する音楽アルバム作品。刊行版はアルバムの別名ではありません。'
  schema:catalogNumber: '発行レーベルがこの版に付けたカタログ番号。出典の表記どおり保存します。'
  schema:recordLabel: 'この版を発行したレコードレーベルとして記される組織。'
  schema:track: 'この版に載る識別済みの録音。位置、名義、役割、日付、リスト上の出現で、同一録音の繰り返しを区別します。'
  schema:byArtist: 'この録音の演奏者として記される人物または組織。名義、並び、詳細な役割を伴います。'
  wdt:P642: '同一録音への二つの関連を別スロットに保つリスト出現の概念。刊行されたディスクや面ではありません。'

  schema:text: '引用の本文ドキュメントです。関係のラベルや別のテキスト欄ではなく、ドキュメント値を渡します。'
  schema:spokenByCharacter: 'この引用を話す架空のキャラクターです。クレジットされた作者や声優ではありません。'
  schema:about: 'この引用が示す作品です。作品または部分の正確な同一性を要し、部分文字列の一致では関係になりません。'
  schema:creator: 'この引用にクレジットされた人物または組織です。架空の話者とは別に保持します。'
  schema:actor: '任意の演じる声です。話者から、出典に基づく主張なしに声優を推論しません。'

