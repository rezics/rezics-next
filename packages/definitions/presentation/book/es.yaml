propertyDescriptions:
  schema:wordCount: 'Número exacto de palabras de la obra como entero sin unidad; no caracteres ni páginas de una edición.'
  schema:exampleOfWork: 'La obra que materializa esta edición o lanzamiento; enlaza la obra misma, no un ejemplar personal.'
  schema:isbn: 'El ISBN-13 de la edición empieza por 978 o 979; los guiones son opcionales, por ejemplo 9780140328721 o 978-0-14-032872-1.'
  schema:publisher: 'Una persona u organización acreditada como editora de esta edición o lanzamiento.'
  schema:numberOfPages: 'Número de páginas de la edición como cantidad entera sin unidad, igual o superior a 1.'
  schema:translator: 'Una persona u organización acreditada por la traducción de esta edición o publicación.'
