propertyDescriptions:
  schema:wordCount: '책 작품의 정확한 단어 수를 단위 없는 정수로 기록합니다. 글자 수나 판본의 페이지 수와 구별합니다.'
  schema:exampleOfWork: '이 판본이나 출시판이 구현한 작품입니다. 개인 소장본 대신 작품 자체를 연결합니다.'
  schema:isbn: '판본의 ISBN-13입니다. 978 또는 979로 시작하는 13자리 숫자이며 하이픈은 생략할 수 있습니다. 예: 9780140328721, 978-0-14-032872-1.'
  schema:publisher: '이 판본이나 출시판의 발행자로 기재된 사람이나 조직입니다.'
  schema:numberOfPages: '판본의 페이지 수를 단위 없는 1 이상 정수 수량으로 기록합니다.'
  schema:translator: '이 판본이나 발행물의 번역 담당으로 기재된 사람이나 조직입니다.'
