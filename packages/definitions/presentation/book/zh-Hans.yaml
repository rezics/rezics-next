propertyDescriptions:
  schema:wordCount: '书籍作品的精确单词数，以无单位整数记录；不是字符数，也不是某版页数。'
  schema:exampleOfWork: '此版本或发行版所体现的创作作品；链接作品本身，而非个人副本。'
  schema:isbn: '此版本的 ISBN-13，以 978 或 979 开头的 13 位数字记录，可带连字符，如 9780140328721 或 978-0-14-032872-1。'
  schema:publisher: '被署名为此版本或发行版出版者的个人或组织。'
  schema:numberOfPages: '此版本的页数，以无单位且至少为 1 的整数数量记录。'
  schema:translator: '被署名为此版本或出版物翻译者的个人或组织。'
