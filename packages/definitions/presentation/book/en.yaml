typeDescriptions:
  schema:Book: 'A book work independent of any particular edition, translation or physical copy.'
  bf:Instance: 'An identified published edition of a book work, such as a particular translation; separate from a personal copy.'
propertyDescriptions:
  schema:wordCount: 'Exact number of words in the book work as a unitless integer; not character count or edition page count.'
  schema:exampleOfWork: 'The creative work embodied by this edition or release; link the work itself, not another personal copy.'
  schema:isbn: "The edition's ISBN-13, starting with 978 or 979; hyphens are optional, for example 9780140328721 or 978-0-14-032872-1."
  schema:publisher: 'A person or organization credited with publishing this edition or release.'
  schema:numberOfPages: "The edition's page count as a unitless whole-number quantity of at least 1."
  schema:translator: 'A person or organization credited with translating this edition or publication.'
