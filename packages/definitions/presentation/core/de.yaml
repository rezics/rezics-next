typeDescriptions:
  wd:Q2095: 'Ein Lebensmittel oder essbarer Stoff, etwa Mehl; ein Rezept beschreibt dessen Zubereitung.'
  wd:Q2620972: 'Ein benannter, geordneter Abschnitt aus Folgen oder Kapiteln eines Werks mit erster und letzter Teilnummer.'
  schema:Person: 'Eine reale Person im Katalog, etwa ein Autor; fiktive Figuren haben einen eigenen Typ.'
  schema:Organization: 'Eine Organisation oder als Mitwirkende genannte Gruppe, etwa ein Verlag oder Studio.'
  schema:SoftwareApplication: 'Eine identifizierbare Anwendung, etwa ein Leseprogramm; Spiele und ihre Veröffentlichungen haben eigene Typen.'
  rezics:ReleaseGroup: 'Eine von AniDB identifizierte Quellgruppe, die mit den von ihr veröffentlichten Dateien verknüpft ist. Ihre Identität bleibt von jeder Datei und Veröffentlichung getrennt.'
propertyDescriptions:
  rezics:penNameOf: 'Die Person oder Organisation hinter diesem Pseudonym oder Kollektivnamen.'
  wdt:P186: 'Ein Lebensmittel oder zubereitetes Rezept als Zutat oder Bestandteil; Menge und Listenposition können ergänzt werden.'
  wdt:P1114: 'Die Menge des Aussageobjekts mit Einheit und gegebenenfalls angegebenen Unter- und Obergrenzen.'
  rezics:note: 'Eine sprachlich gekennzeichnete Anmerkung zu dieser Aussage, etwa ein möglicher Zutatenersatz.'
  rezics:listSection: 'Die sprachlich gekennzeichnete Überschrift des Listenabschnitts, etwa Soße.'
  rezics:storyArc: 'Ein Handlungsabschnitt dieses Werks; Qualifikatoren nennen Reihenfolge sowie erste und letzte Folgen- oder Kapitelnummer.'
  rezics:firstPart: 'Die erste Folgen- oder Kapitelnummer des Abschnitts in der Nummerierung des Werks.'
  rezics:lastPart: 'Die letzte Folgen- oder Kapitelnummer des Abschnitts in der Nummerierung des Werks.'
  wdt:P518: 'Der Handlungsabschnitt, für den dieser Auftritt oder diese Mitwirkung gilt.'
  schema:url: 'Eine URL, die dieses Subjekt identifiziert.'
  schema:name: 'Ein Titel oder Name aus einer Quelle als Text mit Sprachangabe; der Vorschlag wird nicht automatisch zur Anzeigebezeichnung.'
  schema:sameAs: 'Die kanonische URI derselben Entität in einem anderen Datenbestand; eine nur verwandte Seite genügt nicht.'
  schema:birthDate: 'Das angegebene Geburtsdatum mit bekannter Genauigkeit; ein Geburtstag ohne Jahr ist kein vollständiges Geburtsdatum.'
  schema:deathDate: 'Das angegebene Sterbedatum mit der Datumsgenauigkeit der Quelle.'
  schema:author: 'Eine Person oder Organisation, die als Urheber dieses Werks oder dieser Veröffentlichung genannt wird.'
  schema:position: 'Die bei 1 beginnende Reihenfolge in einer Liste als Text, etwa 1 oder 2.'
  schema:datePublished: 'Das Veröffentlichungsdatum dieses Werks oder dieser Ausgabe in der Genauigkeit der Quelle.'
  schema:version: 'Die Revisionskennung des Quelldatensatzes; keine Schnittfassung oder Ausgabenbezeichnung des Werks.'
  schema:dateModified: 'Zeitpunkt der letzten Änderung am Quelldatensatz, nicht das Veröffentlichungsdatum des Werks.'
  schema:inLanguage: 'Der Sprachcode der Ressource, etwa en oder ja, unabhängig von der Sprache der Oberfläche.'
  schema:abstract: 'Ein verfasstes Zusammenfassungsdokument, üblicherweise eines je Sprache; erwartet wird ein Dokumentwert statt einfachem Text.'
  schema:image: 'Ein hochgeladenes Medienobjekt, das das Subjekt zeigt; erwartet wird ein Medienwert statt einer externen Bild-URL.'
  wdt:P648: 'Eine Open-Library-Kennung wie OL45804W, OL7353617M oder OL23919A; keine Seiten-URL.'
  wdt:P5732: 'Die numerische Bangumi-Werkkennung, etwa 123; keine Personen- oder Figurenkennung.'
  wdt:P6298: 'Die numerische Bangumi-Personenkennung, getrennt von Werk- und Figurenkennungen.'
  wdt:P3180: 'Eine VNDB-Kennung mit Entitätspräfix, etwa v17, r123, p1 oder s1; keine URL.'
  schema:illustrator: 'Eine Person oder Organisation, die für Illustrationen dieses Werks oder dieser Ausgabe genannt wird.'
  schema:director: 'Eine Person oder Organisation, die für die Regie dieses Werks oder dieser Ausgabe genannt wird.'
  schema:musicBy: 'Eine Person oder Organisation, die als Komponist der Musik genannt wird.'
  schema:producer: 'Eine Person oder Organisation, die für die Produktion genannt wird.'
  schema:productionCompany: 'Die Person oder Organisation, die als Produktionsfirma genannt wird.'
  wdt:P58: 'Eine Person oder Organisation, die für das Drehbuch genannt wird.'
  wdt:P178: 'Eine Person oder Organisation, die für die Entwicklung genannt wird.'
  wdt:P725: 'Eine genannte Stimme; der Qualifikator für die Figurenrolle bezeichnet die gespielte Figur.'
  schema:contributor: 'Eine Person oder Organisation mit einer anderen Aufgabe; deren genaue Funktion wird als Rollenkonzept angegeben.'
  wdt:P1932: 'Der genaue Wortlaut, mit dem die Quelle das Aussageobjekt nennt, etwa ein Name im Abspann.'
  wdt:P3831: 'Ein Konzept für die genaue Tätigkeit oder Auftrittsrolle; kein frei formulierter Name im Abspann.'
  wdt:P453: 'Die fiktive Figur, die bei dieser Sprechrolle dargestellt wird.'
  schema:character: 'Eine Figur, die in diesem Werk auftritt; Rolle, Handlungsabschnitt und Spoilerstufe können den Auftritt präzisieren.'
  wdt:P179: 'Die Reihe, zu der dieses Mitglied gehört; der Positionsqualifikator hält seine Nummer fest.'
  rezics:spoilerLevel: 'Offenlegungsstufe als einheitenlose ganze Zahl: 0 ohne Spoiler, 1 für kleine und 2 für große Spoiler.'
  schema:alternateName: 'Ein alternativer Titel oder Alias als Text mit Sprachangabe und ursprünglicher Schreibweise.'
  rezics:representativeEdition: 'Die für eine bestimmte Sprache gewählte repräsentative Ausgabe oder Veröffentlichung dieses Werks, ein Wert je Sprache.'
  rezics:crossMediaCounterpart: 'Ein Werk derselben Franchise in einem anderen Medium; die Adaptionsrichtung bleibt offen.'
  rezics:summaryOf: 'Das vollständige Erzählwerk, das dieses Rückblick- oder Zusammenfassungswerk verkürzt wiedergibt.'
  rezics:sideStoryOf: 'Das Haupterzählwerk, zu dem diese ergänzende Nebengeschichte gehört.'
  rezics:sameCharacters: 'Ein Werk mit gemeinsamen Figuren, aber einer unabhängigen Geschichte.'
  rezics:sameSetting: 'Ein Werk in derselben Welt oder Zeitlinie mit anderen Hauptfiguren.'
  rezics:alternativeSetting: 'Ein Werk mit denselben Hauptfiguren in einer anderen Welt oder Zeitlinie.'
  rezics:alternativeVersion: 'Eine andere Erzählfassung mit derselben Welt und denselben Figuren.'
  rezics:collaborationWith: 'Ein durch einen Figuren-Crossover verbundenes Werk; Gastfigur und gastgebendes Werk werden damit nicht festgelegt.'
  rezics:bangumiRelatedTo: 'Bangumis ausdrückliche Sonstiges-Beziehung zu einem Werk; sie bewahrt diese Quellenangabe ohne erfundene Beziehungsart.'
  rezics:artbookCounterpart: 'Ein Werk und sein begleitendes Artbook, ohne festzulegen, welches der beiden das Artbook ist.'
  rezics:editionCounterpart: 'Eine andere Buchfassung oder Ausgabe; diese symmetrische Beziehung legt weder Original noch Werk-Ausgabe-Richtung fest.'
  rezics:bangumiLegacyVersion: 'Die symmetrische Versionsbeziehung aus Bangumis eingestelltem Main-Version-Code 4013 ohne Richtung zwischen Original und Fassung.'
  rezics:expansionCounterpart: 'Ein Grundspiel und Zusatzinhalt ohne festgelegte Erweiterungsrichtung; bei bekannter Richtung dient die gerichtete Erweiterungsbeziehung.'

  wdt:P4092: 'Exakter Prüfsummentext. Der Hashalgorithmus wird separat gespeichert; gleiche Werte identifizieren oder vereinen keine Dateien.'
  wdt:P3575: 'Dateigröße als exakte Dezimalmenge in Byte, entsprechend der Quelle.'
  rezics:hashAlgorithm: 'Der genaue Quellcode des Prüfsummenalgorithmus; unbekannte Codes bleiben zur Prüfung erhalten.'
  rezics:codec: 'Der genaue von der Quelle gemeldete Codec-Code, auch wenn er noch nicht erkannt wird.'
  rezics:fileQuality: 'Der genaue von der Quelle gemeldete Qualitätscode, auch wenn er noch nicht erkannt wird.'
  rezics:releaseGroup: 'Die unabhängig lesbare AniDB-Quellgruppe dieser Datei, getrennt von Veröffentlichung und persönlicher Kopie.'
