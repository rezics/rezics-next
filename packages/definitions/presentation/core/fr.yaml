typeDescriptions:
  wd:Q2095: 'Un aliment ou une substance comestible, comme la farine ; une recette décrit sa préparation.'
  wd:Q2620972: 'Une suite nommée et ordonnée d’épisodes ou de chapitres d’une œuvre, délimitée par ses premiers et derniers numéros.'
  schema:Person: 'Une personne réelle identifiée dans le catalogue, par exemple un auteur ; les personnages fictifs ont un autre type.'
  schema:Organization: 'Une organisation ou un groupe crédité, par exemple une maison d’édition ou un studio.'
  schema:SoftwareApplication: 'Une application identifiable, comme un logiciel de lecture ; les jeux et leurs éditions ont des types distincts.'
propertyDescriptions:
  rezics:penNameOf: 'La personne ou organisation derrière ce pseudonyme ou nom collectif.'
  wdt:P186: 'Un aliment ou une recette préparée utilisé comme ingrédient ou composant ; sa quantité et son ordre peuvent être précisés.'
  wdt:P1114: 'La quantité de l’objet de l’énoncé, avec son unité et les éventuelles bornes inférieure et supérieure indiquées.'
  rezics:note: 'Une note avec indication de langue sur cet énoncé, par exemple une substitution d’ingrédient.'
  rezics:listSection: 'Le titre avec indication de langue de la section contenant cet élément, par exemple sauce.'
  rezics:storyArc: 'Un arc narratif de cette œuvre ; les qualificatifs indiquent son ordre et les numéros du premier et du dernier épisode ou chapitre.'
  rezics:firstPart: 'Le numéro du premier épisode ou chapitre de l’arc selon la numérotation de l’œuvre.'
  rezics:lastPart: 'Le numéro du dernier épisode ou chapitre de l’arc selon la numérotation de l’œuvre.'
  wdt:P518: 'L’arc narratif auquel s’applique cette apparition ou cette attribution particulière.'
  schema:url: 'Une URL qui identifie ce sujet.'
  schema:name: 'Un titre ou nom provenant d’une source, proposé comme texte avec langue dans un énoncé ; il ne devient pas automatiquement le libellé affiché.'
  schema:sameAs: 'L’URI canonique de cette même entité dans un autre jeu de données ; une simple page connexe ne suffit pas.'
  schema:birthDate: 'La date de naissance indiquée, avec sa précision connue ; un anniversaire sans année n’est pas une date complète.'
  schema:deathDate: 'La date de décès indiquée, en conservant la précision de la source.'
  schema:author: 'Une personne ou organisation créditée comme auteur de cette œuvre ou publication.'
  schema:position: 'L’ordre dans une liste à partir de 1, enregistré en texte, par exemple 1 ou 2.'
  schema:datePublished: 'La date de publication de cette œuvre ou édition, avec la précision de la source.'
  schema:version: 'L’identifiant de révision de la fiche source ; il ne désigne ni un montage ni une édition de l’œuvre.'
  schema:dateModified: 'La date de dernière modification de la fiche source, distincte de la publication de l’œuvre.'
  schema:inLanguage: 'Le code de langue de la ressource, comme en ou ja, indépendamment de la langue de l’interface.'
  schema:abstract: 'Un document de résumé rédigé, habituellement un par langue ; la valeur attendue est un document et non du texte brut.'
  schema:image: 'Un objet média téléversé représentant le sujet ; utiliser une valeur média plutôt qu’une URL d’image externe.'
  wdt:P648: 'Un identifiant Open Library, comme OL45804W, OL7353617M ou OL23919A ; pas l’URL de la fiche.'
  wdt:P5732: 'L’identifiant numérique d’un titre Bangumi, par exemple 123 ; distinct des identifiants de personnes et de personnages.'
  wdt:P6298: 'L’identifiant numérique d’une personne sur Bangumi, distinct de ceux des titres et personnages.'
  wdt:P3180: 'Un identifiant VNDB avec son préfixe d’entité, comme v17, r123, p1 ou s1 ; pas une URL.'
  schema:illustrator: 'Une personne ou organisation créditée pour les illustrations de cette œuvre ou publication.'
  schema:director: 'Une personne ou organisation créditée pour la réalisation de cette œuvre ou publication.'
  schema:musicBy: 'Une personne ou organisation créditée pour la composition musicale.'
  schema:producer: 'Une personne ou organisation créditée pour la production.'
  schema:productionCompany: 'La personne ou organisation créditée comme société de production.'
  wdt:P58: 'Une personne ou organisation créditée pour l’écriture du scénario.'
  wdt:P178: 'Une personne ou organisation créditée pour le développement.'
  wdt:P725: 'Un interprète vocal crédité ; le qualificatif de personnage indique le rôle interprété.'
  schema:contributor: 'Une personne ou organisation créditée pour une autre tâche, précisée par un concept de fonction détaillée.'
  wdt:P1932: 'Le libellé exact employé par la source pour nommer l’objet de l’énoncé, par exemple un nom au générique.'
  wdt:P3831: 'Un concept précisant la fonction dans l’équipe ou le rôle d’une apparition ; pas un nom de crédit en texte libre.'
  wdt:P453: 'Le personnage fictif interprété dans ce crédit vocal.'
  schema:character: 'Un personnage apparaissant dans cette œuvre ; son rôle, son nom crédité, son niveau de divulgâchage, sa partie, son âge et ses références peuvent être précisés.'
  wdt:P3629: 'L’âge du personnage sur cette apparition précise, en quantité non négative d’années (wd:Q577) ; un âge valable pour toute la source n’est pas ce qualificatif.'
  wdt:P179: 'La série à laquelle appartient ce membre ; le qualificatif de position indique son rang.'
  rezics:spoilerLevel: 'Le niveau de divulgâchage, entier sans unité : 0 sans révélation, 1 pour une révélation mineure et 2 pour une majeure.'
  schema:alternateName: 'Un titre alternatif ou alias avec indication de langue, en conservant sa graphie.'
  rezics:representativeEdition: 'L’édition choisie pour représenter cette œuvre dans la langue du qualificatif, à raison d’une valeur par langue.'
  rezics:crossMediaCounterpart: 'Une œuvre de la même franchise dans un autre média ; ce lien n’indique pas le sens de l’adaptation.'
  rezics:summaryOf: 'L’œuvre narrative complète que cette œuvre de récapitulation ou de résumé condense.'
  rezics:sideStoryOf: 'L’œuvre narrative principale à laquelle se rattache cette histoire complémentaire.'
  rezics:sameCharacters: 'Une œuvre partageant des personnages mais racontant une histoire indépendante.'
  rezics:sameSetting: 'Une œuvre dans le même univers ou la même chronologie, avec d’autres personnages principaux.'
  rezics:alternativeSetting: 'Une œuvre plaçant les mêmes personnages principaux dans un autre univers ou une autre chronologie.'
  rezics:alternativeVersion: 'Un autre récit dans le même univers avec les mêmes personnages.'
  rezics:collaborationWith: 'Une œuvre liée par un croisement de personnages ; le lien ne précise ni l’invité ni l’œuvre qui l’accueille.'
  rezics:bangumiRelatedTo: 'La relation Autre explicitement déclarée par Bangumi avec une œuvre ; elle conserve cette assertion sans inventer de catégorie.'
  rezics:artbookCounterpart: 'Une œuvre et son livre d’illustrations associé, sans préciser lequel des deux est ce livre.'
  rezics:editionCounterpart: 'Une autre version ou édition d’un livre ; ce lien symétrique n’établit ni original ni direction entre œuvre et édition.'
  rezics:bangumiLegacyVersion: 'Le lien symétrique de versions issu de l’ancien code Main Version 4013 de Bangumi, sans direction entre original et version.'
  rezics:expansionCounterpart: 'Un jeu de base et un contenu additionnel sans direction précisée ; employer la relation dirigée d’extension lorsque ce sens est connu.'
