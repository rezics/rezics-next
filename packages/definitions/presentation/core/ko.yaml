propertyDescriptions:
  rezics:penNameOf: '이 필명 또는 공동 명의를 사용하는 사람이나 조직.'
  wdt:P186: '재료나 구성 요소로 쓰이는 식품 또는 완성된 조리법입니다. 수량과 목록 순서를 한정자로 덧붙일 수 있습니다.'
  wdt:P1114: '진술 대상의 분량입니다. 단위와 함께, 출처가 제시한 하한과 상한이 있으면 기록합니다.'
  rezics:note: '이 진술에 대한 언어가 지정된 메모입니다. 예를 들어 대체 재료를 설명합니다.'
  rezics:listSection: '이 항목이 속한 목록 구역의 제목입니다. 소스 같은 제목을 언어와 함께 기록합니다.'
  rezics:storyArc: '이 작품의 이야기 구간입니다. 순서와 첫 에피소드 또는 장 번호, 마지막 번호를 한정자로 기록합니다.'
  rezics:firstPart: '구간의 첫 에피소드 또는 장 번호입니다. 작품의 번호 표기를 따릅니다.'
  rezics:lastPart: '구간의 마지막 에피소드 또는 장 번호입니다. 작품의 번호 표기를 따릅니다.'
  wdt:P518: '이 등장이나 크레딧이 적용되는 이야기 구간입니다.'
  schema:url: '이 대상을 식별하는 URL입니다.'
  schema:name: '출처의 제목이나 이름을 언어가 지정된 텍스트로 제안한 진술입니다. 표시 이름으로 자동 채택되지는 않습니다.'
  schema:sameAs: '다른 데이터 집합에서 같은 실체를 가리키는 정식 URI입니다. 단순히 관련된 페이지는 해당하지 않습니다.'
  schema:birthDate: '명시된 생년월일을 알려진 정밀도로 기록합니다. 연도 없는 생일을 완전한 생년월일로 만들지 않습니다.'
  schema:deathDate: '명시된 사망일입니다. 출처의 날짜 정밀도를 유지합니다.'
  schema:author: '이 작품이나 발행물의 저자로 기재된 사람이나 조직입니다.'
  schema:position: '목록에서 1부터 시작하는 순서입니다. 1이나 2처럼 텍스트로 저장합니다.'
  schema:datePublished: '이 작품이나 출시판의 발행일입니다. 출처가 밝힌 날짜 정밀도로 기록합니다.'
  schema:version: '출처 레코드의 개정 식별자입니다. 작품의 편집판이나 판본 이름이 아닙니다.'
  schema:dateModified: '출처 레코드가 마지막으로 수정된 날짜입니다. 작품의 발행일과 구별합니다.'
  schema:inLanguage: 'en이나 ja 같은 자료의 언어 코드입니다. 화면 표시 언어와는 별개입니다.'
  schema:abstract: '작성된 요약 문서입니다. 보통 언어마다 하나를 두며, 일반 문자열이 아닌 문서 값을 사용합니다.'
  schema:image: '대상을 나타내는 업로드된 미디어 객체입니다. 외부 이미지 URL 대신 미디어 값을 사용합니다.'
  wdt:P648: 'OL45804W, OL7353617M, OL23919A 같은 Open Library 식별자입니다. 페이지 URL이 아닙니다.'
  wdt:P5732: '123 같은 Bangumi 작품의 숫자 식별자입니다. 인물이나 캐릭터 ID와 구별합니다.'
  wdt:P6298: 'Bangumi 인물의 숫자 식별자입니다. 작품 및 캐릭터 ID와는 별개입니다.'
  wdt:P3180: 'v17, r123, p1, s1처럼 개체 접두사가 포함된 VNDB 식별자입니다. URL이 아닙니다.'
  schema:illustrator: '이 작품이나 발행물의 삽화 담당으로 기재된 사람이나 조직입니다.'
  schema:director: '이 작품이나 발행물의 연출 담당으로 기재된 사람이나 조직입니다.'
  schema:musicBy: '음악 작곡 담당으로 기재된 사람이나 조직입니다.'
  schema:producer: '프로듀싱 담당으로 기재된 사람이나 조직입니다.'
  schema:productionCompany: '제작사로 기재된 사람이나 조직입니다.'
  wdt:P58: '각본 담당으로 기재된 사람이나 조직입니다.'
  wdt:P178: '개발 담당으로 기재된 사람이나 조직입니다.'
  wdt:P725: '크레딧에 기재된 성우입니다. 연기한 캐릭터는 캐릭터 역할 한정자로 나타냅니다.'
  schema:contributor: '다른 직무로 기재된 사람이나 조직입니다. 구체적인 직무는 상세 역할 개념으로 지정합니다.'
  wdt:P1932: '출처에서 진술 대상을 부른 정확한 표기입니다. 예를 들어 크레딧에 나온 이름을 기록합니다.'
  wdt:P3831: '구체적인 제작진 직무나 등장 역할을 나타내는 개념입니다. 자유롭게 적은 크레딧 이름과는 다릅니다.'
  wdt:P453: '이 음성 크레딧에서 연기한 허구의 캐릭터입니다.'
  schema:character: '이 작품에 등장하는 캐릭터입니다. 역할, 크레디트 이름, 스포일러, 구간, 나이, 전거를 한정할 수 있습니다.'
  wdt:P3629: '이 등장에만 해당하는 나이를 0 이상 연수(wd:Q577)로 적습니다. 출처 전체의 나이는 이 한정자가 아닙니다.'
  wdt:P179: '이 구성원이 속한 시리즈입니다. 위치 한정자로 시리즈 내 번호를 기록합니다.'
  rezics:spoilerLevel: '단위 없는 정수로 나타낸 공개 수준입니다. 0은 스포일러 없음, 1은 가벼운 내용, 2는 중대한 내용입니다.'
  schema:alternateName: '다른 제목이나 별칭을 언어가 지정된 텍스트로 기록합니다. 원래 표기와 언어를 유지합니다.'
  rezics:representativeEdition: '한정된 언어에서 이 작품을 대표하도록 선택한 판본이나 출시판입니다. 언어마다 하나의 값을 둡니다.'
  rezics:crossMediaCounterpart: '같은 프랜차이즈에 속한 다른 매체의 작품입니다. 어느 쪽이 원작인지는 이 연결만으로 정하지 않습니다.'
  rezics:summaryOf: '이 총집편이나 요약 작품이 내용을 압축한 전체 서사 작품입니다.'
  rezics:sideStoryOf: '이 보충적인 외전이 속하는 본편 작품입니다.'
  rezics:sameCharacters: '캐릭터를 공유하지만 독립적인 이야기를 다루는 작품입니다.'
  rezics:sameSetting: '같은 세계나 시간대를 공유하되 주요 등장인물이 다른 작품입니다.'
  rezics:alternativeSetting: '같은 주요 등장인물을 다른 세계나 시간대에 배치한 작품입니다.'
  rezics:alternativeVersion: '같은 배경과 캐릭터로 다르게 풀어낸 이야기입니다.'
  rezics:collaborationWith: '캐릭터 크로스오버로 연결된 작품입니다. 초대된 캐릭터나 이를 받아들이는 작품은 이 연결만으로 특정하지 않습니다.'
  rezics:bangumiRelatedTo: 'Bangumi가 명시한 기타 작품 관계입니다. 관계 종류를 추측하지 않고 해당 출처의 주장을 보존합니다.'
  rezics:artbookCounterpart: '작품과 그에 딸린 화집의 연결입니다. 어느 쪽이 화집인지는 정하지 않습니다.'
  rezics:editionCounterpart: '다른 책 버전이나 판본과의 대칭 관계입니다. 원본이나 작품에서 판본으로 향하는 방향은 정하지 않습니다.'
  rezics:bangumiLegacyVersion: 'Bangumi의 폐기된 Main Version 코드 4013에서 온 대칭적 버전 관계입니다. 원본의 방향을 정하지 않습니다.'
  rezics:expansionCounterpart: '어느 쪽이 확장하는지 정하지 않은 기본 게임과 추가 작품의 연결입니다. 방향이 확인되면 방향 있는 확장 관계를 사용합니다.'
typeDescriptions:
  wd:Q2095: '밀가루 같은 식품이나 먹을 수 있는 물질입니다. 조리법은 이를 준비하는 방법을 설명합니다.'
  wd:Q2620972: '작품의 에피소드나 장을 순서대로 묶은 이름 있는 이야기 구간입니다. 첫 부분과 마지막 부분의 번호로 범위를 나타냅니다.'
  schema:Person: '저자처럼 목록에서 식별하는 실제 인물입니다. 허구의 캐릭터와 구별합니다.'
  schema:Organization: '출판사나 스튜디오 같은 조직 또는 크레딧에 기재된 단체입니다.'
  schema:SoftwareApplication: '독서 도구처럼 개별적으로 식별되는 응용 프로그램입니다. 게임 작품과 출시판에는 별도 유형이 있습니다.'
