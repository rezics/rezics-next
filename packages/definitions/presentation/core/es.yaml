typeDescriptions:
  wd:Q2095: 'Un alimento o sustancia comestible, como la harina; la receta describe cómo prepararlo.'
  wd:Q2620972: 'Un tramo narrativo con nombre y orden dentro de una obra, delimitado por números de episodios o capítulos.'
  schema:Person: 'Una persona real identificada en el catálogo, por ejemplo un autor; los personajes ficticios tienen otro tipo.'
  schema:Organization: 'Una organización o grupo acreditado, como una editorial o un estudio.'
  schema:SoftwareApplication: 'Una aplicación identificable, como un lector; las obras de videojuegos y sus lanzamientos tienen tipos propios.'
  rezics:ReleaseGroup: 'Un grupo de origen identificado por AniDB y vinculado a los archivos que publica. Su identidad se mantiene separada de cada archivo y de cada lanzamiento.'
  schema:Place: 'Un lugar geográfico o construido concreto, distinto de los eventos que se celebran allí.'
  schema:AdministrativeArea: 'Una región administrativa con nombre representada como lugar, distinta de un recinto situado en ella.'
  schema:Event: 'Un acontecimiento delimitado con identidad propia, distinto de su lugar y sus participantes.'
propertyDescriptions:
  rezics:stylisticallyComparableTo: 'Una obra literaria o un videojuego que sirve de referencia para describir el estilo, la estructura, las mecánicas, el tono o la experiencia de esta obra. La comparación tiene una dirección y no afirma influencia ni derivación. El género y las palabras clave son independientes.'
  rezics:penNameOf: 'La persona u organización detrás de este seudónimo o nombre colectivo.'
  wdt:P186: 'Un alimento o receta preparada que se usa como ingrediente o componente; se pueden precisar cantidad y orden.'
  wdt:P1114: 'La cantidad del objeto de la declaración, con su unidad y los límites inferior y superior que se indiquen.'
  rezics:note: 'Una nota con idioma sobre esta declaración, por ejemplo una sustitución de ingredientes.'
  rezics:listSection: 'El encabezado con idioma de la sección de la lista a la que pertenece este elemento, por ejemplo salsa.'
  rezics:storyArc: 'Un arco narrativo de esta obra; los calificadores indican orden y números del primer y último episodio o capítulo.'
  rezics:firstPart: 'El número del primer episodio o capítulo del arco según la numeración de la obra.'
  rezics:lastPart: 'El número del último episodio o capítulo del arco según la numeración de la obra.'
  wdt:P518: 'El arco narrativo al que se aplica esta aparición o crédito concreto.'
  schema:url: 'Una URL que identifica este sujeto.'
  schema:name: 'Un título o nombre de la fuente como texto con idioma, propuesto en una declaración; no pasa a ser la etiqueta visible automáticamente.'
  schema:sameAs: 'La URI canónica de esta misma entidad en otro conjunto de datos; una página relacionada no es una coincidencia exacta.'
  schema:birthDate: 'La fecha de nacimiento declarada, con su precisión conocida; un cumpleaños sin año no es una fecha completa.'
  schema:deathDate: 'La fecha de fallecimiento declarada, conservando la precisión de la fuente.'
  schema:author: 'Una persona u organización acreditada como autora de esta obra o publicación.'
  schema:position: 'El orden dentro de una lista empezando por 1, guardado como texto, por ejemplo 1 o 2.'
  schema:datePublished: 'La fecha de publicación de esta obra o lanzamiento, con la precisión indicada por la fuente.'
  schema:version: 'El identificador de revisión del registro de origen; no designa un montaje ni una edición de la obra.'
  schema:dateModified: 'La fecha de la última actualización del registro de origen, no la publicación de la obra.'
  schema:inLanguage: 'El código de idioma del recurso, como en o ja, independiente del idioma de la interfaz.'
  schema:abstract: 'Un documento de resumen redactado, normalmente uno por idioma; acepta un valor de documento y no texto simple.'
  wdt:P106: 'Un concepto que nombra la ocupación de esta persona, como director o escritor; los créditos de las obras no aportan este hecho.'
  schema:knowsLanguage: 'Un idioma que esta persona conoce, registrado como un concepto admitido; no es competencia oral ni el idioma de una obra acreditada.'
  wdt:P749: 'La organización matriz de este productor. La declaración se guarda en el hijo y puede llevar fechas de inicio y fin con citas.'
  wdt:P1365: 'La organización a la que este productor sustituye. El valor es el predecesor; un reemplazo dirigido, no un vecino cronológico genérico.'
  wdt:P1366: 'La organización que sustituye a este productor. El valor es el sucesor, como dirección independiente de la declaración de predecesor.'
  schema:image: 'Un objeto multimedia subido que representa al sujeto; acepta un valor multimedia y no una URL de imagen externa.'
  wdt:P648: 'Un identificador de Open Library, como OL45804W, OL7353617M u OL23919A; no la URL de la página.'
  wdt:P5732: 'El identificador numérico de un título en Bangumi, por ejemplo 123; no un ID de persona o personaje.'
  wdt:P6298: 'El identificador numérico de persona en Bangumi, distinto de los de títulos y personajes.'
  wdt:P3180: 'Un identificador de VNDB con su prefijo de entidad, como v17, r123, p1 o s1; no una URL.'
  schema:illustrator: 'Una persona u organización acreditada por las ilustraciones de esta obra o publicación.'
  schema:director: 'Una persona u organización acreditada por la dirección de esta obra o publicación.'
  schema:musicBy: 'Una persona u organización acreditada por la composición musical.'
  schema:producer: 'Una persona u organización acreditada por la producción.'
  schema:productionCompany: 'La persona u organización acreditada como compañía de producción.'
  wdt:P58: 'Una persona u organización acreditada por la escritura del guion.'
  wdt:P178: 'Una persona u organización acreditada por el desarrollo.'
  wdt:P725: 'Un intérprete de voz acreditado; el calificador de personaje indica a quién interpreta.'
  schema:contributor: 'Una persona u organización acreditada en otro trabajo; un concepto de función detallada especifica cuál.'
  wdt:P1932: 'La forma exacta con la que la fuente nombra el objeto de la declaración, como un nombre en los créditos.'
  wdt:P3831: 'Un concepto que especifica el puesto del equipo o el papel de una aparición; no un nombre de crédito en texto libre.'
  wdt:P453: 'El personaje ficticio interpretado en este crédito de voz.'
  schema:character: 'Un personaje que aparece en esta obra; se puede precisar su papel, nombre acreditado, spoiler, parte, edad y referencias.'
  wdt:P3629: 'La edad del personaje en esta aparición concreta, como cantidad no negativa en años (wd:Q577); una edad de toda la fuente no es este calificador.'
  wdt:P179: 'La serie a la que pertenece este miembro; el calificador de posición indica su número de orden.'
  rezics:spoilerLevel: 'Nivel de revelación como entero sin unidad: 0 sin spoilers, 1 para spoilers menores y 2 para importantes.'
  schema:alternateName: 'Un título alternativo o alias como texto con idioma, conservando su escritura original.'
  rezics:representativeEdition: 'La edición o lanzamiento elegido para representar esta obra en el idioma indicado por el calificador, un valor por idioma.'
  rezics:crossMediaCounterpart: 'Una obra de la misma franquicia en otro medio; el enlace no determina cuál adapta a cuál.'
  rezics:summaryOf: 'La obra narrativa completa que esta obra de recapitulación o resumen condensa.'
  rezics:sideStoryOf: 'La obra narrativa principal a la que pertenece esta historia complementaria.'
  rezics:sameCharacters: 'Una obra que comparte personajes, pero cuenta una historia independiente.'
  rezics:sameSetting: 'Una obra situada en el mismo mundo o línea temporal con protagonistas distintos.'
  rezics:alternativeSetting: 'Una obra que sitúa a los mismos protagonistas en otro mundo o línea temporal.'
  rezics:alternativeVersion: 'Otra versión narrativa con el mismo entorno y los mismos personajes.'
  rezics:collaborationWith: 'Una obra vinculada por un cruce de personajes; el enlace no identifica al invitado ni a la obra que lo recibe.'
  rezics:bangumiRelatedTo: 'La relación explícita Otros de Bangumi con otra obra; conserva esa afirmación sin inventar un tipo de relación.'
  rezics:artbookCounterpart: 'Una obra y su libro de ilustraciones complementario, sin indicar cuál de los extremos es el libro.'
  rezics:editionCounterpart: 'Otra versión o edición de un libro; el enlace simétrico no fija un original ni una dirección entre obra y edición.'
  rezics:bangumiLegacyVersion: 'El vínculo simétrico de versiones del antiguo código Main Version 4013 de Bangumi, sin dirección entre original y versión.'
  rezics:expansionCounterpart: 'Un juego base y un complemento sin indicar cuál amplía al otro; si se conoce la dirección, se usa la relación de expansión dirigida.'

  wdt:P4092: 'Texto exacto de la suma de comprobación. El algoritmo hash se guarda por separado; la igualdad no identifica ni fusiona archivos.'
  wdt:P3575: 'Tamaño del archivo como cantidad decimal exacta en bytes, tal como lo indica la fuente.'
  rezics:hashAlgorithm: 'El código exacto de la fuente para el algoritmo de suma; los códigos desconocidos quedan disponibles para revisión.'
  rezics:codec: 'El código de códec exacto indicado por la fuente, incluidos los que aún no se reconocen.'
  rezics:fileQuality: 'El código de calidad exacto indicado por la fuente, incluidos los que aún no se reconocen.'
  rezics:releaseGroup: 'El grupo de origen de AniDB, legible de forma independiente, asociado a este archivo y separado de un lanzamiento y una copia personal.'
  schema:containedInPlace: 'El lugar inmediato que contiene a este lugar, como su área administrativa.'
  schema:location: 'El lugar donde ocurre este evento; no identifica el evento ni una actuación concreta.'
  schema:startDate: 'El comienzo indicado del intervalo temporal del sujeto, conservando la precisión y el calendario de la fuente.'
  schema:endDate: 'El final indicado del intervalo temporal del sujeto, conservando la precisión y el calendario de la fuente.'
