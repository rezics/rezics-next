typeDescriptions:
  wd:Q2095: '可食用的食物或物质，如面粉；食谱则描述如何制作食物。'
  wd:Q2620972: '作品中有名称且按顺序排列的一段集数或章节范围，以首尾编号界定。'
  schema:Person: '目录中可识别的真实人物，如作者；与虚构角色分开记录。'
  schema:Organization: '出版社、工作室等组织，或署名的团体。'
  schema:SoftwareApplication: '可独立识别的软件应用，如阅读工具；游戏作品及其发行版使用各自的类型。'
propertyDescriptions:
  rezics:penNameOf: '使用此笔名或共同名义的个人或组织。'
  wdt:P186: '用作材料或组成部分的食物或已制成的食谱，可用限定词补充用量及列表顺序。'
  wdt:P1114: '陈述对象的用量，带单位；若来源给出范围，同时保留下限与上限。'
  rezics:note: '为这条陈述补充的带语言说明，例如食材替换建议。'
  rezics:listSection: '此项所属列表分节的带语言标题，例如酱汁。'
  rezics:storyArc: '属于此作品的故事篇章，用限定词记录顺序及首尾集数或章节编号。'
  rezics:firstPart: '篇章的首集或首章编号，保留作品自身的编号写法。'
  rezics:lastPart: '篇章的末集或末章编号，保留作品自身的编号写法。'
  wdt:P518: '此次角色登场或署名实际适用的故事篇章。'
  schema:url: '用于识别此对象的 URL。'
  schema:name: '将来源中的标题或名称作为带语言文本提出的陈述，不会自动成为显示标签。'
  schema:sameAs: '此同一实体在其他数据集中的规范 URI；仅相关的页面不属于精确匹配。'
  schema:birthDate: '来源明确记载的出生日期，保留已知精度；没有年份的生日不能当作完整出生日期。'
  schema:deathDate: '来源记载的死亡日期，保留来源的日期精度。'
  schema:author: '被署名为此作品或出版物作者的个人或组织。'
  schema:position: '列表中从 1 开始的顺序，以字符串保存，如 1、2。'
  schema:datePublished: '此作品或发行版的出版日期，保留来源给出的日期精度。'
  schema:version: '来源记录的修订标识，不是作品的剪辑版本或出版版本名称。'
  schema:dateModified: '来源记录最后更新的日期，与作品出版日期分开。'
  schema:inLanguage: '资源所用的语言代码，如 en、ja，与界面语言分开。'
  schema:abstract: '作者撰写的摘要文档，惯例上每种语言一个；接受文档值，而非普通字符串。'
  schema:image: '描绘此对象的已上传媒体对象；使用媒体值，而非外部图片 URL。'
  wdt:P648: 'Open Library 标识，如 OL45804W、OL7353617M 或 OL23919A；填写标识，不填页面 URL。'
  wdt:P5732: 'Bangumi 条目的数字标识，如 123；与人物、角色标识分开。'
  wdt:P6298: 'Bangumi 人物的数字标识，与条目及角色标识分开。'
  wdt:P3180: '带实体前缀的 VNDB 标识，如 v17、r123、p1、s1；不是 URL。'
  schema:illustrator: '被署名为此作品或出版物插画者的个人或组织。'
  schema:director: '被署名为此作品或出版物导演的个人或组织。'
  schema:musicBy: '被署名为音乐作曲者的个人或组织。'
  schema:producer: '被署名为制作人的个人或组织。'
  schema:productionCompany: '被署名为制作公司的个人或组织。'
  wdt:P58: '被署名为编剧的个人或组织。'
  wdt:P178: '被署名为开发者的个人或组织。'
  wdt:P725: '署名的配音者，可用角色限定词指出所配角色。'
  schema:contributor: '担任其他工作的署名个人或组织；具体职务用详细角色概念说明。'
  wdt:P1932: '来源中称呼陈述对象的原文写法，例如演职员表上的署名。'
  wdt:P3831: '具体工作人员职务或登场身份的概念，不是自由填写的署名文本。'
  wdt:P453: '此次配音署名所饰演的虚构角色。'
  schema:character: '在此作品中登场的角色，可限定其身份、署名、剧透、篇章、年龄和参考文献。'
  wdt:P3629: '该登场陈述上的年龄，以非负年数（wd:Q577）记录；来源整体年龄不是此限定。'
  wdt:P179: '此成员所属的系列，用位置限定词记录系列内编号。'
  rezics:spoilerLevel: '无单位整数表示的披露等级：0 为无剧透，1 为轻微剧透，2 为重大剧透。'
  schema:alternateName: '别名或其他标题，以带语言文本保存原有拼写及语言。'
  rezics:representativeEdition: '为指定语言选作此作品代表的版本或发行版，每种语言一个值。'
  rezics:crossMediaCounterpart: '同一系列企划中不同媒介的作品；此关联本身不判定改编方向。'
  rezics:summaryOf: '此总集篇或摘要作品所浓缩的完整叙事作品。'
  rezics:sideStoryOf: '此补充性外传所属的主线叙事作品。'
  rezics:sameCharacters: '共用角色但讲述独立故事的作品。'
  rezics:sameSetting: '世界或时间线相同、主要角色不同的作品。'
  rezics:alternativeSetting: '将相同主要角色置于不同世界或时间线的作品。'
  rezics:alternativeVersion: '使用相同背景与角色的另一种故事讲述。'
  rezics:collaborationWith: '通过角色联动关联的作品；此关联本身不指出客串角色或承载联动的作品。'
  rezics:bangumiRelatedTo: 'Bangumi 明确给出的其他条目关联，仅保留该来源的主张，不推测具体关系种类。'
  rezics:artbookCounterpart: '作品与其配套画集的关联，不指出哪一端是画集。'
  rezics:editionCounterpart: '书籍的其他版本或版次；此对称关联不判定原版，也不表示作品到版本的方向。'
  rezics:bangumiLegacyVersion: '保留自 Bangumi 已停用 Main Version 代码 4013 的对称版本关联，不判定原版方向。'
  rezics:expansionCounterpart: '基础游戏与追加作品的无方向关联；若来源明确扩展方向，可使用有方向的扩展关系。'
