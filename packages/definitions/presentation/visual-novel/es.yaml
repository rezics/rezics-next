typeDescriptions:
  wd:Q689445: 'Una novela visual como obra, independiente de sus lanzamientos por idioma o plataforma; personajes y equipo se enlazan mediante declaraciones de la obra.'
propertyDescriptions:
  wdt:P144: 'La obra en la que se basa esta novela visual; identifica la fuente y no un vínculo entre medios sin dirección.'
  wdt:P1889: 'Otra novela visual en el mismo entorno o continuidad; ambas siguen siendo obras distintas.'
  wdt:P361: 'La obra mayor que contiene esta obra, como una historia principal o recopilación.'
  rezics:spinOffOf: 'La obra original de la que deriva esta obra secundaria.'
