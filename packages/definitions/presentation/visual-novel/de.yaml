typeDescriptions:
  wd:Q689445: 'Eine Visual Novel als Werk, unabhängig von Sprach- oder Plattformveröffentlichungen; Figuren und Mitwirkende sind über Aussagen am Werk verknüpft.'
propertyDescriptions:
  wdt:P144: 'Das Werk, auf dem diese Visual Novel beruht; bezeichnet die Vorlage statt einer ungerichteten Medienverbindung.'
  wdt:P1889: 'Eine alternative Visual Novel in derselben Welt oder Kontinuität; beide bleiben eigenständige Werke.'
  wdt:P361: 'Das größere Werk, zu dem dieses Werk gehört, etwa eine übergeordnete Geschichte oder Zusammenstellung.'
  rezics:spinOffOf: 'Das Ursprungswerk, aus dem dieses Spin-off hervorgeht.'
