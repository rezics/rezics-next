typeDescriptions:
  wd:Q95074: 'An independently identifiable fictional character, including a fictional machine, ship or organization; appearances and voice credits belong on works.'
propertyDescriptions:
  schema:gender: "The fictional character's explicitly described gender as a Concept; do not infer biological sex."
  schema:height: "The character's stated height as a nonnegative quantity in centimetres (wd:Q174728) or metres (wd:Q11573), preserving its unit."
  schema:weight: "The character's stated mass as a nonnegative quantity in kilograms (wd:Q11570) or grams (wd:Q41803), preserving its unit."
  wdt:P1853: 'The explicitly stated blood type as a Concept, such as A; unknown remains unknown.'
  wdt:P6296: 'The positive numeric Bangumi character identifier; not a subject or person ID and not a page URL.'
  rezics:relatedCharacterIdentity: 'Another Character this identity is associated with; not a merge, redirect, class instance, combined biography or the appearance role main.'
  wdt:P26: 'Another Character stated as this character’s spouse, with optional spoiler qualification.'
  wdt:P3373: 'Another Character stated as this character’s sibling, with optional spoiler qualification.'
  wdt:P22: 'The Character stated as this character’s father, with optional spoiler qualification.'
  wdt:P25: 'The Character stated as this character’s mother, with optional spoiler qualification.'
  wdt:P451: 'Another Character stated as this character’s unmarried partner or lover, with optional spoiler qualification.'
  rezics:characterRival: 'Another Character stated as this character’s rival or enemy; not a work appearance role.'
