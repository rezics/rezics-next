typeDescriptions:
  wd:Q95074: '独立して識別できる架空のキャラクター。架空の機械、船、組織も含みます。登場や声の出演は作品側に記録します。'
propertyDescriptions:
  schema:gender: '架空のキャラクターについて明示されたジェンダーを概念で示します。生物学的性別を推測しません。'
  schema:height: '明記された身長を0以上の数量で記録します。単位はセンチメートル（wd:Q174728）またはメートル（wd:Q11573）で、元の単位を保ちます。'
  schema:weight: '明記された体重を0以上の数量で記録します。単位はキログラム（wd:Q11570）またはグラム（wd:Q41803）で、元の単位を保ちます。'
  wdt:P1853: '明記された血液型をA型などの概念で示します。不明なものを補いません。'
  wdt:P6296: '正の数字で表すBangumiのキャラクター識別子。作品や人物のID、ページURLとは別です。'
