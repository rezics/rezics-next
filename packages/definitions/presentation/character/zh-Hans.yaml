typeDescriptions:
  wd:Q95074: '可独立识别的虚构角色，也包括虚构机器、船只或组织；登场及配音署名记录在作品上。'
propertyDescriptions:
  schema:gender: '来源明确描述的虚构角色性别，以概念表示，不推断生理性别。'
  schema:height: '角色明确记载的身高，以非负数量保留来源单位：厘米（wd:Q174728）或米（wd:Q11573）。'
  schema:weight: '角色明确记载的体重，以非负数量保留来源单位：千克（wd:Q11570）或克（wd:Q41803）。'
  wdt:P1853: '明确记载的血型概念，如 A 型；未知值保持未知。'
  wdt:P6296: 'Bangumi 角色的正整数数字标识，不是条目或人物标识，也不是页面 URL。'
  rezics:relatedCharacterIdentity: '与此同一性关联的另一角色；不是合并、重定向、类实例、合并传记，也不是登场角色 main。'
  wdt:P26: '被记载为配偶的另一角色，可附剧透等级。'
  wdt:P3373: '被记载为兄弟姐妹的另一角色，可附剧透等级。'
  wdt:P22: '被记载为父亲的角色，可附剧透等级。'
  wdt:P25: '被记载为母亲的角色，可附剧透等级。'
  wdt:P451: '被记载为恋人或伴侣的另一角色，可附剧透等级。'
  rezics:characterRival: '被记载为对手或敌人的另一角色；不是作品登场角色。'
