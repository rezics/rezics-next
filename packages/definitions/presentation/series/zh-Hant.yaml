typeDescriptions:
  wd:Q7725310: '具名稱的創作作品系列，可包含非虛構或不同媒介作品；個人策劃的清單屬於收藏集。'
  schema:BookSeries: '由多本書組成的叢書，各成員以所屬系列關係連結，並可記錄位置。'
propertyDescriptions:
  wdt:P2635: '來源明示的系列部分數，以卷（wd:Q1238720）或章（wd:Q1980247）為單位的非負整數數量記錄。'
  wdt:P1433: '此系列刊載於的更大創作作品，例如雜誌。'
