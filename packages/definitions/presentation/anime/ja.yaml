typeDescriptions:
  rezics:AnimeRelease: '作品自体とは別に識別される、アニメの刊行版または頒布版。エピソード、再生ファイル、個人の所蔵物とも区別し、言語や形式の違いだけで別の版を作りません。'
  schema:Episode: '第3話や特別編など、個別に識別されるアニメ作品の一回分。再生ファイルやシーズン全体ではありません。'
  schema:Movie: '作品としての長編または短編アニメ映画。頒布された各版とは独立した対象です。'
  schema:TVSeason: 'テレビアニメの中で個別に識別される一つのシーズン。シリーズ全体や単一のエピソードとは区別します。'
  schema:TVSeries: 'シーズンやエピソードを含む作品としてのテレビアニメシリーズ。特定の刊行版とは別です。'
  schema:MediaObject: "独立して識別されるカタログ上のファイルです。メタデータは所持、ダウンロード権限、再生可能性、視聴進捗を証明しません。"
