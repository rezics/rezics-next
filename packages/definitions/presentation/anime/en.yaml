propertyDescriptions:
  bf:hasPart: 'An independently identified anime work included in this anthology publication; link the actual series, film, season or episode.'
  marcrel:fds: "A person or organization credited with distributing this moving-image publication; do not copy a work's unrelated credits."
  schema:copyrightNotice: 'The copyright notice stated by the source; it does not establish a reuse licence.'
  schema:duration: 'The stated running time as a nonnegative whole-number quantity in seconds (wd:Q11574), for example 1440 for 24 minutes.'
  schema:endDate: "The end of the original broadcast or release period, preserving the source's date precision."
  schema:episodeNumber: "The episode's source ordinal as text, allowing 0, specials or fractional numbering; separate from the episode's identifier."
  schema:isPartOf: 'The television series or season containing this episode.'
  schema:numberOfEpisodes: 'Number of episodes in this work or season as a nonnegative unitless whole-number quantity.'
  schema:startDate: "The start of the original broadcast or release period, preserving the source's date precision."
  wdt:P449: 'The organization identified by the source as the original broadcaster; not every later distributor.'
  wdt:P973: 'A URL for a page describing this anime work; a descriptive link is not an exact identity match.'

  schema:associatedMedia: "A catalogue file associated with this identified anime publication release; the link does not make the file the release."
  schema:encodesCreativeWork: "The episode encoded by this exact catalogue file; the relation does not establish possession or watched state."