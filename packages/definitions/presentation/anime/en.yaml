typeDescriptions:
  rezics:AnimeRelease: 'An independently identified publication or distributed version of anime content. Distinct from the work, episode, playback file or personal copy; languages and formats alone do not create separate releases.'
  schema:Episode: 'An independently identified installment of an anime work, such as episode 3 or a special; not a playback file or a whole season.'
  schema:Movie: 'An animated feature or short film as a work, independent of its distributed editions.'
  schema:TVSeason: 'A separately identified season of an animated television series, rather than the whole series or a single episode.'
  schema:TVSeries: 'An animated television series as a work spanning its seasons and episodes, distinct from a particular publication release.'
  schema:MediaObject: "An independently identified catalogue file. Its metadata does not establish possession, permission to download, playback availability or watched progress."
