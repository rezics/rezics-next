propertyDescriptions:
  bf:hasPart: '이 선집 발행판에 포함된 독립적인 애니메이션 작품입니다. 실제 시리즈, 영화, 시즌 또는 에피소드를 연결합니다.'
  marcrel:fds: '이 영상 발행물의 배급 담당으로 기재된 사람이나 조직입니다. 작품의 무관한 크레딧을 복사하지 않습니다.'
  schema:copyrightNotice: '출처에 기재된 저작권 고지입니다. 재사용 허락을 입증하지는 않습니다.'
  schema:duration: '명시된 상영 시간을 초(wd:Q11574) 단위의 0 이상 정수 수량으로 기록합니다. 24분은 1440입니다.'
  schema:endDate: '최초 방송 또는 공개 기간의 종료일입니다. 출처의 날짜 정밀도를 유지합니다.'
  schema:episodeNumber: '출처의 에피소드 순번을 텍스트로 기록합니다. 0, 특별편, 소수 번호를 허용하며 에피소드 식별자와 구별합니다.'
  schema:isPartOf: '이 에피소드가 속하는 TV 시리즈 또는 시즌입니다.'
  schema:numberOfEpisodes: '이 작품이나 시즌의 에피소드 수입니다. 단위 없는 0 이상 정수 수량입니다.'
  schema:startDate: '최초 방송 또는 공개 기간의 시작일입니다. 출처의 날짜 정밀도를 유지합니다.'
  wdt:P449: '출처가 최초 방송사로 명시한 조직입니다. 이후의 모든 배급사를 뜻하지 않습니다.'
  wdt:P973: '이 애니메이션 작품을 설명하는 페이지의 URL입니다. 동일 실체의 정확한 일치와 구별합니다.'

  schema:associatedMedia: '식별된 애니메이션 발행 릴리스와 연결된 카탈로그 파일입니다. 이 연결이 파일을 발행물과 동일하게 만들지는 않습니다.'
  schema:encodesCreativeWork: '이 정확한 카탈로그 파일에 인코딩된 에피소드입니다. 이 관계는 소유나 시청 상태를 증명하지 않습니다.'
