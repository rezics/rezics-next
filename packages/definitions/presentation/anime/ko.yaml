typeDescriptions:
  rezics:AnimeRelease: '작품 자체와 별개로 식별되는 애니메이션의 발행판 또는 배급판. 에피소드, 재생 파일, 개인 소장본과 구별하며 언어나 형식 차이만으로 별도 출시판을 만들지 않습니다.'
  schema:Episode: '3화나 특별편처럼 개별적으로 식별되는 애니메이션의 한 회차입니다. 재생 파일이나 시즌 전체가 아닙니다.'
  schema:Movie: '장편 또는 단편 애니메이션 영화 작품입니다. 배급된 개별 판본과 독립적입니다.'
  schema:TVSeason: 'TV 애니메이션에서 별도로 식별되는 한 시즌입니다. 시리즈 전체나 개별 에피소드와 구별합니다.'
  schema:TVSeries: '시즌과 에피소드를 아우르는 TV 애니메이션 시리즈 작품입니다. 특정 발행판과는 별개입니다.'
  schema:MediaObject: '독립적으로 식별되는 카탈로그 파일입니다. 메타데이터는 소유, 다운로드 권한, 재생 가능 여부 또는 시청 진행을 증명하지 않습니다.'
