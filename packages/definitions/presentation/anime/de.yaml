typeDescriptions:
  rezics:AnimeRelease: 'Eine eigenständig identifizierte Veröffentlichung oder Vertriebsversion von Anime-Inhalten. Getrennt von Werk, Folge, Wiedergabedatei und persönlichem Exemplar; Sprachen und Formate allein erzeugen keine weiteren Veröffentlichungen.'
  schema:Episode: 'Eine eigenständig identifizierte Folge eines Anime-Werks, etwa Folge 3 oder ein Special; weder Wiedergabedatei noch ganze Staffel.'
  schema:Movie: 'Ein animierter Lang- oder Kurzfilm als Werk, unabhängig von seinen veröffentlichten Ausgaben.'
  schema:TVSeason: 'Eine gesondert identifizierte Staffel einer animierten Fernsehserie, getrennt von Gesamtserie und einzelner Folge.'
  schema:TVSeries: 'Eine animierte Fernsehserie als Werk mit ihren Staffeln und Folgen, unabhängig von einer bestimmten Veröffentlichung.'
  schema:MediaObject: 'Eine unabhängig identifizierte Katalogdatei. Ihre Metadaten belegen weder Besitz noch Downloadberechtigung, Wiedergabe oder gesehenen Fortschritt.'
