propertyDescriptions:
  bf:hasPart: 'Ein eigenständig identifiziertes Anime-Werk in dieser Sammelveröffentlichung; die tatsächliche Serie, den Film, die Staffel oder Folge verknüpfen.'
  marcrel:fds: 'Eine Person oder Organisation, die für den Vertrieb dieser Filmveröffentlichung genannt wird; keine fremden Werk-Credits übernehmen.'
  schema:copyrightNotice: 'Der Urheberrechtshinweis aus der Quelle; er begründet keine Lizenz zur Weiterverwendung.'
  schema:duration: 'Die angegebene Laufzeit als nichtnegative ganzzahlige Menge in Sekunden (wd:Q11574), etwa 1440 für 24 Minuten.'
  schema:episodeNumber: 'Die Folgennummer aus der Quelle als Text, auch 0, Specials oder Bruchzahlen; getrennt von der Folgenkennung.'
  schema:isPartOf: 'Die Fernsehserie oder Staffel, zu der diese Folge gehört.'
  schema:numberOfEpisodes: 'Die Folgenzahl dieses Werks oder dieser Staffel als nichtnegative, einheitenlose ganzzahlige Menge.'
  wdt:P449: 'Die von der Quelle als ursprünglicher Sender bezeichnete Organisation, nicht jeder spätere Vertrieb.'
  wdt:P973: 'Eine URL zu einer beschreibenden Seite über dieses Anime-Werk; kein automatischer Identitätsnachweis.'

  schema:associatedMedia: 'Eine Katalogdatei, die dieser identifizierten Anime-Veröffentlichung zugeordnet ist; die Verknüpfung macht die Datei nicht zur Veröffentlichung.'
  schema:encodesCreativeWork: 'Die Episode, die diese genaue Katalogdatei enthält; die Beziehung belegt weder Besitz noch einen Gesehen-Status.'
