typeDescriptions:
  rezics:AnimeRelease: 'Une publication ou version distribuée de contenu d’anime identifiée indépendamment. Distincte de l’œuvre, de l’épisode, du fichier et de l’exemplaire personnel ; langues et formats ne créent pas seuls de nouvelles éditions.'
  schema:Episode: 'Un volet d’anime identifié séparément, comme l’épisode 3 ou un spécial ; ni fichier de lecture ni saison entière.'
  schema:Movie: 'Un long ou court métrage d’animation en tant qu’œuvre, indépendamment de ses éditions distribuées.'
  schema:TVSeason: 'Une saison identifiée séparément d’une série télévisée d’animation, distincte de la série entière et d’un épisode.'
  schema:TVSeries: 'Une série télévisée d’animation en tant qu’œuvre regroupant saisons et épisodes, distincte d’une édition donnée.'
