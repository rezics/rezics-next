propertyDescriptions:
  bf:hasPart: 'Une œuvre d’anime identifiée et incluse dans cette anthologie ; relier la série, le film, la saison ou l’épisode réel.'
  marcrel:fds: 'Une personne ou organisation créditée pour la distribution de cette publication audiovisuelle ; ne pas y recopier les crédits étrangers de l’œuvre.'
  schema:copyrightNotice: 'La mention de droit d’auteur donnée par la source ; elle n’établit aucune licence de réutilisation.'
  schema:duration: 'Durée indiquée en quantité entière non négative de secondes (wd:Q11574), par exemple 1440 pour 24 minutes.'
  schema:endDate: 'La fin de la période originale de diffusion ou de publication, avec la précision de la source.'
  schema:episodeNumber: 'Le numéro d’épisode de la source en texte, y compris 0, les spéciaux ou les fractions ; distinct de son identifiant.'
  schema:isPartOf: 'La série télévisée ou saison contenant cet épisode.'
  schema:numberOfEpisodes: 'Nombre d’épisodes de cette œuvre ou saison, en quantité entière non négative sans unité.'
  schema:startDate: 'Le début de la période originale de diffusion ou de publication, avec la précision de la source.'
  wdt:P449: 'L’organisation identifiée par la source comme diffuseur original, pas tout distributeur ultérieur.'
  wdt:P973: 'L’URL d’une page décrivant cette œuvre d’anime ; ce lien descriptif n’est pas une identité exacte.'
