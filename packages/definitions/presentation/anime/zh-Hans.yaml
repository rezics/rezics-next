typeDescriptions:
  rezics:AnimeRelease: '独立标识的动画出版或发行版本，与作品本身分开。也与单集、播放文件和个人副本区分，不因语言或格式不同就自动创建多个发行版。'
  schema:Episode: '可独立识别的一集动画或其他单篇，如第 3 集或特别篇；不是播放文件，也不是整季。'
  schema:Movie: '作为作品的动画长片或短片，独立于各个出版发行版本。'
  schema:TVSeason: '电视动画中可单独识别的一季，与整个系列和单集分开。'
  schema:TVSeries: '包含各季和各集的电视动画作品系列，与某一具体发行版分开。'
  schema:MediaObject: '独立标识的目录文件。其元数据不证明拥有文件、下载权限、可播放状态或观看进度。'
