propertyDescriptions:
  bf:hasPart: '此合集发行版收录的独立动画作品，链接实际的系列、电影、季或单集。'
  marcrel:fds: '被署名为此影像出版物发行者的个人或组织，不照搬作品上无关的署名。'
  schema:copyrightNotice: '来源记载的版权声明，本身不构成再利用许可。'
  schema:duration: '来源明确给出的片长，以秒（wd:Q11574）为单位的非负整数数量记录；例如 24 分钟写作 1440。'
  schema:endDate: '最初播出或发行期间的结束日期，保留来源精度。'
  schema:episodeNumber: '来源中的单集序号，以文本保存，可含 0、特别篇或小数编号；与单集标识分开。'
  schema:isPartOf: '此单集所属的电视系列或季。'
  schema:numberOfEpisodes: '此作品或季的集数，以无单位的非负整数数量记录。'
  schema:startDate: '最初播出或发行期间的开始日期，保留来源精度。'
  wdt:P449: '来源明确标识的首播机构，不泛指后来所有发行者。'
  wdt:P973: '介绍此动画作品的页面 URL，描述性链接不等于身份精确匹配。'

  schema:associatedMedia: '与此已标识动画出版发行版关联的目录文件；此关联不会使文件等同于发行版。'
  schema:encodesCreativeWork: '此精确目录文件所编码的单集；该关系不证明拥有文件或已观看。'
