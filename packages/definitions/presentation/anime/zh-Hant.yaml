typeDescriptions:
  rezics:AnimeRelease: '具有獨立識別身分的動畫出版或發行版本，與作品本身分開。也與單集、播放檔案及個人副本區別，不因語言或格式不同就自動建立多個發行版。'
  schema:Episode: '可獨立識別的一集動畫或其他單篇，例如第 3 集或特別篇；不是播放檔案，也不是整季。'
  schema:Movie: '作為作品的動畫長片或短片，獨立於各個出版發行版本。'
  schema:TVSeason: '電視動畫中可單獨識別的一季，與完整系列及單集分開。'
  schema:TVSeries: '包含各季與各集的電視動畫作品系列，與某個具體發行版分開。'
  schema:MediaObject: "獨立識別的目錄檔案。其詮釋資料不證明擁有檔案、下載權限、可播放狀態或觀看進度。"
