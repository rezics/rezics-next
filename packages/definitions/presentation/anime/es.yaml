typeDescriptions:
  rezics:AnimeRelease: 'Una publicación o versión distribuida de contenido de anime con identidad propia. Distinta de la obra, episodio, archivo o copia personal; los idiomas y formatos por sí solos no crean lanzamientos separados.'
  schema:Episode: 'Una entrega identificada de una obra de anime, como el episodio 3 o un especial; no un archivo ni una temporada completa.'
  schema:Movie: 'Un largometraje o cortometraje de animación como obra, independiente de sus ediciones distribuidas.'
  schema:TVSeason: 'Una temporada identificada de una serie de animación televisiva, distinta de la serie completa y del episodio.'
  schema:TVSeries: 'Una serie de animación televisiva como obra que abarca temporadas y episodios, distinta de una edición distribuida concreta.'
  schema:MediaObject: "Un archivo de catálogo identificado de forma independiente. Sus metadatos no prueban posesión, permiso de descarga, disponibilidad de reproducción ni progreso visto."
