propertyDescriptions:
  schema:gamePlatform: 'ゲームやリリースが動作する機種を示す概念。言語の修飾子で機種と言語の対応を保持できます。'
  schema:gtin: 'リリースのGTIN。区切り記号なしの8、12、13、14桁の数字で記録します。'
  wdt:P2899: 'リリースの年齢区分に対応する最低年齢。年（wd:Q577）単位の0以上の整数の数量です。'
  wdt:P31: '完全版、一部版、体験版などのリリース種別を示す概念。カタログ上の対象の型とは別です。'
  wdt:P155: 'この作品やリリースに先行する作品またはリリース。'
  rezics:releaseSupersedes: '時系列上の前後関係とは別に、このリリースが置き換える特定のソフトウェアリリース。'
  wdt:P437: '光ディスクなど、リリースの頒布形式や物理媒体を表す概念。'
  wdt:P408: 'ゲームが使用するソフトウェアエンジンを示す概念。'
  schema:numberOfPlayers: '最大プレイヤー数を単位なしの整数で記録します。範囲が明記されている場合は上限を値とし、下限は別の修飾子に保存します。'
  schema:minValue: '明記されたプレイヤー数範囲の下限。プレイヤー数を修飾する単位なしの整数で、単独の数から推測しません。'
  wdt:P8646: 'この独立した追加作品が拡張する基本ゲーム。ソフトウェアリリースが具体化する作品への関連とは別です。'
