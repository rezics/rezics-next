typeDescriptions:
  schema:VideoGame: '対応機種の集約情報を持つゲーム作品。特定のソフトウェアリリースや個人の所蔵物とは区別します。'
  wd:Q20631656: '一つ以上の作品を収録する、独立して識別されたソフトウェアリリース。機種や言語の一覧だけで別のリリースを作りません。'
  wd:Q209163: '拡張パックやDLCを含む、独立して参照できるゲームの追加作品。作品としての同一性がないパッチや配布ファイル、同梱素材は含めません。'
