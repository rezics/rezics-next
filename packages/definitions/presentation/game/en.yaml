propertyDescriptions:
  schema:gamePlatform: 'A platform Concept on which the game or release runs; a language qualifier can preserve the platform-language association.'
  schema:gtin: "The release's Global Trade Item Number as 8, 12, 13 or 14 digits without separators."
  wdt:P2899: "Minimum age associated with the release's rating, as a nonnegative whole-number quantity in years (wd:Q577)."
  wdt:P31: 'A release-type Concept, such as complete, partial or trial; not the catalogue Type of the subject.'
  wdt:P155: 'The prior work or release that this work or release follows.'
  rezics:releaseSupersedes: 'The exact software release that this release replaces; independent of chronological order.'
  wdt:P437: "A Concept identifying the release's distribution format or physical medium, such as an optical disc."
  wdt:P408: 'A Concept naming the software engine used by this game.'
  schema:numberOfPlayers: 'Maximum supported player count as a unitless whole number; for a stated range use its upper endpoint and qualify the lower endpoint separately.'
  schema:minValue: 'The lower endpoint of a stated player-count range, as a unitless whole-number qualifier on number of players; do not infer it from a lone count.'
  wdt:P8646: 'The base game expanded by this independently identified add-on work; not the work represented by a software release.'
