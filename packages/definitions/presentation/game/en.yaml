typeDescriptions:
  schema:VideoGame: 'A video game work with its aggregate platform information; distinct from a specific software release or personal copy.'
  wd:Q20631656: 'An independently identified software release representing one or more works; platform and language lists alone do not create separate releases.'
  wd:Q209163: 'An independently referable game add-on work, including expansions and DLC; a patch, download file or bundled asset without work identity is not enough.'
