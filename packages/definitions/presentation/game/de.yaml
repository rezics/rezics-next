  schema:VideoGame: 'Ein Videospiel als Werk mit zusammengefassten Plattformangaben; getrennt von einer bestimmten Softwareveröffentlichung und einem persönlichen Exemplar.'
  wd:Q20631656: 'Eine eigenständig identifizierte Softwareveröffentlichung für ein oder mehrere Werke; Plattform- und Sprachlisten allein erzeugen keine weiteren Veröffentlichungen.'
  wd:Q209163: 'Ein eigenständig benennbares Zusatzwerk zu einem Spiel, einschließlich Erweiterungen und DLC; Patch, Download oder gebündelte Datei allein begründen kein Werk.'
