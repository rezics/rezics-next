propertyDescriptions:
  schema:gamePlatform: 'Ein Plattformkonzept, auf dem Spiel oder Veröffentlichung läuft; ein Sprachqualifikator kann die Zuordnung von Plattform und Sprache bewahren.'
  schema:gtin: 'Die Global Trade Item Number der Veröffentlichung als 8, 12, 13 oder 14 Ziffern ohne Trennzeichen.'
  wdt:P2899: 'Mindestalter der Altersfreigabe als nichtnegative ganzzahlige Menge in Jahren (wd:Q577).'
  wdt:P31: 'Ein Konzept für die Veröffentlichungsart, etwa vollständig, teilweise oder Testversion; nicht der Katalogtyp des Subjekts.'
  wdt:P155: 'Das vorherige Werk oder die vorherige Veröffentlichung, auf die dieses Werk oder diese Veröffentlichung folgt.'
  rezics:releaseSupersedes: 'Die genaue Softwareveröffentlichung, die diese Veröffentlichung ersetzt; unabhängig von der zeitlichen Reihenfolge.'
  wdt:P437: 'Ein Konzept für Vertriebsform oder physischen Datenträger der Veröffentlichung, etwa eine optische Disc.'
  wdt:P408: 'Ein Konzept, das die verwendete Spiel-Engine bezeichnet.'
  schema:numberOfPlayers: 'Maximale Spielerzahl als einheitenlose ganze Zahl; bei einem angegebenen Bereich die Obergrenze verwenden und die Untergrenze separat qualifizieren.'
  schema:minValue: 'Die Untergrenze eines angegebenen Spielerzahlbereichs als einheitenloser ganzzahliger Qualifikator der Spielerzahl; aus einer Einzelzahl nicht ableiten.'
  wdt:P8646: 'Das Grundspiel, das dieses eigenständig identifizierte Zusatzwerk erweitert; keine Werkzuordnung einer Softwareveröffentlichung.'
