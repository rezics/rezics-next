propertyDescriptions:
  schema:gamePlatform: '遊戲或發行版可執行的平台概念，可用語言限定詞保留平台與語言的對應。'
  schema:gtin: '此發行版的全球貿易項目碼，使用不含分隔符號的 8、12、13 或 14 位數字。'
  wdt:P2899: '此發行版分級所對應的最低年齡，以年（wd:Q577）為單位的非負整數數量記錄。'
  wdt:P31: '完整版、部分版或試用版等發行類型概念，不是對象在目錄中的類型。'
  wdt:P155: '此作品或發行版所接續的前一部作品或前一發行版。'
  rezics:releaseSupersedes: '此發行版所取代的確切軟體發行版，與時間順序無關。'
  wdt:P437: '此發行版的散布格式或實體媒介概念，例如光碟。'
  wdt:P408: '指明遊戲所用軟體引擎的概念。'
  schema:numberOfPlayers: '支援的最多玩家數，以無單位整數記錄；來源若提供範圍，值為上限，下限另以限定詞保留。'
  schema:minValue: '來源明示的玩家數範圍下限，作為玩家數的無單位整數限定詞；不從單一數字推定。'
  wdt:P8646: '此獨立追加作品所擴充的基礎遊戲，不是軟體發行版體現的作品。'
