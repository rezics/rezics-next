typeDescriptions:
  schema:VideoGame: '彙整平台資訊的電子遊戲作品，與特定軟體發行版及個人副本分開。'
  wd:Q20631656: '體現一部或多部作品、可獨立識別的軟體發行版；平台和語言清單本身不會產生多個發行版。'
  wd:Q209163: '可獨立參照的遊戲追加作品，包括資料片和 DLC；沒有獨立作品身分的修補程式、下載檔案或附帶素材不算。'
