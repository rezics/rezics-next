typeDescriptions:
  schema:VideoGame: 'Un videojuego como obra con información conjunta de plataformas; distinto de un lanzamiento de software o una copia personal.'
  wd:Q20631656: 'Un lanzamiento de software identificado de forma independiente que representa una o varias obras; las listas de plataformas e idiomas no crean lanzamientos por sí solas.'
  wd:Q209163: 'Una obra complementaria de videojuego con identidad propia, incluidas expansiones y DLC; un parche, archivo descargado o recurso incluido no basta.'
