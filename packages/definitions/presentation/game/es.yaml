propertyDescriptions:
  schema:gamePlatform: 'Un concepto de plataforma en la que funciona el juego o lanzamiento; el calificador de idioma conserva su asociación con la plataforma.'
  schema:gtin: 'El Global Trade Item Number del lanzamiento, con 8, 12, 13 o 14 dígitos sin separadores.'
  wdt:P2899: 'Edad mínima de la clasificación del lanzamiento, como cantidad entera no negativa en años (wd:Q577).'
  wdt:P31: 'Un concepto de tipo de lanzamiento, como completo, parcial o de prueba; no el tipo de catálogo del sujeto.'
  wdt:P155: 'La obra o lanzamiento anterior al que sigue este.'
  rezics:releaseSupersedes: 'El lanzamiento de software exacto que este lanzamiento reemplaza; independiente del orden cronológico.'
  wdt:P437: 'Un concepto de formato de distribución o soporte físico del lanzamiento, como un disco óptico.'
  wdt:P408: 'Un concepto que nombra el motor de software del juego.'
  schema:numberOfPlayers: 'Máximo de jugadores como entero sin unidad; en un rango declarado se usa el extremo superior y se califica el inferior por separado.'
  schema:minValue: 'Extremo inferior del rango declarado de jugadores, como calificador entero sin unidad del número de jugadores; no se deduce de un valor aislado.'
  wdt:P8646: 'El juego base que amplía esta obra complementaria identificada; no la obra representada por un lanzamiento de software.'
