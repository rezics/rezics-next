typeDescriptions:
  schema:VideoGame: 'Un jeu vidéo en tant qu’œuvre avec ses plateformes agrégées ; distinct d’une édition logicielle donnée ou d’un exemplaire personnel.'
  wd:Q20631656: 'Une édition logicielle identifiée séparément représentant une ou plusieurs œuvres ; les listes de langues et de plateformes ne créent pas seules de nouvelles éditions.'
  wd:Q209163: 'Une œuvre additionnelle de jeu identifiable, y compris extension ou DLC ; un correctif, fichier téléchargé ou élément intégré ne suffit pas à constituer une œuvre.'
