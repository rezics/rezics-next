propertyDescriptions:
  schema:gamePlatform: 'Un concept de plateforme sur laquelle fonctionne le jeu ou l’édition ; un qualificatif de langue peut conserver l’association plateforme-langue.'
  schema:gtin: 'Le Global Trade Item Number de l’édition, avec 8, 12, 13 ou 14 chiffres sans séparateurs.'
  wdt:P2899: 'L’âge minimal associé à la classification de l’édition, en quantité entière non négative d’années (wd:Q577).'
  wdt:P31: 'Un concept de catégorie d’édition, comme complète, partielle ou d’essai ; pas le type de catalogue du sujet.'
  wdt:P155: 'L’œuvre ou l’édition précédente à laquelle celle-ci fait suite.'
  rezics:releaseSupersedes: 'L’édition logicielle exacte que cette édition remplace, indépendamment de l’ordre chronologique.'
  wdt:P437: 'Un concept précisant le format de distribution ou le support physique de l’édition, par exemple un disque optique.'
  wdt:P408: 'Un concept nommant le moteur logiciel utilisé par le jeu.'
  schema:numberOfPlayers: 'Nombre maximal de joueurs, entier sans unité ; pour un intervalle déclaré, employer la borne supérieure et qualifier séparément la borne inférieure.'
  schema:minValue: 'Borne inférieure d’un intervalle déclaré de joueurs, qualificatif entier sans unité du nombre de joueurs ; ne pas la déduire d’un nombre isolé.'
  wdt:P8646: 'Le jeu de base qu’étend cette œuvre additionnelle identifiée ; pas l’œuvre représentée par une édition logicielle.'
