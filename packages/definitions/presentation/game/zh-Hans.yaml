typeDescriptions:
  schema:VideoGame: '汇总平台信息的电子游戏作品，与具体软件发行版及个人副本分开。'
  wd:Q20631656: '体现一部或多部作品、可独立识别的软件发行版；平台和语言列表本身不会产生多个发行版。'
  wd:Q209163: '可独立引用的游戏追加作品，包括资料片和 DLC；没有独立作品身份的补丁、下载文件或附带素材不算。'
