propertyDescriptions:
  schema:gamePlatform: '游戏或发行版可运行的平台概念，可用语言限定词保留平台与语言的对应。'
  schema:gtin: '此发行版的全球贸易项目代码，使用不带分隔符的 8、12、13 或 14 位数字。'
  wdt:P2899: '此发行版分级所对应的最低年龄，以年（wd:Q577）为单位的非负整数数量记录。'
  wdt:P31: '完整版、部分版或试用版等发行类型概念，不是对象在目录中的类型。'
  wdt:P155: '此作品或发行版所接续的前一部作品或前一发行版。'
  rezics:releaseSupersedes: '此发行版所取代的确切软件发行版，与时间顺序无关。'
  wdt:P437: '此发行版的分发格式或实体媒介概念，例如光盘。'
  wdt:P408: '表明游戏所用软件引擎的概念。'
  schema:numberOfPlayers: '支持的最大玩家数，以无单位整数记录；若来源给出范围，值为上限，下限另以限定词保留。'
  schema:minValue: '来源明确给出的玩家数范围下限，作为玩家数的无单位整数限定词；不从单个数字推定。'
  wdt:P8646: '此独立追加作品所扩展的基础游戏，不是软件发行版体现的作品。'
