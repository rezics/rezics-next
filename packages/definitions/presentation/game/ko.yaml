typeDescriptions:
  schema:VideoGame: '여러 플랫폼 정보를 모아 기록하는 게임 작품입니다. 특정 소프트웨어 출시판이나 개인 소장본과 구별합니다.'
  wd:Q20631656: '하나 이상의 작품을 담은 독립적으로 식별되는 소프트웨어 출시판입니다. 플랫폼과 언어 목록만으로 새 출시판을 만들지 않습니다.'
  wd:Q209163: '확장팩과 DLC를 포함해 독립적으로 참조할 수 있는 게임의 추가 작품입니다. 작품 정체성이 없는 패치, 다운로드 파일, 동봉 자산은 해당하지 않습니다.'
