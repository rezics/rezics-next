propertyDescriptions:
  schema:gamePlatform: '게임이나 출시판이 실행되는 플랫폼 개념입니다. 언어 한정자로 플랫폼과 언어의 연결을 보존할 수 있습니다.'
  schema:gtin: '출시판의 GTIN입니다. 구분 기호 없는 8, 12, 13 또는 14자리 숫자를 사용합니다.'
  wdt:P2899: '출시판 등급에 따른 최소 연령입니다. 년(wd:Q577) 단위의 0 이상 정수 수량입니다.'
  wdt:P31: '완전판, 부분판, 체험판 같은 출시 유형 개념입니다. 대상의 목록 유형과는 다릅니다.'
  wdt:P155: '이 작품이나 출시판에 앞서는 작품 또는 출시판입니다.'
  rezics:releaseSupersedes: '연대순 관계와 별개로 이 출시판이 대체하는 특정 소프트웨어 출시판입니다.'
  wdt:P437: '광디스크처럼 출시판의 유통 형식이나 물리 매체를 나타내는 개념입니다.'
  wdt:P408: '게임이 사용한 소프트웨어 엔진을 나타내는 개념입니다.'
  schema:numberOfPlayers: '지원하는 최대 플레이어 수를 단위 없는 정수로 기록합니다. 명시된 범위는 상한을 값으로 삼고 하한을 별도로 한정합니다.'
  schema:minValue: '명시된 플레이어 수 범위의 하한입니다. 플레이어 수의 단위 없는 정수 한정자이며 단일 수치에서 추정하지 않습니다.'
  wdt:P8646: '이 독립적인 추가 작품이 확장하는 기본 게임입니다. 소프트웨어 출시판이 구현한 작품을 뜻하지 않습니다.'
