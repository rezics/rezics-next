typeDescriptions:
  skos:Concept: 'Un concepto de clasificación usado como género, etiqueta, función u otra categoría; puede representar un sujeto mediante su foco.'
  skos:ConceptScheme: 'Un esquema con nombre que organiza conceptos; el esquema y cada concepto son sujetos distintos del catálogo.'
propertyDescriptions:
  wdt:P7937: 'Un concepto de forma de la obra, como novela; distinto del género y del tipo de catálogo.'
  skos:inScheme: 'El esquema de conceptos al que pertenece este concepto.'
  skos:broader: 'Un concepto más amplio en la jerarquía, como ficción sobre ciencia ficción.'
  foaf:focus: 'El sujeto del catálogo que este concepto de clasificación representa.'
  schema:keywords: 'Un concepto de etiqueta que clasifica el sujeto; no una cadena separada por comas ni una etiqueta personal de biblioteca.'
  schema:creativeWorkStatus: 'Un concepto de estado de desarrollo o publicación de esta obra o edición; la integridad de una edición concreta respecto a la obra es un calificador de esa asociación.'
  schema:genre: 'Un concepto de género que clasifica esta obra, como ciencia ficción.'
  skos:closeMatch: 'Otro concepto de significado muy cercano; no implica equivalencia ni ampliación automática de filtros.'
  rezics:sourceTagWeight: 'Valor agregado exacto de la fuente para esta asociación. VNDB tags.rating usa la escala (0,3]; no es un voto ni una confianza de REZICS.'
  rezics:sourceTagWeightMetric: 'La métrica tipada de la fuente que define la escala y el significado del peso.'
  rezics:sourceSnapshot: 'Huella SHA-256 de la respuesta exacta y sin versión del proveedor citada.'
  rezics:sourceTagId: 'Identificador de esta etiqueta dentro del registro de VNDB citado.'
