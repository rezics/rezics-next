typeDescriptions:
  skos:Concept: 'A classification concept used for a genre, tag, role or other named category; it may point to a subject through its focus.'
  skos:ConceptScheme: 'A named scheme organizing classification concepts; a scheme and its concepts are separate catalogue subjects.'
propertyDescriptions:
  wdt:P7937: 'A Concept identifying the form of the work, such as a novel; separate from its genre and catalogue Type.'
  skos:inScheme: 'The Concept Scheme to which this concept belongs.'
  skos:broader: 'A broader Concept in the classification hierarchy, such as fiction above science fiction.'
  foaf:focus: 'The catalogue subject that this classification concept stands for.'
  schema:keywords: 'A tag Concept classifying the subject; not a comma-separated string or a personal library label.'
  schema:creativeWorkStatus: 'A Concept for this work or release development or publication status; completeness of a particular release for a work is a qualifier on the work association.'
  schema:genre: 'A genre Concept classifying this work, such as science fiction.'
  skos:closeMatch: 'A distinct Concept with a closely corresponding meaning; not equivalence and not automatic filter expansion.'
  rezics:sourceTagWeight: 'An exact provider aggregate on this association. VNDB tags.rating is in rating points on (0,3]; it is not a REZICS vote or confidence.'
  rezics:sourceTagWeightMetric: 'The typed provider metric that gives a source tag weight its scale and meaning.'
  rezics:sourceSnapshot: 'The SHA-256 digest of the exact unversioned provider response cited by this association.'
  rezics:sourceTagId: 'The provider identifier for this exact tag within its cited VNDB record.'
