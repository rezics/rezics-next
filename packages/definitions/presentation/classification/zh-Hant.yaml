typeDescriptions:
  skos:Concept: '用於題材、標籤、職務等分類的概念，也能透過焦點關係指向具體對象。'
  skos:ConceptScheme: '組織分類概念的具名體系；體系與其中每個概念各自是獨立的目錄對象。'
propertyDescriptions:
  wdt:P7937: '表明作品形式的概念，例如小說；與題材及目錄類型分開。'
  skos:inScheme: '此概念所屬的概念體系。'
  skos:broader: '分類階層中範圍較廣的上位概念，例如科幻之上的虛構作品。'
  foaf:focus: '此分類概念所代表的目錄對象。'
  schema:keywords: '用來分類此對象的標籤概念，不是以逗號分隔的字串或個人書庫標籤。'
  schema:creativeWorkStatus: '表示此作品或發行版本開發或出版狀態的概念；某一發行版本相對作品是否完整，記錄在作品關聯的限定上。'
  schema:genre: '用來分類這部作品的題材概念，例如科幻。'
  skos:closeMatch: '意義相近的另一個獨立概念，不表示等同，也不會自動擴展篩選條件。'
