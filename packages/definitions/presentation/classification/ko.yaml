typeDescriptions:
  skos:Concept: '장르, 태그, 역할 등 이름 있는 분류에 쓰이는 개념입니다. 초점 관계로 구체적인 대상을 가리킬 수도 있습니다.'
  skos:ConceptScheme: '분류 개념을 정리하는 이름 있는 체계입니다. 체계와 각 개념은 서로 다른 목록 대상입니다.'
propertyDescriptions:
  wdt:P7937: '소설처럼 작품의 형식을 나타내는 개념입니다. 장르나 목록 유형과 구별합니다.'
  skos:inScheme: '이 개념이 속하는 개념 체계입니다.'
  skos:broader: '분류 계층의 상위 개념입니다. 예를 들어 공상과학의 상위인 허구입니다.'
  foaf:focus: '이 분류 개념이 대표하는 목록 대상입니다.'
  schema:keywords: '대상을 분류하는 태그 개념입니다. 쉼표로 나열한 문자열이나 개인 서재 라벨이 아닙니다.'
  schema:creativeWorkStatus: '이 작품 또는 릴리스의 개발·공개 상태를 나타내는 개념입니다. 특정 릴리스가 작품에 대해 완전한지는 작품 연관의 한정어입니다.'
  schema:genre: '공상과학처럼 이 작품을 분류하는 장르 개념입니다.'
  skos:closeMatch: '의미가 매우 가까운 별개의 개념입니다. 동일성이나 필터의 자동 확장을 뜻하지 않습니다.'
  rezics:sourceTagWeight: '이 연결에 대한 출처의 정확한 집계값입니다. VNDB tags.rating의 척도는 (0,3]이며 REZICS 투표나 신뢰도가 아닙니다.'
  rezics:sourceTagWeightMetric: '출처 태그 가중치의 척도와 의미를 정하는 유형화된 지표입니다.'
  rezics:sourceSnapshot: '인용된 버전 없는 공급자 응답 원본의 SHA-256 다이제스트입니다.'
  rezics:sourceTagId: '인용된 VNDB 레코드에서 이 태그를 식별하는 공급자 ID입니다.'
