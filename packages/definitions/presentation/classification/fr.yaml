typeDescriptions:
  skos:Concept: 'Un concept de classification servant de genre, mot-clé, rôle ou autre catégorie nommée ; son objet central peut renvoyer à un sujet.'
  skos:ConceptScheme: 'Un schéma nommé organisant des concepts ; le schéma et chacun de ses concepts sont des sujets distincts du catalogue.'
propertyDescriptions:
  wdt:P7937: 'Un concept précisant la forme de l’œuvre, comme roman ; distinct du genre et du type de catalogue.'
  skos:inScheme: 'Le schéma de concepts auquel appartient ce concept.'
  skos:broader: 'Un concept plus général dans la hiérarchie, par exemple fiction au-dessus de science-fiction.'
  foaf:focus: 'Le sujet du catalogue que représente ce concept de classification.'
  schema:keywords: 'Un concept de mot-clé classant le sujet ; ni texte séparé par des virgules ni étiquette personnelle de bibliothèque.'
  schema:creativeWorkStatus: 'Un concept de statut de développement ou de publication de cette œuvre ou de cette parution ; l’intégralité d’une parution pour une œuvre est un qualificatif de cette association.'
  schema:genre: 'Un concept de genre classant cette œuvre, comme science-fiction.'
  skos:closeMatch: 'Un autre concept au sens très proche ; ni équivalence ni élargissement automatique des filtres.'
  rezics:sourceTagWeight: 'Valeur agrégée exacte de la source pour cette association. VNDB tags.rating utilise l’échelle (0,3] ; ce n’est ni un vote ni une confiance REZICS.'
  rezics:sourceTagWeightMetric: 'La métrique typée de la source qui définit l’échelle et le sens du poids.'
  rezics:sourceSnapshot: 'Empreinte SHA-256 de la réponse exacte et non versionnée du fournisseur citée ici.'
  rezics:sourceTagId: 'Identifiant de ce tag précis dans la fiche VNDB citée.'
