typeDescriptions:
  skos:Concept: 'Ein Klassifikationskonzept für Genre, Schlagwort, Rolle oder andere benannte Kategorien; sein Fokus kann auf ein Subjekt verweisen.'
  skos:ConceptScheme: 'Ein benanntes System zur Ordnung von Klassifikationskonzepten; System und Konzepte sind getrennte Katalogsubjekte.'
propertyDescriptions:
  wdt:P7937: 'Ein Konzept für die Werkform, etwa Roman; getrennt von Genre und Katalogtyp.'
  skos:inScheme: 'Das Begriffssystem, zu dem dieses Konzept gehört.'
  skos:broader: 'Ein übergeordnetes Konzept in der Hierarchie, etwa Fiktion über Science-Fiction.'
  foaf:focus: 'Das Katalogsubjekt, für das dieses Klassifikationskonzept steht.'
  schema:keywords: 'Ein Schlagwortkonzept zur Klassifikation des Subjekts; keine kommagetrennte Zeichenfolge und kein persönliches Bibliotheksetikett.'
  schema:creativeWorkStatus: 'Ein Konzept für Entwicklungs- oder Veröffentlichungsstatus dieses Werks oder dieser Veröffentlichung; Vollständigkeit einer Veröffentlichung für ein Werk steht an der Werkzuordnung.'
  schema:genre: 'Ein Genrekonzept für dieses Werk, etwa Science-Fiction.'
  skos:closeMatch: 'Ein anderes Konzept mit eng entsprechender Bedeutung; weder Gleichsetzung noch automatische Filtererweiterung.'
  rezics:sourceTagWeight: 'Exakter aggregierter Quellenwert dieser Zuordnung. VNDB tags.rating liegt auf der Skala (0,3] und ist weder REZICS-Stimme noch Konfidenz.'
  rezics:sourceTagWeightMetric: 'Die typisierte Quellenkennzahl, die Skala und Bedeutung eines Quellengewichts festlegt.'
  rezics:sourceSnapshot: 'SHA-256-Prüfsumme der exakten, nicht versionierten, zitierten Anbieterantwort.'
  rezics:sourceTagId: 'Anbieterkennung dieses Schlagworts im zitierten VNDB-Datensatz.'
