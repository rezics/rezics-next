typeDescriptions:
  skos:Concept: 'ジャンル、タグ、役割などの分類に使う概念。焦点の関連を通じて具体的な対象を表すこともできます。'
  skos:ConceptScheme: '分類概念をまとめる名前付きの体系。体系と各概念は別々のカタログ対象です。'
propertyDescriptions:
  wdt:P7937: '小説など、作品の形式を示す概念。ジャンルやカタログの型とは区別します。'
  skos:inScheme: 'この概念が属する概念体系。'
  skos:broader: '分類階層の上位概念。例えばSFに対するフィクションです。'
  foaf:focus: 'この分類概念が表しているカタログ上の対象。'
  schema:keywords: '対象を分類するタグの概念。カンマ区切りの文字列や個人のライブラリラベルではありません。'
  schema:creativeWorkStatus: 'この作品またはリリースの開発・公開状態を表す概念。あるリリースが作品に対して完全かどうかは作品関連の修飾語です。'
  schema:genre: 'SFなど、この作品を分類するジャンルの概念。'
  skos:closeMatch: '意味が近い別の概念。同一性や検索フィルターの自動展開を表すものではありません。'
  rezics:sourceTagWeight: 'この関連に付された出典の正確な集計値。VNDB tags.rating の尺度は (0,3] です。REZICS の投票や確信度ではありません。'
  rezics:sourceTagWeightMetric: '出典タグ重みの尺度と意味を定める型付き指標。'
  rezics:sourceSnapshot: '引用した未版管理プロバイダー応答そのものの SHA-256 ダイジェスト。'
  rezics:sourceTagId: '引用した VNDB レコードにあるこのタグのプロバイダー識別子。'
