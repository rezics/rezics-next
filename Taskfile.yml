# Rezics command facade. Every developer and agent command runs through Task;
# Yarn only installs dependencies and manages workspaces. Pass extra arguments
# after `--`, for example `task qa -- --backend --record`.
version: '3'

set: [pipefail]

env:
  ASPIRE_CLI_TELEMETRY_OPTOUT: '1'

vars:
  ASPIRE: node {{.ROOT_DIR}}/node_modules/@microsoft/aspire-cli/bin/aspire.js

tasks:
  statement:convert:
    desc: Convert retained classifications and rebuild Statement seek coverage on a fenced populated stack.
    cmds:
      - bun scripts/statement/convert.ts {{.CLI_ARGS}}

  default:
    desc: List the available commands.
    silent: true
    cmds:
      - task --list

  # Setup

  install:
    desc: Install the pinned workspace dependencies from the lockfile.
    cmds:
      - corepack yarn install --immutable

  toolchain:install:
    desc: From a clean clone, install dependencies, check runtimes, pull images, build Fuseki and install Chromium.
    cmds:
      - corepack yarn install --immutable
      - bun scripts/dev/cli.ts toolchain:install

  # Local development

  dev:
    desc: 'Start the dev environment under Aspire. Main checkout: shared backend and frontend on ports 3002 (Account), 3001 (Main), 3004 (Accounts app), 3000 (web), 6006 (Storybook). Worktree: Accounts app, web and Storybook on random ports against it, or -- --backend for its own isolated stack.'
    deps: [aspire:restore]
    cmds:
      - bun scripts/dev/cli.ts dev {{.CLI_ARGS}}

  dev:stop:
    desc: Stop this checkout's AppHost; a worktree backend also removes its isolated stack.
    cmds:
      - bun scripts/dev/cli.ts dev:stop {{.CLI_ARGS}}

  dev:reset:
    desc: Print and, with -- --yes, recreate only this checkout's dev stack data.
    deps: [aspire:restore]
    cmds:
      - bun scripts/dev/cli.ts dev:reset {{.CLI_ARGS}}

  urls:
    desc: Show this checkout's running resources with their URLs and health.
    cmds:
      - bun scripts/dev/cli.ts dev:urls

  env:
    desc: Show the application environment this checkout uses, secrets masked, and where it comes from.
    cmds:
      - bun scripts/dev/cli.ts dev:env {{.CLI_ARGS}}

  env:example:
    desc: Regenerate each workspace's .env.example from its envalid config specs.
    cmds:
      - bun scripts/dev/env-example.ts

  zones:digest:
    desc: Compute the digest of an installed official Zone source package.
    cmds:
      - bun scripts/zones/digest.ts {{.CLI_ARGS}}

  dev:prepare:
    desc: Start storage, apply migrations and write the application environment without starting processes.
    cmds:
      - bun scripts/dev/cli.ts dev:prepare {{.CLI_ARGS}}

  dev:refresh:
    desc: Bring the shared dev stack to committed main, preserving data; use -- --dry-run to inspect the plan, -- --wait to queue for heavy QA.
    cmds:
      - bun scripts/dev/cli.ts dev:refresh {{.CLI_ARGS}}

  dev:seed:
    desc: Seed this checkout's local demo through its public APIs.
    cmds:
      - bun scripts/dev/seed/cli.ts {{.CLI_ARGS}}

  # *:typecheck --gib values are measured tsc resident peaks plus 0.25 GiB, rounded up to 0.5 GiB.
  dev:typecheck:
    desc: Type-check the development scripts.
    cmds:
      - bun scripts/qa/host-admission.ts --gib 2.5 -- bun node_modules/typescript/bin/tsc --project scripts/dev/tsconfig.json

  apphost:typecheck:
    desc: Type-check the AppHost and its configuration imports with Node types.
    deps: [aspire:restore]
    cmds:
      - bun scripts/qa/host-admission.ts --gib 0.5 -- bun node_modules/typescript/bin/tsc --project apphost/tsconfig.apphost.json

  aspire:
    desc: Run the pinned Aspire CLI against the dev AppHost (describe, logs, wait, agent mcp, ...).
    cmds:
      - '{{.ASPIRE}} {{.CLI_ARGS}}'

  aspire:restore:
    desc: Generate the TypeScript AppHost SDK for the pinned Aspire version.
    sources: [aspire.config.json]
    generates: [apphost/.aspire/modules/aspire.mts]
    cmds:
      - '{{.ASPIRE}} restore --non-interactive --nologo'

  stack:up:
    desc: Start the Compose storage stack and print its endpoints.
    cmds:
      - bun scripts/dev/cli.ts stack:up {{.CLI_ARGS}}

  stack:down:
    desc: Stop the Compose storage stack and keep its data.
    cmds:
      - bun scripts/dev/cli.ts stack:down {{.CLI_ARGS}}

  stack:reset:
    desc: Stop the Compose storage stack and remove its volumes.
    cmds:
      - bun scripts/dev/cli.ts stack:reset {{.CLI_ARGS}}

  stack:logs:
    desc: Print recent Compose service logs.
    cmds:
      - bun scripts/dev/cli.ts stack:logs {{.CLI_ARGS}}

  stack:status:
    desc: Show Compose service status.
    cmds:
      - bun scripts/dev/cli.ts stack:status {{.CLI_ARGS}}

  stack:backup:
    desc: OPS03 fixture only; take a physical PostgreSQL backup of a disposable owner-cut QA stack.
    cmds:
      - bun scripts/dev/cli.ts stack:backup {{.CLI_ARGS}}

  stack:clone:
    desc: Copy a stopped persistent load stack into a new isolated QA project.
    cmds:
      - bun scripts/dev/cli.ts stack:clone {{.CLI_ARGS}}

  # Web

  web:dev:
    desc: Run vinext alone, without Aspire, against the shared backend (defaults in apps/web/.env.example; pass -- --port <n>).
    dir: apps/web
    cmds:
      - ../../node_modules/.bin/vinext dev --host 127.0.0.1 {{.CLI_ARGS}}

  web:build:
    desc: Build the vinext Workers application.
    dir: apps/web
    cmds:
      - ../../node_modules/.bin/vinext build {{.CLI_ARGS}}

  web:preview:
    desc: Build the web Worker for a running QA stack and serve it with wrangler on port 3003.
    cmds:
      - bun scripts/dev/web-preview.ts {{.CLI_ARGS}}

  web:e2e:
    desc: Run Playwright journeys against the running web preview.
    cmds:
      - node_modules/.bin/playwright test --config apps/web/playwright.config.ts {{.CLI_ARGS}}

  web:typecheck:
    desc: Type-check the web workspace.
    dir: apps/web
    cmds:
      - bun ../../scripts/qa/host-admission.ts --gib 7 -- ../../node_modules/.bin/tsc --noEmit -p tsconfig.json

  storybook:
    desc: Run Storybook on port 6006 with its MCP endpoint at /mcp.
    dir: apps/web
    cmds:
      - ../../node_modules/.bin/storybook dev -p 6006 --host 127.0.0.1 --no-open {{.CLI_ARGS}}

  storybook:build:
    desc: Build static Storybook into .temp/storybook/static.
    dir: apps/web
    cmds:
      - ../../node_modules/.bin/storybook build --output-dir ../../.temp/storybook/static

  storybook:test:
    desc: Run Storybook stories as Vitest browser tests with accessibility checks.
    dir: apps/web
    cmds:
      # A Goal worker's run takes a QA slot and the heavy lock with two story workers: unbounded parallel
      # browser runs exhausted the host, and two browser suites at once left 5 GiB on 2026-10-07.
      - |
        if [ -n "${GOAL_TASK_ID:-}" ] && [ -z "${GOAL_IN_SLOT:-}" ]; then
          export STORYBOOK_MAX_WORKERS="${STORYBOOK_MAX_WORKERS-2}"
          exec bun ../../scripts/goal/goalctl.ts slot --heavy -- ../../node_modules/.bin/vitest run --project storybook {{.CLI_ARGS}}
        fi
        exec ../../node_modules/.bin/vitest run --project storybook {{.CLI_ARGS}}

  # Accounts site (apps/accounts): the public Account origin

  accounts:dev:
    desc: Run the Accounts app alone with vinext, without Aspire, against the shared Account service (defaults in apps/accounts/.env.example; pass -- --port <n>).
    dir: apps/accounts
    cmds:
      - ../../node_modules/.bin/vinext dev --hostname 127.0.0.1 {{.CLI_ARGS}}

  accounts:build:
    desc: Build the Accounts vinext Workers application.
    dir: apps/accounts
    cmds:
      - ../../node_modules/.bin/vinext build {{.CLI_ARGS}}

  accounts:typecheck:
    desc: Type-check the Accounts workspace.
    dir: apps/accounts
    cmds:
      - bun ../../scripts/qa/host-admission.ts --gib 2 -- ../../node_modules/.bin/tsc --noEmit -p tsconfig.json

  accounts:storybook:
    desc: Run the Accounts Storybook on port 6007.
    dir: apps/accounts
    cmds:
      - ../../node_modules/.bin/storybook dev -p 6007 --host 127.0.0.1 --no-open {{.CLI_ARGS}}

  accounts:storybook:test:
    desc: Run the Accounts stories as Vitest browser tests with accessibility checks.
    dir: apps/accounts
    cmds:
      # Same host guard as storybook:test.
      - |
        if [ -n "${GOAL_TASK_ID:-}" ] && [ -z "${GOAL_IN_SLOT:-}" ]; then
          export STORYBOOK_MAX_WORKERS="${STORYBOOK_MAX_WORKERS-2}"
          exec bun ../../scripts/goal/goalctl.ts slot --heavy -- ../../node_modules/.bin/vitest run --project storybook {{.CLI_ARGS}}
        fi
        exec ../../node_modules/.bin/vitest run --project storybook {{.CLI_ARGS}}

  accounts:e2e:
    desc: Run the Accounts Playwright journeys against a running Accounts app (ACCOUNTS_URL, default http://127.0.0.1:3004).
    cmds:
      - node_modules/.bin/playwright test --config apps/accounts/playwright.config.ts {{.CLI_ARGS}}

  # About site (apps/about): the public product site, static pages plus a small Worker

  about:dev:
    desc: Run the about site with Astro on 127.0.0.1:4321 (pass -- --port <n>), with a local D1 for the notify form.
    dir: apps/about
    cmds:
      - ../../node_modules/.bin/wrangler d1 migrations apply DB --local
      - ../../node_modules/.bin/astro dev {{.CLI_ARGS}}

  about:build:
    desc: Build the about site into apps/about/dist, the assets directory of its Worker.
    dir: apps/about
    cmds:
      - ../../node_modules/.bin/astro build {{.CLI_ARGS}}
      - if [ "$CLOUDFLARE_ENV" = production ]; then ../../node_modules/.bin/wrangler deploy --dry-run --env production --outdir ../../.temp/worker-builds/about; fi

  about:check:
    desc: Check the about site's types (Astro, TypeScript), lint, format and unit tests.
    dir: apps/about
    cmds:
      - node astro-check.cjs
      - ../../node_modules/.bin/oxlint --type-aware .
      - ../../node_modules/.bin/oxfmt --check .
      - bun test tests

  about:e2e:
    desc: Build the about site, serve it with its Worker and a local D1 on 127.0.0.1:4322, and run the Playwright smoke and axe tests.
    deps: [about:build]
    cmds:
      - node_modules/.bin/playwright test --config apps/about/playwright.config.ts {{.CLI_ARGS}}

  ui:typecheck:
    desc: Type-check Rezics UI.
    dir: packages/ui
    cmds:
      - bun ../../scripts/qa/host-admission.ts --gib 1.5 -- ../../node_modules/.bin/tsc --noEmit -p tsconfig.json

  document:typecheck:
    desc: Type-check the independent document protocol.
    dir: packages/document
    cmds:
      - bun ../../scripts/qa/host-admission.ts --gib 0.5 -- ../../node_modules/.bin/tsc --noEmit -p tsconfig.json

  document:gen:
    desc: Generate the standalone Document Core, Text and Blocks JSON Schemas.
    cmds:
      - bun packages/document/scripts/schema.ts

  # Goal

  goal:
    desc: Run goalctl from the repository root. Sets GOAL_MAX_WORKERS to the program's live-worker cap and STORYBOOK_MAX_WORKERS to 2 when they are unset.
    dir: '{{.ROOT_DIR}}'
    silent: true
    cmds:
      # Six story workers (about 1.3 GiB of Chromium each) beside eleven agents and the 24 GiB Docker VM left 3 GiB on 2026-10-07.
      - 'GOAL_MAX_WORKERS="${GOAL_MAX_WORKERS-24}" STORYBOOK_MAX_WORKERS="${STORYBOOK_MAX_WORKERS-2}" bun scripts/goal/goalctl.ts {{.CLI_ARGS}}'

  # The merge gate combines cheap unit files with owner inventory guards; the
  # public test selector deliberately refuses a mix of QA tiers.
  goal:unit-files:
    desc: Run the explicit Bun unit and inventory files selected by the merge gate.
    cmds:
      - bun test {{.CLI_ARGS}}

  # Checks and tests

  observability:typecheck:
    desc: Type-check the shared telemetry runtime and probes.
    cmds:
      - bun scripts/qa/host-admission.ts --gib 0.5 -- bun node_modules/typescript/bin/tsc --project packages/observability/tsconfig.json
      - bun scripts/qa/host-admission.ts --gib 0.5 -- bun node_modules/typescript/bin/tsc --project scripts/observability/tsconfig.json

  observability:aspire-smoke:
    desc: Verify real server spans, structured logs and OTLP authentication against the running backend AppHost.
    cmds:
      - bun scripts/observability/aspire-smoke.ts

  observability:check:
    desc: Validate the pinned observability Compose and Collector configurations with disposable local secrets.
    cmds:
      - bun scripts/observability/cli.ts check

  observability:smoke:
    desc: Exercise OTLP ingestion and Perses provisioning on an isolated disposable local observability stack.
    cmds:
      - bun scripts/observability/cli.ts smoke

  check:
    desc: Run every static gate (types, generated contracts, docs, lint, format, code shape, catalogs, unused files, imports).
    cmds:
      - bun scripts/research/storage_architecture/check.ts {{.CLI_ARGS}}

  check:backend:
    desc: Run the static gates without UI and web sources.
    cmds:
      - bun scripts/research/storage_architecture/check.ts --backend {{.CLI_ARGS}}

  check:unused:
    desc: Report unused files, dependencies and exports with Knip.
    cmds:
      - bun scripts/static/knip.ts {{.CLI_ARGS}}

  ast-grep:
    desc: Run the pinned ast-grep binary (scan or test) with sgconfig.yml.
    cmds:
      - node_modules/.bin/ast-grep {{.CLI_ARGS}}

  docs:check:
    desc: Check documentation links, fragments and navigation.
    cmds:
      - bun scripts/research/storage_architecture/docs-check.ts {{.CLI_ARGS}}

  i18n:check:
    desc: Fail when a web, Accounts, official Zone or UI catalog has a missing, extra, empty or placeholder-mismatched key.
    cmds:
      - bun scripts/i18n/check.ts

  test:
    desc: Run explicit test files or the affected plan (-- --affected [<base>] [--list]).
    cmds:
      - bun scripts/qa/test.ts {{.CLI_ARGS}}

  qa:
    desc: Run the QA harness tiers (-- --backend, --tier, --record, ...).
    cmds:
      - bun scripts/qa/cli.ts {{.CLI_ARGS}}

  qa:replay:
    desc: Replay one property or model test with a logged seed.
    cmds:
      - bun scripts/qa/replay.ts {{.CLI_ARGS}}

  api:fuzz:
    desc: Run Schemathesis against Main's generated OpenAPI contract on an isolated stack.
    cmds:
      - bun scripts/qa/api-fuzz.ts {{.CLI_ARGS}}

  gen:
    desc: Regenerate model, OpenAPI and pinned-image artifacts and the toolchain inventory.
    cmds:
      - bun scripts/generate.ts
      - python3 scripts/documentation/toolchain_inventory.py --write

  gen:check:
    desc: Fail if generated artifacts are stale.
    cmds:
      - bun scripts/generate.ts --check

  toolchain:inventory:
    desc: Regenerate the toolchain inventory from manifests and root commands.
    cmds:
      - python3 scripts/documentation/toolchain_inventory.py --write

  # Data, load and operations

  dataset:fetch:
    desc: Explicitly capture complete real-world series into the external local dataset store.
    cmds:
      - bun scripts/datasets/cli.ts fetch {{.CLI_ARGS}}

  dataset:verify:
    desc: Verify an external dataset snapshot and all referenced local bytes without network access.
    cmds:
      - bun scripts/datasets/cli.ts verify {{.CLI_ARGS}}

  dataset:import:
    desc: Import a captured dataset through existing public APIs and write the Markdown URL index.
    cmds:
      - bun scripts/datasets/cli.ts import {{.CLI_ARGS}}

  dataset:bootstrap-admin:
    desc: Create and authorize the dedicated local dataset administrator without resetting existing data.
    cmds:
      - bun scripts/datasets/bootstrap-cli.ts {{.CLI_ARGS}}

  dataset:bootstrap-model:
    desc: Align the local fixture model generation with the current build while preserving all prior data and revisions.
    cmds:
      - bun scripts/datasets/model-bootstrap.ts {{.CLI_ARGS}}

  dataset:test:
    desc: Run the opt-in offline real-dataset conformance suite.
    cmds:
      - bun scripts/datasets/cli.ts test {{.CLI_ARGS}}

  dataset:typecheck:
    desc: Type-check the independent local dataset tools.
    cmds:
      - bun scripts/qa/host-admission.ts --gib 2 -- node_modules/.bin/tsc --noEmit -p scripts/datasets/tsconfig.json

  dataset:check:
    desc: Check the dataset tools types, lint and formatting without capturing or importing data.
    cmds:
      - task: dataset:typecheck
      - node_modules/.bin/oxlint --format=unix scripts/datasets tests/qa/unit/dataset-*.test.ts
      - node_modules/.bin/oxfmt --check scripts/datasets tests/qa/unit/dataset-*.test.ts

  dataset:format:
    desc: Format the local dataset tools and their unit tests.
    cmds:
      - node_modules/.bin/oxfmt scripts/datasets tests/qa/unit/dataset-*.test.ts

  fixture:build:
    desc: Build a deterministic background corpus into owner storage.
    cmds:
      - bun scripts/fixture/cli.ts build {{.CLI_ARGS}}

  fixture:restore:
    desc: Restore a fixture backup into a new persistent QA stack.
    cmds:
      - bun scripts/fixture/cli.ts restore {{.CLI_ARGS}}

  fixtures:pull:
    desc: Replay verified factual fixtures from the cache or committed seed.
    cmds:
      - bun scripts/fixtures/pull.ts {{.CLI_ARGS}}

  load:
    desc: Run the mixed host load profile.
    cmds:
      - bun scripts/load/cli.ts {{.CLI_ARGS}}

  load:prepare:
    desc: Build a reusable command-created load baseline.
    cmds:
      - bun scripts/load/cli.ts --prepare {{.CLI_ARGS}}

  load:clone-probe:
    desc: Probe a cloned load stack for isolation and fresh commands.
    cmds:
      - bun scripts/load/clone-probe.ts {{.CLI_ARGS}}

  release:build:
    desc: Package a content-addressed local release artifact.
    cmds:
      - bun scripts/dev/release-artifact.ts build {{.CLI_ARGS}}

  release:images:
    desc: Build local pinned OCI runtime images and record their release manifest; never push.
    cmds:
      - bun scripts/ops/release-images.ts {{.CLI_ARGS}}

  ops:migrate:
    desc: Apply the release's locked, idempotent owner migrations.
    cmds:
      - bun scripts/ops/migrate.ts {{.CLI_ARGS}}

  ops:env-check:
    desc: Validate production configuration, refuse payment provider rows and state the governance opening gate.
    cmds:
      - bun scripts/ops/production-env.ts {{.CLI_ARGS}}

  ops:postgres-preflight:
    desc: Verify production owner diagnostic grants and disabled prepared transactions without writes.
    cmds:
      - bun scripts/ops/postgres-preflight.ts {{.CLI_ARGS}}

  ops:mail-check:
    desc: Read bounded SPF, DKIM and DMARC DNS evidence without sending mail.
    cmds:
      - bun scripts/ops/mail-check.ts {{.CLI_ARGS}}

  ops:platform-governance:
    desc: Refuse production opening without an active permanent platform grant holder; warn until two hold it.
    cmds:
      - bun scripts/ops/platform-governance.ts {{.CLI_ARGS}}

  ops:bootstrap:
    desc: Provision launch Realms, Zones and vocabulary, then admit bounded catalogue records through public APIs.
    cmds:
      - bun scripts/ops/bootstrap/index.ts {{.CLI_ARGS}}

  release:install:
    desc: Verify a release artifact and provision a project from it.
    cmds:
      - bun scripts/dev/release-artifact.ts install {{.CLI_ARGS}}

  search:rebuild:
    desc: Rebuild the public search index on a stopped-writer stack.
    cmds:
      - bun scripts/operations/rebuild-content-search.ts {{.CLI_ARGS}}

  search:names:backfill:
    desc: Resume public names, browse directories and rating counters online.
    cmds:
      - bun scripts/operations/backfill-public-names.ts {{.CLI_ARGS}}

  access:pending-search:
    desc: List unresolved private search deliveries (needs ACCESS_DATABASE_URL).
    cmds:
      - bun services/main/src/private-search-pending.ts {{.CLI_ARGS}}

  rating:reconstruct:
    desc: Resume bounded legacy target-rating reconstruction with a local checkpoint.
    cmds:
      - bun services/main/src/rating-reconstruction.ts {{.CLI_ARGS}}

  research:architecture:
    desc: Run the storage architecture research lab.
    cmds:
      - bun scripts/research/storage_architecture/lab.ts {{.CLI_ARGS}}

  # Package oracles

  package:go-oracle:
    desc: Compare Go module resolution with the pinned native Go.
    cmds:
      - bun scripts/package/go-oracle.ts {{.CLI_ARGS}}

  package:go-probe:
    desc: Run the Go provider probe.
    cmds:
      - bun scripts/package/go-probe.ts {{.CLI_ARGS}}

  package:go-checksum-oracle:
    desc: Compare Go checksum provenance with the pinned native Go.
    cmds:
      - bun scripts/package/go-checksum-oracle.ts {{.CLI_ARGS}}

  package:cargo-oracle:
    desc: Compare Cargo resolution with the pinned native Cargo.
    cmds:
      - bun scripts/package/cargo-oracle.ts {{.CLI_ARGS}}

  package:npm-oracle:
    desc: Compare npm lockfile topology with the pinned native npm.
    cmds:
      - bun scripts/package/npm-oracle.ts {{.CLI_ARGS}}

  # Services

  account:dev:
    desc: Run Account in watch mode.
    cmds:
      - bun --preload ./services/account/src/telemetry.ts --watch services/account/src/index.ts

  account:test:
    desc: Run Account unit tests.
    cmds:
      - bun test services/account/tests {{.CLI_ARGS}}

  account:typecheck:
    desc: Type-check Account.
    dir: services/account
    cmds:
      - bun ../../scripts/qa/host-admission.ts --gib 2.5 -- ../../node_modules/.bin/tsc --noEmit

  account:mail-report:
    desc: Report uncertain Account mail and optional-mail suppression counts; never resend.
    cmds:
      - bun scripts/operations/account-mail-report.ts

  content:typecheck:
    desc: Type-check Content.
    dir: services/content
    cmds:
      - bun ../../scripts/qa/host-admission.ts --gib 2 -- ../../node_modules/.bin/tsc --noEmit

  content:test:
    desc: Run Content unit tests.
    dir: services/content
    cmds:
      - bun test {{.CLI_ARGS}}

  main:dev:
    desc: Run Main in watch mode.
    cmds:
      - bun --preload ./services/main/src/telemetry.ts --watch services/main/src/index.ts

  main:relay:
    desc: Run the Main relay.
    cmds:
      - bun --preload ./services/main/src/relay-telemetry.ts services/main/src/relay.ts {{.CLI_ARGS}}

  main:relay:init:
    desc: Initialize the Main relay.
    cmds:
      - bun services/main/src/relay-init.ts {{.CLI_ARGS}}

  main:typecheck:
    desc: Type-check Main.
    dir: services/main
    cmds:
      - bun ../../scripts/qa/host-admission.ts --gib 4.5 -- ../../node_modules/.bin/tsc --noEmit

  main:test:
    desc: Run Main unit tests.
    cmds:
      - bun test services/main/tests {{.CLI_ARGS}}

  model:typecheck:
    desc: Type-check the model package.
    dir: packages/model
    cmds:
      - bun ../../scripts/qa/host-admission.ts --gib 1 -- ../../node_modules/.bin/tsc --noEmit

  model:test:
    desc: Run model package tests.
    dir: packages/model
    cmds:
      - bun test {{.CLI_ARGS}}

  ops:backup:
    desc: Fence a persistent stack and encrypt one signed recovery set to an off-host recipient.
    cmds:
      - bun scripts/ops/backup.ts {{.CLI_ARGS}}

  ops:restore:
    desc: Verify and restore a signed recovery set into new isolated volumes; hold until checks pass.
    cmds:
      - bun scripts/ops/restore.ts {{.CLI_ARGS}}

  ops:compact:
    desc: Compact stopped TDB2 with a retained recovery window, or explicitly rollback/retire it.
    cmds:
      - bun scripts/ops/compact-tdb2.ts {{.CLI_ARGS}}
