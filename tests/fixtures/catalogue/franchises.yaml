# Catalogue acceptance fixture specification (2026-09-30, research R55).
# Facts only: titles, dates, volume labels, roles and relations; their sources are
# listed in docs/contracts/work-and-release.md#catalogue-acceptance-fixtures. Model
# assignments (Work, Main Version, Release, relation kinds) follow
# docs/contracts/work-and-release.md#work-levels-realizations-and-versions.
# M6 turns this specification into executable fixtures and the acceptance
# queries listed in that contract; expand_* lists name Works still to be added.
schema:
  work: [id, title, mainVersion]
  release: [id, sourceContent, language, format, publicationDate]
  relation: [subject, predicate, object, evidence]
  each_admitted_work: exactly_one_mainVersion
  relation_direction: derivative_to_source
  unresolved_source_revision: null

