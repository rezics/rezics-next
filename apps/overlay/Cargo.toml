[package]
name = "rezics-overlay"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
tao = { version = "0.37.3", default-features = false, features = ["rwh_06"] }
webview2-com = "0.39.1"
wry = { version = "0.57.3", default-features = false }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
