# QA caps apply to both persistent restores and disposable stacks.
services:
  postgres:
    # Ordinary integration: 426 MiB; large tmpfs: 628 MiB (2026-10-07 docker stats).
    mem_limit: ${REZICS_POSTGRES_MEMORY_LIMIT:-2g}
  fuseki:
    mem_limit: ${REZICS_FUSEKI_MEMORY_LIMIT:-2g}
  rustfs:
    # Ordinary integration: 379 MiB; large tmpfs: 371 MiB (2026-10-07 docker stats).
    mem_limit: ${REZICS_RUSTFS_MEMORY_LIMIT:-1g}
  toxiproxy:
    # Live QA proxy peaked at 5.3 MiB (2026-10-07 docker stats).
    mem_limit: ${REZICS_TOXIPROXY_MEMORY_LIMIT:-128m}
  mailpit:
    # No-mail runs used 20–22 MiB; this cap also bounds a retained inbox.
    mem_limit: ${REZICS_MAILPIT_MEMORY_LIMIT:-256m}
