# Disposable QA storage; compose.qa-resources.yaml caps both storage modes.
services:
  postgres:
    healthcheck:
      start_period: 15s
      start_interval: 500ms
    tmpfs:
      - /var/lib/postgresql:mode=0777
    volumes: !override
      - ./postgres/00-owners.sh:/docker-entrypoint-initdb.d/00-owners.sh:ro,Z

  fuseki:
    environment:
      JVM_ARGS: ${REZICS_FUSEKI_JVM_ARGS:--Xms64m -Xmx512m -XX:MaxDirectMemorySize=128m}
    healthcheck:
      start_interval: 500ms
    # REZICS_FUSEKI_ASSEMBLER selects the product assembler when the stack must
    # admit the exclusive Work-name writer. The default keeps raw SPARQL update.
    command: ["/opt/apache-jena-fuseki-6.2.0/fuseki-server", "--port=3030", "--no-cors", "--timeout=10000", "--config=${REZICS_FUSEKI_ASSEMBLER:-/fuseki/fuseki-text-qa.ttl}"]
    volumes: !reset []
    tmpfs:
      - /fuseki/databases:mode=0777

  rustfs:
    healthcheck:
      start_interval: 500ms
    volumes: !reset []
    tmpfs:
      - /data:mode=0777
