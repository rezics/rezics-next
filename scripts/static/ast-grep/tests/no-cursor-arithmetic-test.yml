id: no-cursor-arithmetic
valid:
  - "const cursor = page.nextCursor; api.rows(id, cursor);"
  - "for (let cursor = first.nextCursor; cursor !== null;) { const page = await api.rows(id, cursor); cursor = page.nextCursor; }"
  - "const at = page.nextCursor; const later = size + 1;"
  - "const ordinal = index + 1; const count = rows.length - 1;"
  - "for (let offset = 0; offset < refs.length; offset += 64) { read(refs.slice(offset, offset + 64)); }"
  - "const offset = element.scrollLeft; const end = offset + element.clientWidth;"
  - "const offset = -new Date().getTimezoneOffset(); const hours = offset / 60;"
  - "const seek = rows[index - 1].position; api.get({ query: { after: seek } });"
  - "api.get({ query: { after: items[index - 1].occurrence } });"
  - "const result = { sequence: String(index + 1), after: reads + delay };"
  - "const seq = ++latest.current; if (seq !== latest.current) return;"
  - "if (BigInt(item.sequence) <= BigInt(readThrough)) return;"
  - "if (cursor === previous) throw new Error();"
  - "api.rows(id, -1);"
invalid:
  - "const seek = cursor + 1;"
  - "const seek = nextCursor - size;"
  - "cursor += size;"
  - "sequence -= 1;"
  - "api.get({ query: { cursor: index - 1 } });"
  - "api.get({ query: { before: seq - 1 } });"
  - "api.get({ query: { after: offset + size } });"
  - "api.get({ query: { offset: offset + size } });"
  - "api.get({ query: { sequence: count - 1 } });"
  - "api.rows(id, index - 1, { signal });"
  - "api.rows(id, Number(index) - 1, { signal });"
  - "const seek = Number(cursor) - 1;"
  - "const seek = BigInt(item.sequence) - 1n;"
  - "const seek = parseInt(cursor, 10) + 8;"
  - "const seek = Number(page.offset) + 1;"
  - "const at = page.nextCursor; const seek = at + 8;"
  - "let at = page.cursor; at += size;"
  - "const at = page.sequence; api.get({ query: { after: at - 1 } });"
  - "for (let at = first.nextCursor; at < total - 1; at += size) cursors.push(at);"
  - "for (let at = first.nextCursor; at < total - 1; at += size) { cursors.push(at); }"
  - "async function reloadRow(api, id, index, signal) { const page = await api.rows(id, index - 1, { signal }); return page.rows.find(row => row.index === index); }"
  - "const start = page.next; const at = start; api.rows(id, at + 8);"
  - "const start = page.nextCursor; const at = start; const seek = at + 8;"
  - "let at; at = page.nextCursor; const seek = at - 1;"
  - "const { nextCursor: at } = page; const seek = at + 1;"
  - "const { offset: at, items } = page; at += size;"
  - "const at = offset; const seek = at + 1;"
  - "const at = next; const seek = at - 1;"
  - "const seek = next + 1;"
  - "const seek = offset - 1;"
  - "offset += size;"
  - "const query = { cursor: index - 1 };"
  - "const query = { continuation: count + 1 };"
  - "const offset = page.nextCursor; const seek = offset + width;"

