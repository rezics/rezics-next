id: no-cursor-arithmetic
valid:
  - "const ordinal = index + 1; const count = rows.length - 1;"
  - "const offset = element.scrollTop; const bottom = offset + element.clientHeight; render(bottom);"
  - "const sequence = index; render(sequence + 1);"
  - "const cursor = element.scrollLeft; render(cursor + element.clientWidth);"
  - "const at = page.nextCursor; for (let at = 0; at < 5; at += 1) render(at);"
  - "for (let at = 0; at < total; at += size) render(at);"
  - "const at = page.nextCursor; const seek = at + 8; api.get({ query: { cursor: seek } });"
  - "const start = page.nextCursor; const middle = start; const at = middle; const seek = at + 8; api.get({ query: { cursor: seek } });"
  - "const { nextCursor: at } = page; const seek = at + 1;"
  - "const at = page.nextCursor; function render(at: number) { return at + 1; }"
  - "const at = page.nextCursor as number; at += 1;"
  - "const at = page.nextCursor ?? -1; at += 1;"
  - "const cursor = page.nextCursor; api.get({ query: { cursor } });"
  - "const next = page.nextCursor; if (next === previous) throw new Error();"
  - "api.get({ query: { after: items[index - 1].occurrence } });"
  - "const state = { offset: wide.scrollWidth - wide.width, after: reads + delay };"
  - "const query = { after: offset + 8 }; api.get(query);"
  - "const current = page.sequence + 1;"
  - "if (BigInt(item.sequence) <= BigInt(readThrough)) return;"
  - "api.rows(id, -1);"
invalid:
  - "const seek = page.nextCursor + 1;"
  - "const seek = page.next - 1;"
  - "const seek = page.cursor + size;"
  - "page.continuation += size;"
  - "page.offset -= 1;"
  - "const seek = item.seq - 1;"
  - "const seek = 1 + page.cursor;"
  - "const seek = (page.nextCursor as number) + 1;"
  - "const seek = page.nextCursor! - 1;"
  - "const seek = Number(page.cursor) + 1;"
  - "const seek = ((page.offset)) - 1;"
  - "const seek = Number((page.seq! as number)) + 1;"
  - "for (let at = first.nextCursor; at < total - 1; at += size) cursors.push(at);"
  - "for (let at = first.nextCursor; at < total - 1; at += size) { cursors.push(at); }"
  - "api.get({ query: { cursor: index - 1 } });"
  - "api.get({ query: { after: index + 1 } });"
  - "api.get({ query: { before: seq - 1 } });"
  - "api.get({ query: { offset: index * size } });"
  - "api.get({ query: { continuation: index / size } });"
  - "api.get({ query: { cursor: `${offset + 8}` } });"
  - "api.get({ query: { after: `${offset + 8}` } });"
  - "api.get({ query: { before: `${ordinal}` } });"
  - "api.get({ query: { offset: `${offset}` } });"
  - "api.get({ query: { continuation: `page-${index}` } });"
  - "api.get({ cursor: index - 1 });"
  - "new URLSearchParams({ after: `${offset + 8}` });"
  - "api.follows({ cursor: index + \"-next\" });"
  - "api.following({ after: `page-${index}` });"
  - "readPage({ before: index - 1, offset: index * size, continuation: `page-${index}` });"
  - "api.follows({ cursor: token }); api.follows({ cursor: index + \"-next\" });"

