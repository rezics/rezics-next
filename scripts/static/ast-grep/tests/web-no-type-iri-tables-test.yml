id: web-no-type-iri-tables
valid:
  - 'const label = typeLabel(types, locale);'
  - 'const docs = "https://schema.org/docs/gs.html";'
  - 'const work = `https://rezics.com/id/${id}`;'
  - 'const vocabulary = "https://rezics.com/vocab/";'
