id: web-links-use-address
valid:
  - "const address = { prefix: '/z/' as const, key: name, suffixSource: '' };"
  - "const address = { prefix: '/@', key: handle, suffixSource: '' };"
  - "const href = '/r/new';"
  - "const href = '/en/r/new';"
  - "const address = { prefix: '/w/', key: name, suffixSource: '' };"
  - "const href = resourceHref('/w/', id);"
  - "const href = identityHref('/concepts/', id);"
  - "const href = addressHref(work);"
  - "const href = spaceHref(space, 'community', ['about']);"
  - "const href = localizedPath(spaceHref(space, 'site'), 'en');"
  - "const path = \"/works/abc\";"
  - "const api = \"/v1/realms/abc\";"
  - "const x = <Link href={href} />;"
  - "// /w/abc is an example, not a link."
invalid:
  # Being a test does not exempt raw links; only named conformance files do.
  - "test('ordinary journey', () => visit('/en/r/private-books'));"
  - "test('raw UUID oracle', () => parse('/a/0199a0fe-0b21-7000-8000-123456789abc'));"
  - "const address = { prefix: '/w/' + id, key: name, suffixSource: '' };"
  - "const href = `${origin}/w/${id}`;"
  - "const link = <Link href=\"/w/example\" />;"
  - "const href = '/w/' + id;"
  - "const href = resourceHref('/w/' + id, id);"
  - "const href = \"/w/abc\";"
  - "const href = '/r/fiction';"
  - "const href = `/z/${ref}/characters`;"
  - "const href = `/en/e/${id}`;"
  - "const href = `/${locale}/concepts/${id}`;"
  - "const href = `/@${handle}`;"
  - "const href = \"https://rezics.com/en/a/abc\";"
  - "const href = \"/zh-Hans/w/abc\";"

