id: web-links-use-address
valid:
  - "const address = { prefix: '/z/' as const, key: name, slugSource: '' };"
  - "const address = { prefix: '/@', key: handle, slugSource: '' };"
  - "const href = '/r/new';"
  - "const href = '/en/r/new';"
  - "const address = { prefix: '/w/', key: name, slugSource: '' };"
  - "const href = resourceHref('/w/', id);"
  - "const href = identityHref('/concepts/', id);"
  - "const href = addressHref(work);"
  - "const path = \"/works/abc\";"
  - "const api = \"/v1/realms/abc\";"
  - "const x = <Link href={href} />;"
  - "// /w/abc is an example, not a link."
invalid:
  - "const address = { prefix: '/w/' + id, key: name, slugSource: '' };"
  - "const href = `${origin}/w/${id}`;"
  - "const link = <Link href=\"/w/example\" />;"
  - "const href = '/w/' + id;"
  - "const href = resourceHref('/w/' + id, id);"
  - "const href = \"/w/abc\";"
  - "const href = '/r/fiction';"
  - "const href = `/z/${ref}/characters`;"
  - "const href = `/en/e/${id}`;"
  - "const href = `/${locale}/concepts/${id}`;"
  - "const href = `/@${handle}`;"
  - "const href = \"https://rezics.com/en/a/abc\";"
  - "const href = \"/zh-Hans/w/abc\";"

