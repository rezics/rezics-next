id: web-links-use-address
language: TypeScript
severity: error
message: Build entity links with apps/web/features/address instead of string paths.
files:
  - apps/web/**/*.ts
ignores:
  - apps/web/features/address/**
  # Temporary wave-9 owner exceptions. The manager removes this list after the wave.
  - apps/web/features/discover/scope.ts
  - apps/web/features/realm/route.ts
  - apps/web/features/shell/communities-read.ts
  - apps/web/features/zones/fixtures.ts
  - apps/web/features/zones/official-fixtures.ts
  - apps/web/tests/g-644-entity-page.test.ts
  - apps/web/tests/g-655-zone-site.test.ts
  - apps/web/tests/g-921-zones.test.ts
  - apps/web/tests/g-943-address.e2e.ts
  - apps/web/tests/g-943-address.test.ts
  - apps/web/tests/profile.test.ts
  - apps/web/tests/realm.test.ts
  - apps/web/tests/work-page.test.ts
  - apps/web/tests/zone.test.ts
rule:
  any:
    - kind: string
    - kind: template_string
  not:
    any:
      - regex: '^[\x22\x27\x60]/(?:[A-Za-z]{2}(?:-[A-Za-z]+)?/)?r/new[\x22\x27\x60]$'
      - all:
        # These literals select a builder's entity family; they are not links.
        - regex: '^[''"\x60]/(?:@|(?:a|r|z|w|e|concepts)/)[''"\x60]$'
        - any:
            - inside:
                kind: arguments
                inside:
                  kind: call_expression
                  regex: '^(?:identityHref|resourceHref)\('
            - inside:
                kind: pair
                has:
                  field: key
                  regex: '^prefix$'
            - inside:
                kind: as_expression
                inside:
                  kind: pair
                  has:
                    field: key
                    regex: '^prefix$'
  regex: '^["''`]((?:https?://[^/]+|\$\{[^}]+\})?/(?:[A-Za-z]{2}(?:-[A-Za-z]+)?/|\$\{[^}]+\}/)?(?:r/|z/|w/|e/|a/|concepts/)|/(?:[A-Za-z]{2}(?:-[A-Za-z]+)?/|\$\{[^}]+\}/)?@)'

