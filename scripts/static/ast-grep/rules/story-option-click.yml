id: story-option-click
language: Tsx
severity: error
message: Stories click a combobox, listbox or menu option through chooseOption or chooseMenuItem, which wait for the popup to accept a pointer.
note: |
  A popup's entrance transition keeps pointer-events: none on its options, so a click found by role "option",
  "menuitem", "menuitemradio" or "menuitemcheckbox" fails under load. Import chooseOption or chooseMenuItem from
  apps/web/features/stories/choose-option.ts.
files:
  - apps/web/features/**/*.stories.tsx
ignores:
  - apps/web/features/stories/**
  # Owned by the showcase Goal; remove this line once its story uses chooseMenuItem.
  - apps/web/features/zones/look-menu.stories.tsx
rule:
  pattern: userEvent.$METHOD($TARGET)
constraints:
  METHOD:
    regex: ^(click|dblclick)$
  TARGET:
    any:
      - kind: call_expression
      - kind: await_expression
    regex: (?s)^(await\s+)?[^,]*?\.(find|get|query)(All)?ByRole\(\s*['"](option|menuitem|menuitemradio|menuitemcheckbox)['"]
