# Canonical syntax only: seek-member arithmetic, the nextCursor enumeration
# loop, and values passed directly as request seek properties. Aliases,
# shadowing and multi-step flows are intentionally out of scope. A
# TypeScript-AST repository check is the class-B follow-up for those flows.
id: no-cursor-arithmetic
language: TypeScript
files:
  - apps/web/**/*.ts
severity: error
message: Forward API continuations unchanged; do not derive seek positions with arithmetic.
ignores:
  - apps/web/features/api/**
  - apps/web/features/library/import-api.ts
  # Continuation conformance oracle: these templates are independent expected
  # request tokens, not product code manufacturing a continuation.
  - apps/web/features/zone-editor/navigation-read.test.ts
utils:
  wrapped-seek-member:
    any:
      - all:
          - kind: member_expression
          - has:
              field: property
              regex: '^(nextCursor|next|cursor|continuation|offset|seq)$'
      - all:
          - any:
              - kind: as_expression
              - kind: non_null_expression
              - kind: parenthesized_expression
          - has:
              matches: wrapped-seek-member
      - all:
          - pattern: Number($VALUE)
          - has:
              kind: arguments
              has:
                matches: wrapped-seek-member
  arithmetic:
    any:
      - pattern: $X + $N
      - pattern: $X - $N
      - pattern: $X += $N
      - pattern: $X -= $N
  request-value:
    any:
      - matches: arithmetic
      - pattern: $X * $N
      - pattern: $X / $N
      - pattern: $X % $N
      - pattern: $X ** $N
      - kind: template_string
rule:
  any:
    - all:
        - matches: arithmetic
        - has:
            matches: wrapped-seek-member
    - pattern: for (let $AT = $P.nextCursor; $COND; $AT += $SIZE) { $$$BODY }
    - pattern: for (let $AT = $P.nextCursor; $COND; $AT += $SIZE) $BODY
    - all:
        - kind: pair
        - has:
            field: key
            regex: '^(cursor|after|before|offset|continuation)$'
        - has:
            field: value
            matches: request-value
        - any:
            - inside:
                kind: pair
                has:
                  field: key
                  regex: '^(query|params|searchParams)$'
                stopBy: end
            - inside:
                kind: arguments
                inside:
                  any:
                    - pattern: $API.get($$$ARGS)
                    - pattern: $API.post($$$ARGS)
                    - pattern: $API.put($$$ARGS)
                    - pattern: $API.patch($$$ARGS)
                    - pattern: $API.delete($$$ARGS)
                    - pattern: new URLSearchParams($$$ARGS)
                stopBy: end

