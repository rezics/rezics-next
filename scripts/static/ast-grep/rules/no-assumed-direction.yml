id: no-assumed-direction
language: TypeScript
severity: error
message: Direction and language come from the record. Do not assume ltr or an empty lang.
files:
  - apps/web/features/**/*.js
  - apps/web/features/**/*.jsx
  - apps/web/features/**/*.ts
  - apps/web/features/**/*.tsx
  - apps/web/zones/**/*.js
  - apps/web/zones/**/*.jsx
  - apps/web/zones/**/*.ts
  - apps/web/zones/**/*.tsx
ignores:
  # Ratchet of object literals G-515 and G-516 have not moved onto the record's direction yet.
  - "apps/web/features/author/fixtures.ts"
  - "apps/web/features/catalogue/fixtures.ts"
  - "apps/web/features/concept/fixtures.ts"
  - "apps/web/features/discover/fixtures.ts"
  - "apps/web/features/feed/fixtures.ts"
  - "apps/web/features/feed/thread-api.ts"
  - "apps/web/features/feed/thread-fixtures.ts"
  - "apps/web/features/home/fixtures.ts"
  - "apps/web/features/library/fixtures.ts"
  - "apps/web/features/manage/fixtures.ts"
  - "apps/web/features/onboarding/welcome-fixtures.ts"
  - "apps/web/features/post-composer/api.ts"
  - "apps/web/features/profile/fixtures.ts"
  - "apps/web/features/realm/adapt.ts"
  - "apps/web/features/realm/modules.ts"
  - "apps/web/features/saved-filter/fixtures.ts"
  - "apps/web/features/studio/fixtures.ts"
  - "apps/web/features/work-page/fixtures.ts"
  - "apps/web/features/zones/adapt-cards.ts"
  - "apps/web/features/zones/browse-view.ts"
  - "apps/web/features/zones/fixtures.ts"
  - "apps/web/features/zones/official-fixtures.ts"
rule:
  any:
    - kind: pair
      all:
        - has:
            field: key
            regex: '^(?:dir|direction)$'
        - has:
            stopBy: end
            kind: string
            regex: '^[''"]ltr[''"]$'
    - kind: pair
      all:
        - has:
            field: key
            regex: '^lang$'
        - has:
            stopBy: end
            kind: string
            regex: '^[''"][''"]$'
