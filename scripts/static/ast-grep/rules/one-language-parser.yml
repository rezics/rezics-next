id: one-language-parser
language: TypeScript
severity: error
message: Language tags are parsed by the display-language module, not a local regex or Intl.getCanonicalLocales.
files:
  - apps/**/*.js
  - apps/**/*.jsx
  - apps/**/*.ts
  - apps/**/*.tsx
  - services/**/*.js
  - services/**/*.jsx
  - services/**/*.ts
  - services/**/*.tsx
  - packages/**/*.js
  - packages/**/*.jsx
  - packages/**/*.ts
  - packages/**/*.tsx
ignores:
  # The display-language module is the one parser.
  - services/main/src/modules/display-language/**
  # Persisted-profile patterns emitted from model definitions.
  - packages/model/src/generated/**
rule:
  all:
    - any:
        - pattern: Intl.getCanonicalLocales($$$ARGS)
        - kind: regex
          regex: '\[(?:a-z|A-Za-z|a-zA-Z)\]\{2,[0-9]+\}'
        - kind: string
          regex: '\[(?:a-z|A-Za-z|a-zA-Z)\]\{2,[0-9]+\}'
        - kind: string_fragment
          regex: '\[(?:a-z|A-Za-z|a-zA-Z)\]\{2,[0-9]+\}'
    # Frozen node text. A different parser still matches, including one in a file
    # that used to be exempt as a whole. Locations are one-language-parser-debt.json.
    - not:
        any:
          - regex: '^''\^\[A-Za-z\]\{2,8\}\(-\[A-Za-z0-9\]\{1,8\}\)\*\$''$'
          - regex: '^''\^\[a-z\]\{2,3\}\(-\[A-Za-z0-9\]\{1,8\}\)\*\$''$'
          - regex: '^''\^\[a-z\]\{2,3\}\(-\[A-Za-z0-9\]\{2,8\}\)\*\$''$'
          - regex: '^''\^\[a-z\]\{2,3\}\(\?:-\[A-Za-z0-9\]\{2,8\}\)\*\$''$'
          - regex: '^/\^\[A-Za-z\]\{2,8\}\(-\[A-Za-z0-9\]\{1,8\}\)\*\$/$'
          - regex: '^/\^\[a-z\]\{2,3\}\(-\[A-Za-z0-9\]\{1,8\}\)\*\$/$'
          - regex: '^/\^\[a-z\]\{2,3\}\(-\[A-Za-z0-9\]\{1,8\}\)\*\$/i$'
          - regex: '^/\^\[a-z\]\{2,3\}\(-\[A-Za-z0-9\]\{1,8\}\)\{0,4\}\$/i$'
          - regex: '^/\^\[a-z\]\{2,3\}\(-\[A-Za-z0-9\]\{2,8\}\)\*\$/$'
          - regex: '^/\^\[a-z\]\{2,3\}\(-\[A-Za-z0-9\]\{2,8\}\)\*\$/u$'
          - regex: '^/\^\[a-z\]\{2,3\}\(\?:-\[A-Za-z0-9\]\{1,8\}\)\*\$/$'
          - regex: '^/\^\[a-z\]\{2,3\}\(\?:-\[A-Za-z0-9\]\{1,8\}\)\*\$/u$'
          - regex: '^/\^\[a-z\]\{2,3\}\(\?:-\[A-Za-z0-9\]\{2,8\}\)\*\$/$'
          - regex: '^/\^\[a-z\]\{2,3\}\(\?:-\[a-z0-9\]\{1,8\}\)\*\$/i$'
          - regex: '^/\^\[a-z\]\{2,3\}\(\?:-\[a-z0-9\]\{2,8\}\)\*\$/$'
          - regex: '^/\^\[a-z\]\{2,3\}\(\?:-\[a-z0-9\]\{2,8\}\)\*\$/i$'
          - regex: '^Intl\.getCanonicalLocales\(language\)$'
          - regex: '^Intl\.getCanonicalLocales\(tag\)$'
          - regex: '^Intl\.getCanonicalLocales\(trimmed\)$'
          - regex: '^Intl\.getCanonicalLocales\(value\)$'
          - regex: '^\^\[A-Za-z\]\{2,8\}\(-\[A-Za-z0-9\]\{1,8\}\)\*\$$'
          - regex: '^\^\[a-z\]\{2,3\}\(-\[A-Za-z0-9\]\{1,8\}\)\*\$$'
          - regex: '^\^\[a-z\]\{2,3\}\(-\[A-Za-z0-9\]\{2,8\}\)\*\$$'
          - regex: '^\^\[a-z\]\{2,3\}\(\?:-\[A-Za-z0-9\]\{2,8\}\)\*\$$'
