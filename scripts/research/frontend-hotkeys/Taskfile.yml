version: '3'

tasks:
  prepare:
    desc: Prepare private keyboard fixture and exact-pin trial configuration.
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - node scripts/research/frontend-hotkeys/prepare.mjs
  fixture:dev:
    dir: '{{.USER_WORKING_DIR}}/.temp/frontend-hotkeys/fixture'
    cmds:
      - node ../../../node_modules/vinext/dist/cli.js dev --host 127.0.0.1 {{.CLI_ARGS}}
  behavior:
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - node scripts/research/frontend-hotkeys/behavior.mjs
  routes:
    desc: Build private Web and Accounts copies sequentially with host admission.
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - node scripts/research/frontend-hotkeys/routes.mjs {{.CLI_ARGS}}
  route:preview:
    dir: '{{env "KEYBOARD_PREVIEW_CWD"}}'
    cmds:
      - node ../../node_modules/vite/bin/vite.js preview --host 127.0.0.1 {{.CLI_ARGS}}
  validate:
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - node scripts/research/frontend-hotkeys/validate.mjs
